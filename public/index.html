<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
<meta name="theme-color" content="#121212" />
<meta name="color-scheme" content="dark" />
<title>Set Log</title>
<link rel="manifest" href="/manifest.webmanifest" />
<link rel="icon" href="/icons/icon.svg" type="image/svg+xml" />
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Set Log" />
<style>
  :root{
    --bg:#121212;
    --surface:#181818;
    --surface-2:#1f1f1f;
    --card:#181818;
    --border:#2a2a2a;
    --text:#ffffff;
    --text-dim:#b3b3b3;
    --text-faint:#7c7c7c;
    --accent:#1ed760;
    --accent-dim:#169c46;
    --negative:#f3727f;
    --warning:#ffa42b;
    --info:#539df5;
    --ease-out: cubic-bezier(0.23,1,0.32,1);
    --ease-in-out: cubic-bezier(0.77,0,0.175,1);
    --radius-s:4px;
    --radius-m:8px;
    --radius-l:16px;
    --shadow-med: rgba(0,0,0,0.3) 0px 8px 8px;
    --shadow-heavy: rgba(0,0,0,0.5) 0px 8px 24px;
  }

  *{box-sizing:border-box;}
  html{
    -webkit-tap-highlight-color: transparent;
    -webkit-text-size-adjust: 100%;
    overscroll-behavior: none;
    height:100%;
  }
  body{
    margin:0;
    height:100%;
    background:var(--bg);
    color:var(--text);
    font-family:-apple-system, BlinkMacSystemFont, "Helvetica Neue", Helvetica, Arial, sans-serif;
    -webkit-font-smoothing:antialiased;
    overscroll-behavior:none;
  }
  input, textarea, select{ font-size:16px; font-family:inherit; }
  button, a, [role="button"]{
    touch-action: manipulation;
    user-select:none;
    -webkit-user-select:none;
    -webkit-touch-callout:none;
  }

  #app{
    display:flex;
    flex-direction:column;
    height:100dvh;
    max-width:520px;
    margin:0 auto;
    position:relative;
  }

  /* ---------- Header ---------- */
  header{
    flex:0 0 auto;
    padding:calc(10px + env(safe-area-inset-top,0px)) 12px 10px;
    background:var(--bg);
    border-bottom:1px solid var(--border);
  }
  .header-top{
    display:flex;
    align-items:flex-start;
    justify-content:space-between;
    gap:10px;
    margin-bottom:10px;
  }
  .day-name{ min-width:0; flex:1; }
  .day-name .weekday{
    font-size:17px;
    font-weight:700;
    display:block;
    line-height:1.25;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
  }
  .day-name .plan-title{
    font-size:13px;
    color:var(--accent);
    font-weight:700;
    display:block;
    line-height:1.3;
    margin-top:1px;
  }
  .today-btn{
    flex:0 0 auto;
    background:var(--surface-2);
    color:var(--text);
    border:none;
    border-radius:9999px;
    padding:0 16px;
    height:36px;
    min-width:64px;
    align-self:center;
    font-size:11px;
    font-weight:700;
    letter-spacing:1.4px;
    text-transform:uppercase;
    transition:transform 140ms var(--ease-out), background 140ms var(--ease-out);
    white-space:nowrap;
  }
  .today-btn:active{ transform:scale(0.94); background:var(--border); }
  @media (hover:hover) and (pointer:fine){
    .today-btn:hover{ background:var(--border); }
  }
  .date-row{
    display:flex;
    align-items:center;
    gap:8px;
  }
  .icon-btn{
    background:var(--surface-2);
    border:none;
    color:var(--text);
    width:40px;
    height:40px;
    flex:0 0 40px;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:18px;
    font-weight:700;
    padding:0;
    transition:transform 140ms var(--ease-out), background 140ms var(--ease-out);
  }
  .icon-btn:active{ transform:scale(0.88); background:var(--border); }
  @media (hover:hover) and (pointer:fine){
    .icon-btn:hover{ background:var(--border); }
  }
  .date-input-wrap{
    flex:1 1 0;
    min-width:0;
    position:relative;
    height:40px;
    border-radius:9999px;
    background:var(--surface-2);
    overflow:hidden;
  }
  .date-input-wrap .date-display{
    position:absolute;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:14px;
    font-weight:700;
    color:var(--text);
    pointer-events:none;
    white-space:nowrap;
  }
  /* The real date input sits invisibly on top so tapping opens the native picker,
     while iOS can't stretch or restyle what's shown. */
  .date-input-wrap input[type=date]{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    min-width:0;
    margin:0;
    padding:0;
    border:none;
    opacity:0;
    -webkit-appearance:none;
    appearance:none;
    font-size:16px;
    cursor:pointer;
  }
  .date-input-wrap:active{ background:var(--border); }

  /* ---------- Content ---------- */
  #content{
    flex:1 1 auto;
    overflow-y:auto;
    overscroll-behavior:contain;
    padding:16px 16px 24px;
    -webkit-overflow-scrolling:touch;
  }

  .rest-day{
    text-align:center;
    padding:60px 20px;
    color:var(--text-dim);
  }
  .rest-day .big{
    font-size:22px;
    font-weight:700;
    color:var(--text);
    margin-bottom:8px;
  }

  .card{
    background:var(--card);
    border-radius:var(--radius-m);
    padding:14px 14px 10px;
    margin-bottom:12px;
    box-shadow:var(--shadow-med);
  }
  .card-head{
    display:flex;
    flex-wrap:wrap;
    justify-content:space-between;
    align-items:baseline;
    margin-bottom:10px;
    gap:4px 8px;
  }
  .card-head .name{
    font-size:16px;
    font-weight:700;
    line-height:1.3;
    flex:1 1 auto;
    min-width:0;
  }
  .card-head .meta{
    font-size:12px;
    color:var(--text-dim);
    white-space:nowrap;
    font-weight:400;
    flex:0 0 auto;
  }
  .card.optional{ border:1px solid var(--border); }

  /* ---------- Collapsible exercise cards ---------- */
  .ex-card{ padding:0; }
  .ex-card .card-head{
    display:flex;
    align-items:center;
    gap:10px;
    margin:0;
    padding:14px;
    cursor:pointer;
    border-radius:var(--radius-m);
    user-select:none;
    -webkit-user-select:none;
    touch-action:manipulation;
    transition:background 140ms var(--ease-out);
  }
  .ex-card .card-head:active{ background:var(--surface-2); }
  .ex-card .card-head:focus-visible{ outline:2px solid var(--accent); outline-offset:-2px; }
  .ex-card .head-text{ flex:1; min-width:0; }
  .ex-card .head-text .name{ display:block; }
  .ex-card .head-text .meta{ display:block; margin-top:2px; white-space:normal; }
  .progress-chip{
    flex:0 0 auto;
    font-size:12px;
    font-weight:700;
    color:var(--text-dim);
    background:var(--surface-2);
    border-radius:9999px;
    padding:4px 10px;
    font-variant-numeric:tabular-nums;
  }
  .progress-chip.complete{ background:var(--accent); color:#050f08; }
  .chevron{
    flex:0 0 auto;
    width:28px; height:28px;
    display:flex; align-items:center; justify-content:center;
    color:var(--text-dim);
    font-size:14px;
    transition:transform 220ms var(--ease-out);
  }
  .ex-card.collapsed .chevron{ transform:rotate(-90deg); }
  .ex-body-wrap{
    display:grid;
    grid-template-rows:1fr;
    transition:grid-template-rows 220ms var(--ease-out);
  }
  .ex-card.collapsed .ex-body-wrap{ grid-template-rows:0fr; }
  .ex-body{
    overflow:hidden;
    min-height:0;
  }
  .ex-body-inner{
    padding:0 14px 10px;
    transition:opacity 180ms var(--ease-out);
  }
  .ex-card.collapsed .ex-body-inner{ opacity:0; }
  .collapse-controls{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin:0 0 8px;
  }
  .collapse-controls .section-label{ margin:0; }
  .text-btn{
    background:none;
    border:none;
    color:var(--text-dim);
    font-size:11px;
    font-weight:700;
    letter-spacing:1.2px;
    text-transform:uppercase;
    height:36px;
    padding:0 4px;
    transition:color 140ms var(--ease-out), transform 140ms var(--ease-out);
  }
  .text-btn:active{ transform:scale(0.95); color:var(--text); }
  @media (prefers-reduced-motion: reduce){
    .ex-body-wrap, .chevron, .ex-body-inner{ transition:none; }
  }
  .optional-tag{
    display:inline-block;
    font-size:10px;
    font-weight:600;
    text-transform:capitalize;
    color:var(--warning);
    background:rgba(255,164,43,0.12);
    padding:2px 8px;
    border-radius:9999px;
    margin-left:6px;
  }

  .set-row{
    display:grid;
    grid-template-columns:20px 1fr 1fr 44px;
    gap:6px;
    align-items:center;
    padding:5px 0;
  }
  .set-row .idx{
    font-size:13px;
    color:var(--text-faint);
    font-weight:700;
  }
  .set-row input{
    background:var(--surface-2);
    border:none;
    color:var(--text);
    border-radius:var(--radius-s);
    padding:11px 6px;
    width:100%;
    min-width:0;
    text-align:center;
    box-shadow: rgb(18,18,18) 0px 1px 0px, rgb(60,60,60) 0px 0px 0px 1px inset;
    transition:box-shadow 140ms var(--ease-out);
  }
  .set-row input:focus{
    outline:none;
    box-shadow: rgb(18,18,18) 0px 1px 0px, rgb(124,124,124) 0px 0px 0px 1px inset;
  }
  .set-row input::placeholder{ color:var(--text-faint); }
  .set-row.done input{ opacity:0.5; }
  .check-btn{
    width:40px;
    height:40px;
    border-radius:50%;
    border:1.5px solid var(--text-faint);
    background:transparent;
    color:transparent;
    font-size:17px;
    font-weight:700;
    transition:transform 140ms var(--ease-out), background 140ms var(--ease-out), border-color 140ms var(--ease-out), color 140ms var(--ease-out);
    justify-self:center;
  }
  .check-btn:active{ transform:scale(0.88); }
  .check-btn.on{
    background:var(--accent);
    border-color:var(--accent);
    color:#050f08;
  }

  .field-labels{
    display:grid;
    grid-template-columns:20px 1fr 1fr 44px;
    gap:6px;
    margin-bottom:2px;
  }
  .field-labels span{
    font-size:10px;
    color:var(--text-faint);
    text-transform:uppercase;
    letter-spacing:1px;
    text-align:center;
    font-weight:600;
  }
  .field-labels span:first-child{ text-align:left; }
  .field-labels span:last-child{ visibility:hidden; }

  .cardio-card{
    display:flex;
    align-items:center;
    gap:10px;
    flex-wrap:wrap;
  }
  .cardio-card .cinfo{ flex:1 1 140px; min-width:0; }
  .cardio-card .cname{ font-size:16px; font-weight:700; }
  .cardio-card .ctarget{ font-size:12px; color:var(--text-dim); margin-top:2px; }
  .cardio-card input{
    background:var(--surface-2);
    border:none;
    color:var(--text);
    border-radius:var(--radius-s);
    padding:11px 8px;
    height:44px;
    width:72px;
    flex:0 0 auto;
    text-align:center;
    box-shadow: rgb(18,18,18) 0px 1px 0px, rgb(60,60,60) 0px 0px 0px 1px inset;
  }
  .cardio-card input:focus{ outline:none; box-shadow: rgb(18,18,18) 0px 1px 0px, rgb(124,124,124) 0px 0px 0px 1px inset; }
  .done-pill{
    background:var(--surface-2);
    border:none;
    color:var(--text-dim);
    border-radius:9999px;
    padding:0 18px;
    height:44px;
    font-size:11px;
    font-weight:700;
    letter-spacing:1.2px;
    text-transform:uppercase;
    transition:transform 140ms var(--ease-out), background 140ms var(--ease-out), color 140ms var(--ease-out);
    white-space:nowrap;
    flex:0 0 auto;
  }
  .done-pill:active{ transform:scale(0.95); }
  .done-pill.on{ background:var(--accent); color:#050f08; }

  .section-label{
    font-size:12px;
    font-weight:700;
    text-transform:uppercase;
    letter-spacing:1.4px;
    color:var(--text-dim);
    margin:18px 0 8px;
  }
  .section-label:first-child{ margin-top:0; }

  /* ---------- Progress tab ---------- */
  .select-wrap{ margin-bottom:16px; }
  select#exercise-select{
    width:100%;
    background:var(--surface-2);
    color:var(--text);
    border:none;
    border-radius:9999px;
    padding:12px 16px;
    font-size:14px;
    font-weight:700;
    box-shadow: rgb(18,18,18) 0px 1px 0px, rgb(60,60,60) 0px 0px 0px 1px inset;
    appearance:none;
    -webkit-appearance:none;
  }
  .chart-card{
    background:var(--card);
    border-radius:var(--radius-m);
    padding:16px;
    margin-bottom:16px;
    box-shadow:var(--shadow-med);
  }
  .chart-card .chart-empty{
    text-align:center;
    color:var(--text-faint);
    font-size:13px;
    padding:30px 0;
  }
  .history-row{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:10px 0;
    border-bottom:1px solid var(--border);
    font-size:13px;
  }
  .history-row:last-child{ border-bottom:none; }
  .history-row .hdate{ color:var(--text-dim); }
  .history-row .hval{ font-weight:700; }

  /* ---------- Tab bar ---------- */
  nav.tabs{
    flex:0 0 auto;
    display:flex;
    background:var(--bg);
    border-top:1px solid var(--border);
    padding:6px 12px calc(6px + env(safe-area-inset-bottom,0px));
  }
  nav.tabs button{
    flex:1;
    background:none;
    border:none;
    color:var(--text-faint);
    font-size:11px;
    font-weight:700;
    letter-spacing:1.2px;
    text-transform:uppercase;
    min-height:44px;
    padding:8px 0;
    border-radius:var(--radius-s);
    transition:color 140ms var(--ease-out), transform 140ms var(--ease-out);
  }
  nav.tabs button:active{ transform:scale(0.95); }
  nav.tabs button.active{ color:var(--accent); }

  /* ---------- Rest bar ---------- */
  #rest-bar{
    position:fixed;
    left:0; right:0; bottom:0;
    max-width:520px;
    margin:0 auto;
    background:var(--surface-2);
    box-shadow:var(--shadow-heavy);
    transform:translateY(100%);
    transition:transform 260ms var(--ease-out);
    z-index:20;
    padding-bottom:env(safe-area-inset-bottom,0px);
  }
  #rest-bar.show{ transform:translateY(0); }
  .rest-inner{
    display:flex;
    align-items:center;
    gap:10px;
    padding:12px 12px;
    cursor:pointer;
  }
  .rest-ring{
    width:52px; height:52px;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:14px;
    font-weight:700;
    background:conic-gradient(var(--accent) calc(var(--pct,0)*1%), var(--border) 0);
    flex:0 0 auto;
    position:relative;
  }
  .rest-ring::after{
    content:"";
    position:absolute;
    inset:4px;
    border-radius:50%;
    background:var(--surface-2);
  }
  .rest-ring span{ position:relative; z-index:1; }
  .rest-info{ flex:1; min-width:0; }
  .rest-info .rname{ font-size:13px; color:var(--text-dim); font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .rest-info .rlabel{ font-size:11px; color:var(--text-faint); text-transform:uppercase; letter-spacing:1px; margin-top:1px; }
  .rest-actions{ display:flex; gap:6px; align-items:center; }
  .rest-actions button{
    background:var(--surface);
    border:none;
    color:var(--text);
    border-radius:9999px;
    width:40px; height:40px;
    font-size:13px;
    font-weight:700;
    transition:transform 140ms var(--ease-out);
  }
  .rest-actions button:active{ transform:scale(0.88); }
  .rest-actions .skip{
    width:auto;
    height:40px;
    padding:0 14px;
    font-size:10px;
    letter-spacing:1px;
    text-transform:uppercase;
    color:var(--text-dim);
  }

  .tab-panel{
    animation: panelIn 220ms var(--ease-out);
  }
  @keyframes panelIn{
    from{ opacity:0; transform:translateY(6px) scale(0.99); }
    to{ opacity:1; transform:translateY(0) scale(1); }
  }

  /* ---------- Full-screen rest overlay ---------- */
  #rest-screen{
    position:fixed;
    inset:0;
    max-width:520px;
    margin:0 auto;
    background:var(--bg);
    z-index:30;
    display:flex;
    flex-direction:column;
    transform:translateY(100%);
    transition:transform 320ms cubic-bezier(0.32,0.72,0,1);
  }
  #rest-screen.show{ transform:translateY(0); }
  .rs-top{
    flex:0 0 auto;
    display:flex;
    justify-content:flex-end;
    gap:10px;
    padding:calc(14px + env(safe-area-inset-top,0px)) 16px 4px;
  }
  .rs-minimize{
    width:40px; height:40px;
    border-radius:50%;
    border:none;
    background:var(--surface-2);
    color:var(--text-dim);
    font-size:18px;
    font-weight:700;
    transition:transform 140ms var(--ease-out), background 140ms var(--ease-out);
  }
  .rs-minimize:active{ transform:scale(0.88); background:var(--border); }
  .rs-minimize{ display:flex; align-items:center; justify-content:center; }
  .rs-minimize svg{ width:18px; height:18px; }
  .rs-body{
    flex:1 1 auto;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    padding:0 24px calc(24px + env(safe-area-inset-bottom,0px));
    text-align:center;
  }
  .rs-label{
    font-size:12px;
    font-weight:700;
    text-transform:uppercase;
    letter-spacing:2px;
    color:var(--accent);
    margin-bottom:6px;
  }
  .rs-exercise{
    font-size:18px;
    font-weight:700;
    color:var(--text-dim);
    margin-bottom:32px;
  }
  .rs-ring-wrap{
    width:min(66vw, 260px);
    height:min(66vw, 260px);
    border-radius:50%;
    background:conic-gradient(var(--accent) calc(var(--pct,0)*1%), var(--surface-2) 0);
    display:flex;
    align-items:center;
    justify-content:center;
    position:relative;
    margin-bottom:36px;
    transition:background 900ms linear;
  }
  .rs-ring-wrap::after{
    content:"";
    position:absolute;
    inset:10px;
    border-radius:50%;
    background:var(--bg);
  }
  .rs-time{
    position:relative;
    z-index:1;
    font-size:52px;
    font-weight:700;
    font-variant-numeric:tabular-nums;
    letter-spacing:-1px;
  }
  .rs-done-check{
    position:relative;
    z-index:1;
    color:var(--accent);
    font-size:64px;
    line-height:1;
  }
  .rs-adjust{
    display:flex;
    gap:14px;
    margin-bottom:28px;
  }
  .rs-adjust button{
    background:var(--surface-2);
    border:none;
    color:var(--text);
    border-radius:9999px;
    padding:0 22px;
    height:48px;
    font-size:14px;
    font-weight:700;
    transition:transform 140ms var(--ease-out), background 140ms var(--ease-out);
  }
  .rs-adjust button:active{ transform:scale(0.94); background:var(--border); }
  .rs-skip{
    width:100%;
    max-width:280px;
    background:var(--surface-2);
    border:none;
    color:var(--text);
    border-radius:9999px;
    height:52px;
    font-size:13px;
    font-weight:700;
    letter-spacing:1.6px;
    text-transform:uppercase;
    transition:transform 140ms var(--ease-out), background 140ms var(--ease-out);
  }
  .rs-skip:active{ transform:scale(0.96); }
  .rs-skip.primary{ background:var(--accent); color:#050f08; }
  .rs-adjust{ align-items:center; }
  .rs-pause{
    width:64px !important;
    height:64px !important;
    padding:0 !important;
    border-radius:50% !important;
    background:var(--accent) !important;
    color:#050f08 !important;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .rs-pause svg{ width:22px; height:22px; }
  .rest-actions .rest-pause{ display:flex; align-items:center; justify-content:center; color:var(--accent); }
  .rs-time{ transition:opacity 200ms ease; }
  #rest-screen.paused .rs-time{ opacity:0.45; }
  #rest-screen.paused .rs-label{ color:var(--warning); }
  #rest-bar.paused #rest-time{ opacity:0.5; }

  /* ---------- Auth screen ---------- */
  #auth-screen{
    position:fixed; inset:0;
    background:var(--bg);
    z-index:50;
    display:none;
    align-items:center;
    justify-content:center;

  .auth-box input:focus{ outline:none; box-shadow: rgb(18,18,18) 0px 1px 0px, rgb(124,124,124) 0px 0px 0px 1px inset; }
  .auth-btn{
    width:100%;

  .auth-btn[disabled]{ opacity:0.6; }

  .sync-dot{

  /* ---------- Plans ---------- */
  .plans-panel, .plan-editor{ padding-top:calc(4px + env(safe-area-inset-top,0px)); }

  .pill-btn:active{ transform:scale(0.95); background:var(--border); }

  }
  .week-dots{ display:flex; gap:6px; margin:12px 0 14px; }
  .week-dot{
    width:28px; height:28px; border-radius:50%;
    display:flex; align-items:center; justify-content:center;

  .editor-top{ display:flex; align-items:center; gap:10px; margin-bottom:12px; }

  .day-chips{
    display:flex; gap:5px; overflow-x:auto; margin:0 0 16px; padding:2px 0;

  .day-chips::-webkit-scrollbar{ display:none; }
  .day-chip{
    flex:1 1 0;
    min-width:44px; height:40px; padding:0 4px;

  .day-chip.has::after{
    content:""; position:absolute; bottom:5px; left:50%;

  .field-label{

<body>
<div id="auth-screen">
  <form class="auth-box" id="auth-form">
    <h1 class="auth-title">Set <span>Log</span></h1>
    <p class="auth-sub">Sign in to sync your sets across devices.</p>
    <label for="auth-email">Email</label>
    <input id="auth-email" type="email" autocomplete="email" autocapitalize="none" autocorrect="off" required />
    <label for="auth-password">Password</label>
    <input id="auth-password" type="password" autocomplete="current-password" required />
    <button class="auth-btn" id="auth-submit" type="submit" enterkeyhint="go">Sign in</button>
    <div class="auth-error" id="auth-error" role="alert"></div>
  </form>
</div>

<div id="app">
  <header id="app-header">
    <div class="header-top">
      <div class="day-name">
        <span class="weekday" id="weekday-label">—</span>
        <span class="plan-title"><span id="plan-title-label">—</span><span class="sync-dot" id="sync-dot" title="Synced"></span></span>
      </div>
      <button class="today-btn" id="today-btn">Today</button>
    </div>
    <div class="date-row">
      <button class="icon-btn" id="prev-day" aria-label="Previous day">&#8249;</button>
      <label class="date-input-wrap">
        <span class="date-display" id="date-display">—</span>
        <input type="date" id="date-input" aria-label="Pick a date" />
      </label>
      <button class="icon-btn" id="next-day" aria-label="Next day">&#8250;</button>
    </div>
  </header>

  <main id="content"></main>

  <nav class="tabs">
    <button data-tab="today" class="active">Today</button>
    <button data-tab="progress">Progress</button>
    <button data-tab="plans">Plans</button>
  </nav>

  <div id="rest-bar">
    <div class="rest-inner">
      <div class="rest-ring"><span id="rest-time">0:00</span></div>
      <div class="rest-info">
        <div class="rname" id="rest-name">Rest</div>
        <div class="rlabel">Rest timer</div>
      </div>
      <div class="rest-actions">
        <button id="rest-minus">−15</button>
        <button class="rest-pause" id="rest-pause" aria-label="Pause timer"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><rect x="3" y="2" width="3.5" height="12" rx="1" fill="currentColor"/><rect x="9.5" y="2" width="3.5" height="12" rx="1" fill="currentColor"/></svg></button>
        <button id="rest-plus">+15</button>
        <button class="skip" id="rest-skip">Skip</button>
      </div>
    </div>
  </div>

  <div id="rest-screen">
    <div class="rs-top">
      <button class="rs-minimize" id="rs-minimize" aria-label="Minimize timer"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><rect x="3" y="7.25" width="10" height="1.5" rx="0.75" fill="currentColor"/></svg></button>
      <button class="rs-minimize rs-close" id="rs-close" aria-label="Stop timer"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M4 4l8 8M12 4l-8 8" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg></button>
    </div>
    <div class="rs-body">
      <div class="rs-label" id="rs-label">Rest</div>
      <div class="rs-exercise" id="rs-exercise">Exercise</div>
      <div class="rs-ring-wrap" id="rs-ring-wrap"><span class="rs-time" id="rs-time-big">0:00</span></div>
      <div class="rs-adjust">
        <button id="rs-minus">−15s</button>
        <button class="rs-pause" id="rs-pause" aria-label="Pause timer"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><rect x="3" y="2" width="3.5" height="12" rx="1" fill="currentColor"/><rect x="9.5" y="2" width="3.5" height="12" rx="1" fill="currentColor"/></svg></button>
        <button id="rs-plus">+15s</button>
      </div>
      <button class="rs-skip" id="rs-skip-full">Skip rest</button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/config.js"></script>
<script>
(function(){
  "use strict";

  /* ---------------- Plan data ---------------- */
  /* Built-in starter plan: used to seed your first plan profile. */
  var DEFAULT_DAYS = {
    1: { title:"Legs", exercises:[
      {key:"back-squat", name:"Barbell Back Squat", sets:4, reps:"6-8", rest:150},
      {key:"rdl", name:"Romanian Deadlift", sets:4, reps:"8-10", rest:90},

      {key:"walking-lunges", name:"Walking Lunges", sets:4, reps:"10/leg", rest:60},
      {key:"leg-curl", name:"Leg Curl", sets:4, reps:"12-15", rest:60},

    ], cardio:[

    ]},
    2: { title:"Push + Triceps Finisher", exercises:[
      {key:"bench-press", name:"Barbell Bench Press", sets:4, reps:"6-8", rest:150},
      {key:"ohp", name:"Overhead Press", sets:4, reps:"8-10", rest:90},
      {key:"incline-db-press", name:"Incline Dumbbell Press", sets:4, reps:"10-12", rest:90},
      {key:"lateral-raise", name:"Lateral Raise", sets:4, reps:"12-15", rest:60},
      {key:"cable-fly", name:"Cable Chest Fly", sets:4, reps:"12-15", rest:45},
      {key:"close-grip-bench", name:"Close-Grip Bench / Dips", sets:4, reps:"8-10", rest:90},
      {key:"ohe-triceps", name:"Overhead Triceps Extension", sets:4, reps:"10-12", rest:60},
      {key:"triceps-pushdown", name:"Triceps Pushdown", sets:4, reps:"12-15", rest:45}
    ], cardio:[
      {key:"incline-walk-tue", name:"Incline Walk", kind:"duration", target:"20–30 min"}
    ]},
    3: { title:"Padel + Light Pull/Upper", exercises:[
      {key:"lat-pulldown", name:"Lat Pulldown", sets:4, reps:"10-12", rest:90},
      {key:"seated-row", name:"Seated Cable Row", sets:4, reps:"10-12", rest:90},
      {key:"face-pull", name:"Face Pull", sets:4, reps:"15", rest:60},
      {key:"db-curl", name:"Dumbbell Bicep Curl", sets:4, reps:"12-15", rest:45},
      {key:"hammer-curl-wed", name:"Hammer Curl", sets:4, reps:"12-15", rest:45}
    ], cardio:[
      {key:"padel", name:"Padel", kind:"done", target:"Match / session"}
    ]},
    4: { title:"Pull + Biceps Finisher + Easy Run", exercises:[
      {key:"deadlift-row", name:"Deadlift or Barbell Row", sets:4, reps:"6-8", rest:150},
      {key:"pullup", name:"Weighted Pull-up / Lat Pulldown", sets:4, reps:"8-10", rest:90},
      {key:"one-arm-row", name:"One-arm Dumbbell Row", sets:4, reps:"10-12", rest:90},
      {key:"rear-delt-fly", name:"Rear Delt Fly", sets:4, reps:"12-15", rest:60},
      {key:"barbell-curl", name:"Barbell / EZ-Bar Curl", sets:4, reps:"8-10", rest:60},
      {key:"incline-curl", name:"Incline Dumbbell Curl", sets:4, reps:"10-12", rest:45},
      {key:"rope-hammer-curl", name:"Cable/Rope Hammer Curl", sets:4, reps:"12-15", rest:45}
    ], cardio:[
      {key:"easy-run", name:"Easy Run", kind:"distance", target:"3–4 km"}
    ]},
    5: { title:"Swim", exercises:[], cardio:[
      {key:"swim", name:"Swim", kind:"duration", target:"Technique / endurance"}
    ]},
    6: { title:"Long Run", exercises:[], cardio:[
      {key:"long-run", name:"Long Run", kind:"distance", target:"Build to 10k"}
    ]},
    0: { title:"Rest", exercises:[], cardio:[] }
  };

  var WEEKDAY_NAMES = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];

  function pad(n){ return String(n).padStart(2,"0"); }
  function todayStr(){
    var d = new Date();
    return d.getFullYear() + "-" + pad(d.getMonth()+1) + "-" + pad(d.getDate());
  }
  function dowFromDateStr(s){ return new Date(s + "T00:00:00").getDay(); }

  /* Local cache: every write lands here first, so logging works with bad gym signal.
     Anything not yet confirmed by Supabase sits in a pending queue and retries. */
  var CACHE_PREFIX = "setlog:";
  var PENDING_KEY = "setlog:pending";
  function cacheGet(date){
    try{ var raw = localStorage.getItem(CACHE_PREFIX + date); return raw ? JSON.parse(raw) : null; }catch(e){ return null; }
  }
  function cacheSet(date, data){
    try{ localStorage.setItem(CACHE_PREFIX + date, JSON.stringify(data)); }catch(e){}
  }
  function pendingGet(){
    try{ return JSON.parse(localStorage.getItem(PENDING_KEY) || "[]"); }catch(e){ return []; }
  }
  function pendingSet(arr){
    try{ localStorage.setItem(PENDING_KEY, JSON.stringify(arr)); }catch(e){}
    updateSyncDot();
  }
  var PLANS_CACHE_KEY = "setlog:plans";
  var SETTINGS_CACHE_KEY = "setlog:settings";
  var PLAN_QUEUE_KEY = "setlog:pendingPlans";
  var SETTINGS_PENDING_KEY = "setlog:pendingSettings";
  function readJSON(key, fallback){
    try{ var raw = localStorage.getItem(key); return raw ? JSON.parse(raw) : fallback; }catch(e){ return fallback; }
  }
  function writeJSON(key, value){
    try{ localStorage.setItem(key, JSON.stringify(value)); }catch(e){}
  }
  function planQueueGet(){ return readJSON(PLAN_QUEUE_KEY, []); }
  function planQueueSet(q){ writeJSON(PLAN_QUEUE_KEY, q); updateSyncDot(); }
  function settingsPending(){ try{ return localStorage.getItem(SETTINGS_PENDING_KEY) === "1"; }catch(e){ return false; } }
  function setSettingsPending(v){
    try{ if(v) localStorage.setItem(SETTINGS_PENDING_KEY, "1"); else localStorage.removeItem(SETTINGS_PENDING_KEY); }catch(e){}
    updateSyncDot();
  }

  function updateSyncDot(){
    var dot = document.getElementById("sync-dot");
    if(!dot) return;
    var pending = pendingGet().length > 0 || planQueueGet().length > 0 || settingsPending();
    dot.classList.toggle("pending", pending);
    dot.title = pending ? "Saved on this phone, syncing when online" : "Synced";
  }

  function supabaseStore(client, userId){
    var TABLE = "workout_logs";

    async function pushRemote(date, data){
      var res = await client.from(TABLE).upsert(
        { user_id: userId, log_date: date, data: data, updated_at: new Date(data.updatedAt || Date.now()).toISOString() },
        { onConflict: "user_id,log_date" }
      );
      if(res.error) throw res.error;
    }

    async function pushPlanOp(op){
      if(op.op === "delete"){
        var del = await client.from("workout_plans").delete().eq("id", op.id);
        if(del.error) throw del.error;
        return;
      }
      var plan = readJSON(PLANS_CACHE_KEY, []).find(function(x){ return x.id === op.id; });
      if(!plan) return;
      var up = await client.from("workout_plans").upsert({
        id: plan.id, user_id: userId, name: plan.name, data: plan.data,
        updated_at: new Date(plan.updatedAt || Date.now()).toISOString()
      });
      if(up.error) throw up.error;
    }

    async function pushSettings(){
      var st = readJSON(SETTINGS_CACHE_KEY, {});
      var res = await client.from("user_settings").upsert(
        { user_id: userId, active_plan_id: st.activePlanId || null, updated_at: new Date().toISOString() },
        { onConflict: "user_id" }
      );
      if(res.error) throw res.error;
    }

    function enqueuePlan(op){
      var q = planQueueGet().filter(function(o){ return o.id !== op.id; });
      q.push(op);
      planQueueSet(q);
    }

    var flushing = false;
    async function flushPending(){
      if(flushing) return;
      flushing = true;
      try{
        var pq = planQueueGet();
        while(pq.length){
          await pushPlanOp(pq[0]);
          pq.shift();
          planQueueSet(pq);
        }
        if(settingsPending()){
          await pushSettings();
          setSettingsPending(false);
        }
        var queue = pendingGet();
        while(queue.length){
          var date = queue[0];
          var data = cacheGet(date);
          if(data){ await pushRemote(date, data); }
          queue.shift();
          pendingSet(queue);
        }
      }catch(e){
        /* still offline or a transient error: keep the queue, retry later */
      }finally{
        flushing = false;
      }
    }

    window.addEventListener("online", flushPending);
    document.addEventListener("visibilitychange", function(){ if(!document.hidden) flushPending(); });
    setInterval(flushPending, 30000);
    flushPending();

    return {
      async getDoc(date){
        var local = cacheGet(date);
        try{
          var res = await client.from(TABLE).select("data").eq("log_date", date).maybeSingle();
          if(res.error) throw res.error;
          var remote = res.data ? res.data.data : null;
          if(remote && (!local || (remote.updatedAt || 0) >= (local.updatedAt || 0))){
            cacheSet(date, remote);
            return remote;
          }
          return local;
        }catch(e){
          return local;
        }
      },
      async setDoc(date, data){
        cacheSet(date, data);
        var queue = pendingGet();
        if(queue.indexOf(date) === -1){ queue.push(date); pendingSet(queue); }
        await flushPending();
      },
      async loadPlans(){
        var local = readJSON(PLANS_CACHE_KEY, []);
        try{
          var res = await client.from("workout_plans").select("id,name,data,updated_at").order("created_at", { ascending:true });
          if(res.error) throw res.error;
          var pendingUp = {}, pendingDel = {};
          planQueueGet().forEach(function(o){ if(o.op === "delete") pendingDel[o.id] = true; else pendingUp[o.id] = true; });
          var merged = res.data
            .filter(function(r){ return !pendingDel[r.id]; })
            .map(function(r){
              if(pendingUp[r.id]){
                var l = local.find(function(x){ return x.id === r.id; });
                if(l) return l;
              }
              return { id:r.id, name:r.name, data:r.data, updatedAt: Date.parse(r.updated_at) };
            });
          local.forEach(function(l){
            if(pendingUp[l.id] && !merged.some(function(m){ return m.id === l.id; })) merged.push(l);
          });
          writeJSON(PLANS_CACHE_KEY, merged);
          return { plans: merged, fromRemote: true };
        }catch(e){
          return { plans: local, fromRemote: false };
        }
      },
      async getSettings(){
        var local = readJSON(SETTINGS_CACHE_KEY, {});
        if(settingsPending()) return local;
        try{
          var res = await client.from("user_settings").select("active_plan_id").maybeSingle();
          if(res.error) throw res.error;
          var st = { activePlanId: res.data ? res.data.active_plan_id : null };
          writeJSON(SETTINGS_CACHE_KEY, st);
          return st;
        }catch(e){
          return local;
        }
      },
      async savePlan(plan){
        plan.updatedAt = Date.now();
        var all = readJSON(PLANS_CACHE_KEY, []);
        var i = all.findIndex(function(x){ return x.id === plan.id; });
        if(i === -1) all.push(plan); else all[i] = plan;
        writeJSON(PLANS_CACHE_KEY, all);
        enqueuePlan({ op:"upsert", id: plan.id });
        await flushPending();
      },
      async deletePlan(id){
        var all = readJSON(PLANS_CACHE_KEY, []).filter(function(x){ return x.id !== id; });
        writeJSON(PLANS_CACHE_KEY, all);
        enqueuePlan({ op:"delete", id: id });
        await flushPending();
      },
      async setActivePlan(id){
        writeJSON(SETTINGS_CACHE_KEY, { activePlanId: id });
        setSettingsPending(true);
        await flushPending();
      },
      async queryRecent(limit){
        var byDate = {};
        try{
          var res = await client.from(TABLE).select("log_date,data").order("log_date", { ascending:false }).limit(limit);
          if(res.error) throw res.error;
          res.data.forEach(function(row){ byDate[row.log_date] = row.data; });
        }catch(e){}
        pendingGet().forEach(function(d){
          var local = cacheGet(d);
          if(local) byDate[d] = local;
        });
        return Object.keys(byDate).sort().reverse().slice(0, limit).map(function(d){ return byDate[d]; });
      }
    };
  }

  /* ---------------- Auth ---------------- */
  var sb = null;

  function showAuth(show){

  async function initStore(){
    var cfg = window.SETLOG_CONFIG || {};
    if(!cfg.supabaseUrl || !cfg.supabaseAnonKey || !window.supabase){
      throw new Error("Missing Supabase config");
    }
    sb = window.supabase.createClient(cfg.supabaseUrl, cfg.supabaseAnonKey, {
      auth: { persistSession: true, autoRefreshToken: true }
    });
    var sessionRes = await sb.auth.getSession();
    var session = sessionRes.data.session;
    if(!session){
      showAuth(true);
      session = await waitForSignIn();
      showAuth(false);
    }
    sb.auth.onAuthStateChange(function(event){
      if(event === "SIGNED_OUT"){ location.reload(); }
    });
    return supabaseStore(sb, session.user.id);
  }

  function waitForSignIn(){
    return new Promise(function(resolve){
      var form = document.getElementById("auth-form");
      var btn = document.getElementById("auth-submit");
      var err = document.getElementById("auth-error");
      form.addEventListener("submit", async function(e){
        e.preventDefault();
        err.textContent = "";
        btn.disabled = true;
        btn.textContent = "Signing in…";
        var res = await sb.auth.signInWithPassword({
          email: document.getElementById("auth-email").value.trim(),
          password: document.getElementById("auth-password").value
        });
        btn.disabled = false;
        btn.textContent = "Sign in";
        if(res.error){
          err.textContent = res.error.message || "Sign in failed. Check your email and password.";
          return;
        }
        resolve(res.data.session);
      });
    });

  /* ---------------- State ---------------- */
  var store = null;
  var currentDate = todayStr();
  var currentDow = dowFromDateStr(currentDate);
  var currentLog = null;
  var activeTab = "today";
  var saveTimer = null;
  var selectedProgressKey = null;
  var collapsed = {};
  var plans = [];
  var activePlanId = null;
  var currentDayPlan = { title:"Rest", exercises:[], cardio:[] };

  function clone(o){ return JSON.parse(JSON.stringify(o)); }
  function activePlan(){
    return plans.find(function(p){ return p.id === activePlanId; }) || plans[0] || null;
  }
  function activeDays(){
    var p = activePlan();
    return p ? p.data.days : DEFAULT_DAYS;
  }
  function emptyDay(){ return { title:"", exercises:[], cardio:[] }; }
  function normaliseDay(d){
    d = d || emptyDay();
    return { title: d.title || "", exercises: d.exercises || [], cardio: d.cardio || [] };
  }
  /* Past days that were logged keep the plan they were done with.
     Today and future days follow whichever plan is active now. */
  function dayPlanFor(saved, dateStr, dow){
    if(saved && saved.plan && dateStr < todayStr()) return normaliseDay(saved.plan);
    return normaliseDay(activeDays()[dow]);
  }
  function allExercises(){
    var seen = {}, list = [];
    var ordered = plans.slice().sort(function(a,b){ return (b.id === activePlanId) - (a.id === activePlanId); });
    var sources = ordered.length ? ordered.map(function(p){ return p.data.days; }) : [DEFAULT_DAYS];
    sources.forEach(function(days){
      [1,2,3,4,5,6,0].forEach(function(d){
        normaliseDay(days[d]).exercises.forEach(function(ex){
          if(ex.key && !seen[ex.key]){ seen[ex.key] = true; list.push({ key:ex.key, name: ex.name || "Untitled exercise" }); }
        });
      });
    });
    return list;
  }

  function defaultLog(dateStr, dow, p){
    var exercises = {};
    p.exercises.forEach(function(ex){
      var sets = [];
      var n = Math.max(1, parseInt(ex.sets, 10) || 1);
      for(var i=0;i<n;i++){ sets.push({weight:"", reps:"", done:false}); }
      exercises[ex.key] = { sets: sets };
    });
    var cardio = {};
    p.cardio.forEach(function(c){ cardio[c.key] = { value:"", done:false }; });
    return { date: dateStr, day: dow, exercises: exercises, cardio: cardio, updatedAt: Date.now() };
  }

  function mergeLog(saved, dateStr, dow, dayPlan){
    var base = defaultLog(dateStr, dow, dayPlan);
    if(!saved) return base;
    Object.keys(base.exercises).forEach(function(k){
      var savedEx = saved.exercises && saved.exercises[k];
      if(savedEx && Array.isArray(savedEx.sets)){
        base.exercises[k].sets.forEach(function(s, i){
          var sv = savedEx.sets[i];
          if(sv){
            s.weight = sv.weight != null ? sv.weight : "";
            s.reps = sv.reps != null ? sv.reps : "";
            s.done = !!sv.done;
          }
        });
      }
    });
    Object.keys(base.cardio).forEach(function(k){
      var savedC = saved.cardio && saved.cardio[k];
      if(savedC){
        base.cardio[k].value = savedC.value != null ? savedC.value : "";
        base.cardio[k].done = !!savedC.done;
      }
    });
    return base;
  }

  async function loadDate(dateStr){
    currentDate = dateStr;
    currentDow = dowFromDateStr(dateStr);
    var saved = await store.getDoc(dateStr);
    currentDayPlan = dayPlanFor(saved, dateStr, currentDow);
    currentLog = mergeLog(saved, dateStr, currentDow, currentDayPlan);
    collapsed = {};
    currentDayPlan.exercises.forEach(function(ex){
      var sets = currentLog.exercises[ex.key].sets;
      if(sets.length && sets.every(function(x){ return x.done; })) collapsed[ex.key] = true;
    });
    renderHeader();
    render();
  }

  function scheduleSave(){
    clearTimeout(saveTimer);
    saveTimer = setTimeout(function(){
      currentLog.updatedAt = Date.now();
      currentLog.date = currentDate;
      currentLog.day = currentDow;
      currentLog.plan = clone(currentDayPlan);
      var ap = activePlan();
      if(ap && currentDate >= todayStr()) currentLog.planId = ap.id;
      store.setDoc(currentDate, currentLog);

  async function loadProgressData(){
    var docs = await store.queryRecent(30);
    var asc = docs.filter(Boolean).slice().sort(function(a,b){ return (a.date||"").localeCompare(b.date||""); });
    var points = [];
    asc.forEach(function(d){
      var ex = d.exercises && d.exercises[selectedProgressKey];
      if(ex && Array.isArray(ex.sets)){
        var max = 0, repsAtMax = "";
        ex.sets.forEach(function(s){
          var w = parseFloat(s.weight);
          if(!isNaN(w) && w > max){ max = w; repsAtMax = s.reps; }
        });
        if(max > 0) points.push({ date: d.date, weight: max, reps: repsAtMax });
      }
    });
    renderChart(points);
    renderHistoryList(points);
  }

  function renderChart(points){
    var el = document.getElementById("chart-card");
    if(!el) return;
    if(points.length < 2){
      el.innerHTML = '<div class="chart-empty">' + (points.length===1 ? "Log this exercise again to see a trend." : "No logged sets yet for this exercise.") + '</div>';
      return;
    }
    var W = 280, H = 110, padX = 8, padY = 14;
    var weights = points.map(function(p){ return p.weight; });
    var min = Math.min.apply(null, weights), max = Math.max.apply(null, weights);
    if(min === max){ min -= 1; max += 1; }
    var stepX = (W - padX*2) / (points.length - 1);
    var coords = points.map(function(p, i){
      var x = padX + i*stepX;
      var y = padY + (1 - (p.weight - min)/(max - min)) * (H - padY*2);
      return [x,y];
    });
    var pathD = coords.map(function(c, i){ return (i===0?"M":"L") + c[0].toFixed(1) + "," + c[1].toFixed(1); }).join(" ");
    var dots = coords.map(function(c){ return '<circle cx="'+c[0].toFixed(1)+'" cy="'+c[1].toFixed(1)+'" r="3" fill="var(--accent)" />'; }).join("");
    var svg = '<svg viewBox="0 0 ' + W + ' ' + H + '" width="100%" height="' + H + '" preserveAspectRatio="none" style="overflow:visible">';
    svg += '<path d="' + pathD + '" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />';
    svg += dots;
    svg += '</svg>';
    svg += '<div style="display:flex;justify-content:space-between;margin-top:6px;font-size:11px;color:var(--text-faint)">';
    svg += '<span>' + min + ' kg</span><span>' + max + ' kg</span></div>';
    el.innerHTML = svg;
  }

  function renderHistoryList(points){
    var el = document.getElementById("history-list");
    if(!el) return;
    if(!points.length){ el.innerHTML = ""; return; }
    var rev = points.slice().reverse();
    el.innerHTML = '<div class="card">' + rev.map(function(p){
      return '<div class="history-row"><span class="hdate">' + formatShort(p.date) + '</span><span class="hval">' + p.weight + ' kg &times; ' + esc(p.reps || "?") + '</span></div>';
    }).join("") + '</div>';
  }

  /* ---------------- Plans tab ---------------- */
  var DAY_ORDER = [1,2,3,4,5,6,0];
  var DAY_SHORT = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
  var REST_OPTIONS = [30,45,60,75,90,120,150,180,240,300];

  function uuid(){
    if(window.crypto && crypto.randomUUID) return crypto.randomUUID();
    return "xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx".replace(/[xy]/g, function(c){
      var r = Math.random()*16|0; return (c === "x" ? r : (r&0x3|0x8)).toString(16);
    });
  }
  function slugify(str){
    return String(str || "").toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "") || "exercise";
  }
  function uniqueKey(day, base, self){
    var taken = {};
    day.exercises.concat(day.cardio).forEach(function(x){ if(x !== self) taken[x.key] = true; });
    var k = base, n = 2;
    while(taken[k]){ k = base + "-" + n; n++; }
    return k;
  }
  function blankDays(){
    var d = {};
    for(var i=0;i<7;i++) d[i] = emptyDay();
    return d;
  }
  function planById(id){ return plans.find(function(p){ return p.id === id; }); }
  function editingPlan(){ return planById(editingPlanId); }
  function editingDayData(){
    var p = editingPlan();
    if(!p) return null;
    p.data.days[editingDay] = normaliseDay(p.data.days[editingDay]);
    return p.data.days[editingDay];
  }
  function dayHasContent(day){
    day = normaliseDay(day);
    return day.exercises.length > 0 || day.cardio.length > 0;
  }
  function planSummary(p){
    var trainingDays = 0, exCount = 0;
    DAY_ORDER.forEach(function(d){
      var day = normaliseDay(p.data.days[d]);
      if(dayHasContent(day)) trainingDays++;
      exCount += day.exercises.length;
    });
    return trainingDays + (trainingDays === 1 ? " training day" : " training days") + " · " + exCount + (exCount === 1 ? " exercise" : " exercises");
  }

  function schedulePlanSave(){
    clearTimeout(planSaveTimer);
    planSaveTimer = setTimeout(flushPlanSave, 600);
  }
  function flushPlanSave(){
    clearTimeout(planSaveTimer);
    planSaveTimer = null;
    var p = editingPlan();
    if(p) store.savePlan(p);
  }
  /* New exercises take their history key from their name while the editor is open.
     Once you leave, the key is fixed so renaming later keeps your progress history. */
  function closePlanEditor(){
    var p = editingPlan();
    if(p){
      DAY_ORDER.forEach(function(d){
        var day = normaliseDay(p.data.days[d]);
        day.exercises.concat(day.cardio).forEach(function(x){ delete x.autoKey; });
      });
      flushPlanSave();
    }
    editingPlanId = null;
  }

  function renderPlans(){
    if(editingPlanId && editingPlan()) renderPlanEditor();
    else { editingPlanId = null; renderPlanList(); }
  }

  function renderPlanList(){
    var html = '<div class="tab-panel plans-panel">';
    html += '<div class="plans-head"><h2>Plans</h2><button class="pill-btn accent" data-plan-new>+ New plan</button></div>';
    html += '<p class="plans-hint">The active plan drives your Today screen. Past workouts keep the plan they were done with.</p>';
    plans.forEach(function(p){
      var isActive = p.id === activePlanId;
      html += '<div class="card plan-card' + (isActive ? ' active' : '') + '">';
      html += '<div class="plan-card-top"><div class="plan-card-name">' + esc(p.name || "Untitled plan") + '</div>';
      if(isActive) html += '<span class="active-badge">Active</span>';
      html += '</div>';
      html += '<div class="plan-card-sub">' + planSummary(p) + '</div>';
      html += '<div class="week-dots">';
      DAY_ORDER.forEach(function(d){
        html += '<span class="week-dot' + (dayHasContent(p.data.days[d]) ? ' on' : '') + '">' + DAY_SHORT[d].charAt(0) + '</span>';
      });
      html += '</div>';
      html += '<div class="plan-actions">';
      html += '<button class="pill-btn" data-plan-edit="' + p.id + '">Edit</button>';
      html += '<button class="pill-btn" data-plan-dup="' + p.id + '">Duplicate</button>';
      if(!isActive) html += '<button class="pill-btn accent" data-plan-use="' + p.id + '">Use plan</button>';
      html += '</div></div>';
    });
    html += '<div class="signout-row"><button class="text-btn" data-signout>Sign out</button></div>';
    html += '</div>';
    content.innerHTML = html;
  }

  function restOptionsHtml(current){
    var opts = REST_OPTIONS.slice();
    if(current && opts.indexOf(current) === -1){ opts.push(current); opts.sort(function(a,b){ return a-b; }); }
    return opts.map(function(v){
      return '<option value="' + v + '"' + (v === current ? ' selected' : '') + '>' + formatRestShort(v) + '</option>';
    }).join("");
  }

  function moveBtns(kind, i, len){
    return '<button class="mini-btn" aria-label="Move up" data-move="' + kind + '" data-i="' + i + '" data-dir="-1"' + (i === 0 ? ' disabled' : '') + '>&#8593;</button>' +
           '<button class="mini-btn" aria-label="Move down" data-move="' + kind + '" data-i="' + i + '" data-dir="1"' + (i === len-1 ? ' disabled' : '') + '>&#8595;</button>' +
           '<button class="mini-btn danger" aria-label="Remove" data-remove="' + kind + '" data-i="' + i + '">Remove</button>';
  }

  function renderPlanEditor(){
    var p = editingPlan();
    var day = editingDayData();
    var isActive = p.id === activePlanId;
    var html = '<div class="tab-panel plan-editor">';
    html += '<div class="editor-top">';
    html += '<button class="icon-btn" data-plan-back aria-label="Back to plans">&#8249;</button>';
    html += '<input class="plan-name-input" data-plan-name value="' + esc(p.name) + '" placeholder="Plan name" aria-label="Plan name" />';
    html += '</div>';
    html += '<div class="editor-status">' + (isActive
      ? '<span class="active-badge">Active</span><span class="editor-status-text">Changes show on Today straight away.</span>'
      : '<button class="pill-btn accent" data-plan-use="' + p.id + '">Use this plan</button>') + '</div>';

    html += '<div class="day-chips" role="tablist">';
    DAY_ORDER.forEach(function(d){
      html += '<button role="tab" class="day-chip' + (d === editingDay ? ' active' : '') + (dayHasContent(p.data.days[d]) ? ' has' : '') + '" data-edit-day="' + d + '" aria-selected="' + (d === editingDay) + '">' + DAY_SHORT[d] + '</button>';
    });
    html += '</div>';

    html += '<label class="field-label" for="day-title-input">' + WEEKDAY_NAMES[editingDay] + ' name</label>';
    html += '<input id="day-title-input" class="text-input" data-day-title value="' + esc(day.title) + '" placeholder="e.g. Push, Legs, Rest" />';

    html += '<div class="section-label">Strength</div>';
    if(!day.exercises.length) html += '<div class="empty-note">No exercises on this day.</div>';
    day.exercises.forEach(function(ex, i){
      var rest = parseInt(ex.rest, 10) || 60;
      var sets = Math.max(1, parseInt(ex.sets, 10) || 1);
      html += '<div class="card edit-card">';
      html += '<input class="text-input name-input" data-ex-field="name" data-i="' + i + '" value="' + esc(ex.name) + '" placeholder="Exercise name" />';
      html += '<div class="edit-grid">';
      html += '<div class="edit-field"><span class="field-label">Sets</span><div class="stepper">' +
              '<button class="mini-btn" data-sets="' + i + '" data-dir="-1" aria-label="Fewer sets"' + (sets <= 1 ? ' disabled' : '') + '>&minus;</button>' +
              '<span class="stepper-val">' + sets + '</span>' +
              '<button class="mini-btn" data-sets="' + i + '" data-dir="1" aria-label="More sets"' + (sets >= 10 ? ' disabled' : '') + '>+</button></div></div>';
      html += '<div class="edit-field"><span class="field-label">Reps</span><input class="text-input" data-ex-field="reps" data-i="' + i + '" value="' + esc(ex.reps || "") + '" placeholder="8-10" /></div>';
      html += '<div class="edit-field"><span class="field-label">Rest</span><select class="text-input" data-ex-rest="' + i + '">' + restOptionsHtml(rest) + '</select></div>';
      html += '</div>';
      html += '<div class="edit-actions">' + moveBtns("ex", i, day.exercises.length) + '</div>';
      html += '</div>';
    });
    html += '<button class="add-btn" data-add="ex">+ Add exercise</button>';

    html += '<div class="section-label">Cardio &amp; other</div>';
    if(!day.cardio.length) html += '<div class="empty-note">No cardio or activities on this day.</div>';
    day.cardio.forEach(function(c, i){
      html += '<div class="card edit-card">';
      html += '<input class="text-input name-input" data-c-field="name" data-i="' + i + '" value="' + esc(c.name) + '" placeholder="e.g. Easy Run, Padel" />';
      html += '<div class="edit-grid two">';
      html += '<div class="edit-field"><span class="field-label">Track</span><select class="text-input" data-c-kind="' + i + '">' +
              [["distance","Distance (km)"],["duration","Time (min)"],["done","Just tick done"]].map(function(o){
                return '<option value="' + o[0] + '"' + (c.kind === o[0] ? ' selected' : '') + '>' + o[1] + '</option>';
              }).join("") + '</select></div>';
      html += '<div class="edit-field"><span class="field-label">Target</span><input class="text-input" data-c-field="target" data-i="' + i + '" value="' + esc(c.target || "") + '" placeholder="e.g. 3–4 km" /></div>';
      html += '</div>';
      html += '<div class="edit-actions">' + moveBtns("c", i, day.cardio.length) + '</div>';
      html += '</div>';
    });
    html += '<button class="add-btn" data-add="c">+ Add cardio or activity</button>';

    if(!dayHasContent(day)) html += '<p class="plans-hint center">Empty days show as a rest day.</p>';

    html += '<div class="danger-zone">';
    if(isActive){
      html += '<p class="plans-hint center">To delete this plan, make another plan active first.</p>';
    } else {
      html += '<button class="pill-btn danger" data-plan-delete="' + p.id + '">Delete plan</button>';
    }
    html += '</div>';
    html += '</div>';
    content.innerHTML = html;
  }

  function openPlan(id){
    editingPlanId = id;
    editingDay = currentDow;
    content.scrollTop = 0;
    renderPlans();
  }

  async function useplan(id){
    flushPlanSave();
    activePlanId = id;
    await store.setActivePlan(id);
    renderPlans();
  }

  function addPlan(name, days){
    var p = { id: uuid(), name: name, data: { days: days }, updatedAt: Date.now() };
    plans.push(p);
    store.savePlan(p);
    return p;
  }

  content.addEventListener("input", function(e){
    if(activeTab !== "plans" || !editingPlanId) return;
    var t = e.target, p = editingPlan(), day = editingDayData();
    if(!p) return;
    if(t.matches("[data-plan-name]")){ p.name = t.value; schedulePlanSave(); return; }
    if(t.matches("[data-day-title]")){ day.title = t.value; schedulePlanSave(); return; }
    if(t.matches("[data-ex-field]")){
      var ex = day.exercises[+t.dataset.i];
      ex[t.dataset.exField] = t.value;
      if(t.dataset.exField === "name" && ex.autoKey) ex.key = uniqueKey(day, slugify(t.value), ex);
      schedulePlanSave(); return;
    }
    if(t.matches("[data-c-field]")){
      var c = day.cardio[+t.dataset.i];
      c[t.dataset.cField] = t.value;
      if(t.dataset.cField === "name" && c.autoKey) c.key = uniqueKey(day, slugify(t.value), c);
      schedulePlanSave(); return;
    }
  });

  content.addEventListener("change", function(e){
    if(activeTab !== "plans" || !editingPlanId) return;
    var t = e.target, day = editingDayData();
    if(t.matches("[data-ex-rest]")){ day.exercises[+t.dataset.exRest].rest = parseInt(t.value, 10); schedulePlanSave(); return; }
    if(t.matches("[data-c-kind]")){ day.cardio[+t.dataset.cKind].kind = t.value; schedulePlanSave(); return; }
  });

  content.addEventListener("click", async function(e){
    if(activeTab !== "plans") return;
    var t;
    if((t = e.target.closest("[data-signout]"))){ signOut(); return; }
    if((t = e.target.closest("[data-plan-new]"))){
      var np = addPlan("New plan", blankDays());
      openPlan(np.id);
      setTimeout(function(){ var el = content.querySelector("[data-plan-name]"); if(el){ el.focus(); el.select(); } }, 50);
      return;
    }
    if((t = e.target.closest("[data-plan-edit]"))){ openPlan(t.dataset.planEdit); return; }
    if((t = e.target.closest("[data-plan-dup]"))){
      var src = planById(t.dataset.planDup);
      if(src){ addPlan((src.name || "Untitled plan") + " copy", clone(src.data.days)); renderPlans(); }
      return;
    }
    if((t = e.target.closest("[data-plan-use]"))){ useplan(t.dataset.planUse); return; }
    if((t = e.target.closest("[data-plan-back]"))){ closePlanEditor(); content.scrollTop = 0; renderPlans(); return; }
    if((t = e.target.closest("[data-plan-delete]"))){
      var dp = planById(t.dataset.planDelete);
      if(!dp || dp.id === activePlanId) return;
      if(!confirm('Delete "' + (dp.name || "Untitled plan") + '"? Workouts you already logged are kept.')) return;
      clearTimeout(planSaveTimer);
      plans = plans.filter(function(x){ return x.id !== dp.id; });
      editingPlanId = null;
      await store.deletePlan(dp.id);
      renderPlans();
      return;
    }
    if(!editingPlanId) return;
    var day = editingDayData();
    if((t = e.target.closest("[data-edit-day]"))){
      flushPlanSave();
      editingDay = +t.dataset.editDay;
      renderPlans();
      return;
    }
    if((t = e.target.closest("[data-add]"))){
      if(t.dataset.add === "ex"){
        var ex = { key:"", name:"", sets:4, reps:"8-10", rest:90, autoKey:true };
        ex.key = uniqueKey(day, "exercise", ex);
        day.exercises.push(ex);
      } else {
        var c = { key:"", name:"", kind:"distance", target:"", autoKey:true };
        c.key = uniqueKey(day, "activity", c);
        day.cardio.push(c);
      }
      schedulePlanSave();
      renderPlans();
      var names = content.querySelectorAll(t.dataset.add === "ex" ? "[data-ex-field=name]" : "[data-c-field=name]");
      var last = names[names.length-1];
      if(last){ last.focus(); last.scrollIntoView({ block:"center", behavior:"smooth" }); }
      return;
    }
    if((t = e.target.closest("[data-sets]"))){
      var sx = day.exercises[+t.dataset.sets];
      sx.sets = Math.min(10, Math.max(1, (parseInt(sx.sets, 10) || 1) + (+t.dataset.dir)));
      schedulePlanSave();
      renderPlans();
      return;
    }
    if((t = e.target.closest("[data-move]"))){
      var list = t.dataset.move === "ex" ? day.exercises : day.cardio;
      var i = +t.dataset.i, j = i + (+t.dataset.dir);
      if(j < 0 || j >= list.length) return;
      var tmp = list[i]; list[i] = list[j]; list[j] = tmp;
      schedulePlanSave();
      renderPlans();
      return;
    }
    if((t = e.target.closest("[data-remove]"))){
      var rl = t.dataset.remove === "ex" ? day.exercises : day.cardio;
      rl.splice(+t.dataset.i, 1);
      schedulePlanSave();
      renderPlans();
      return;
    }
  });

  /* ---------------- Rest timer ---------------- */
  var restBar = document.getElementById("rest-bar");
  var restTimeEl = document.getElementById("rest-time");
  var restNameEl = document.getElementById("rest-name");
  var restRing = restBar.querySelector(".rest-ring");
  var restScreen = document.getElementById("rest-screen");
  var rsLabel = document.getElementById("rs-label");
  var rsExercise = document.getElementById("rs-exercise");
  var rsRingWrap = document.getElementById("rs-ring-wrap");
  var rsTimeBig = document.getElementById("rs-time-big");
  var rsAdjust = document.querySelector(".rs-adjust");
  var rsSkipFull = document.getElementById("rs-skip-full");
  var restInterval = null;
  var restState = { active:false, remaining:0, total:0, name:"", finished:false };
  var restScreenMinimized = false;

  function fmtTime(sec){
    var m = Math.floor(sec/60), s = sec%60;
    return m + ":" + pad(s);
  }

  function startRest(seconds, name){
    if(!seconds || seconds <= 0) return;
    clearInterval(restInterval);
    restState = { active:true, remaining:seconds, total:seconds, name:name, finished:false, paused:false };
    restScreenMinimized = false;
    renderRestBar();
    renderRestScreen();
    runTicker();
  }

  function runTicker(){
    clearInterval(restInterval);
    restInterval = setInterval(function(){
      restState.remaining--;
      if(restState.remaining <= 0){
        clearInterval(restInterval);
        restState.remaining = 0;
        onRestComplete();
      }
      renderRestBar();
      renderRestScreen();
    }, 1000);
  }

  var PAUSE_ICON = '<svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><rect x="3" y="2" width="3.5" height="12" rx="1" fill="currentColor"/><rect x="9.5" y="2" width="3.5" height="12" rx="1" fill="currentColor"/></svg>';
  var PLAY_ICON = '<svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M4 2.5v11a1 1 0 0 0 1.5.86l9-5.5a1 1 0 0 0 0-1.72l-9-5.5A1 1 0 0 0 4 2.5z" fill="currentColor"/></svg>';

  function togglePause(){
    if(!restState.active || restState.finished) return;
    restState.paused = !restState.paused;
    if(restState.paused){ clearInterval(restInterval); }
    else { runTicker(); }
    renderRestBar();
    renderRestScreen();
  }

  function renderPauseButtons(){
    var paused = !!restState.paused;
    [document.getElementById("rs-pause"), document.getElementById("rest-pause")].forEach(function(btn){
      if(!btn) return;
      btn.innerHTML = paused ? PLAY_ICON : PAUSE_ICON;
      btn.setAttribute("aria-label", paused ? "Resume timer" : "Pause timer");
    });
    restScreen.classList.toggle("paused", paused);
    restBar.classList.toggle("paused", paused);
  }

  function onRestComplete(){
    restState.finished = true;
    restState.paused = false;
    restScreenMinimized = false;
    if(navigator.vibrate){ try{ navigator.vibrate([200,100,200]); }catch(e){} }
    beep();
    renderRestScreen();
  }

  function beep(){
    try{
      var Ctx = window.AudioContext || window.webkitAudioContext;
      var ctx = new Ctx();
      var o = ctx.createOscillator();
      var g = ctx.createGain();
      o.type = "sine";
      o.frequency.value = 880;
      g.gain.setValueAtTime(0.0001, ctx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.3, ctx.currentTime+0.01);
      g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime+0.45);
      o.connect(g); g.connect(ctx.destination);
      o.start();
      o.stop(ctx.currentTime+0.5);
    }catch(e){}
  }

  function stopRest(){
    clearInterval(restInterval);
    restState.active = false;
    restScreenMinimized = false;
    renderRestBar();
    renderRestScreen();
  }

  function renderRestBar(){
    if(!restState.active){
      restBar.classList.remove("show");
      return;
    }
    restBar.classList.add("show");
    renderPauseButtons();
    var miniPause = document.getElementById("rest-pause");
    if(miniPause) miniPause.style.display = restState.finished ? "none" : "flex";
    restTimeEl.textContent = fmtTime(restState.remaining);
    restNameEl.textContent = restState.name;
    var pct = restState.total ? Math.round((1 - restState.remaining/restState.total) * 100) : 0;
    restRing.style.setProperty("--pct", pct);
  }

  function renderRestScreen(){
    if(!restState.active || restScreenMinimized){
      restScreen.classList.remove("show");
      return;
    }
    restScreen.classList.add("show");
    rsExercise.textContent = restState.name;
    var pct = restState.total ? Math.round((1 - restState.remaining/restState.total) * 100) : 0;
    rsRingWrap.style.setProperty("--pct", pct);
    if(restState.finished){
      rsLabel.textContent = "Rest complete";
      rsRingWrap.innerHTML = '<span class="rs-done-check">&#10003;</span>';
      rsAdjust.style.display = "none";
      rsSkipFull.textContent = "Continue";
      rsSkipFull.classList.add("primary");
    } else {
      rsLabel.textContent = restState.paused ? "Paused" : "Rest";
      rsRingWrap.innerHTML = '<span class="rs-time" id="rs-time-big">' + fmtTime(restState.remaining) + '</span>';
      rsAdjust.style.display = "flex";
      rsSkipFull.textContent = "Skip rest";
      rsSkipFull.classList.remove("primary");
    }
  }

  document.getElementById("rest-plus").addEventListener("click", function(){
    if(!restState.active) return;
    restState.remaining += 15;
    restState.total = Math.max(restState.total, restState.remaining);
    renderRestBar();
    renderRestScreen();
  });
  document.getElementById("rest-minus").addEventListener("click", function(){
    if(!restState.active) return;
    restState.remaining = Math.max(0, restState.remaining - 15);
    if(restState.remaining === 0){ clearInterval(restInterval); onRestComplete(); }
    renderRestBar();
    renderRestScreen();
  });
  document.getElementById("rest-skip").addEventListener("click", stopRest);

  document.getElementById("rs-plus").addEventListener("click", function(){
    if(!restState.active) return;
    restState.remaining += 15;
    restState.total = Math.max(restState.total, restState.remaining);
    renderRestBar();
    renderRestScreen();
  });
  document.getElementById("rs-minus").addEventListener("click", function(){
    if(!restState.active) return;
    restState.remaining = Math.max(0, restState.remaining - 15);
    if(restState.remaining === 0){ clearInterval(restInterval); onRestComplete(); }
    renderRestBar();
    renderRestScreen();
  });
  rsSkipFull.addEventListener("click", stopRest);
  document.getElementById("rs-pause").addEventListener("click", togglePause);
  document.getElementById("rest-pause").addEventListener("click", togglePause);
  document.getElementById("rs-close").addEventListener("click", stopRest);
  document.getElementById("rs-minimize").addEventListener("click", function(){
    restScreenMinimized = true;
    renderRestScreen();
  });
  restBar.addEventListener("click", function(e){
    if(e.target.closest("button")) return;
    if(!restState.active) return;
    restScreenMinimized = false;
    renderRestScreen();
  });

  /* ---------------- Boot ---------------- */
  async function boot(){
    try{
      store = await initStore();
    }catch(e){
      content.innerHTML = '<div class="rest-day"><div class="big">Setup needed</div>Supabase URL and anon key are missing. Check the environment variables in Vercel.</div>';
      return;
    }
    updateSyncDot();
    var loaded = await store.loadPlans();
    plans = loaded.plans;
    var settings = await store.getSettings();
    activePlanId = settings.activePlanId;
    if(!plans.length && loaded.fromRemote){
      /* First run: turn the built-in programme into your first plan profile. */
      var first = { id: uuid(), name: "Main plan", data: { days: clone(DEFAULT_DAYS) }, updatedAt: Date.now() };
      plans.push(first);
      await store.savePlan(first);
    }
    if(plans.length && !planById(activePlanId)){
      activePlanId = plans[0].id;
      await store.setActivePlan(activePlanId);
    }
    await loadDate(todayStr());
  }
  boot();

  if("serviceWorker" in navigator){
    window.addEventListener("load", function(){
      navigator.serviceWorker.register("/sw.js").catch(function(){});
    });
  }
})();
</script>
</body>
</html>
