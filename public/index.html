<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
<meta name="theme-color" content="#121212" />
<meta name="color-scheme" content="dark" />
<title>Set Log</title>
<link rel="manifest" href="/manifest.webmanifest" />
<link rel="icon" href="/icons/icon.svg" type="image/svg+xml" />
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Set Log" />
<style>
  :root{
    --bg:#121212;
    --surface:#181818;
    --surface-2:#1f1f1f;
    --card:#181818;
    --border:#2a2a2a;
    --text:#ffffff;
    --text-dim:#b3b3b3;
    --text-faint:#7c7c7c;
    --accent:#1ed760;
    --accent-dim:#169c46;
    --negative:#f3727f;
    --warning:#ffa42b;
    --info:#539df5;
    --ease-out: cubic-bezier(0.23,1,0.32,1);
    --ease-in-out: cubic-bezier(0.77,0,0.175,1);
    --radius-s:4px;
    --radius-m:8px;
    --radius-l:16px;
    --shadow-med: rgba(0,0,0,0.3) 0px 8px 8px;
    --shadow-heavy: rgba(0,0,0,0.5) 0px 8px 24px;
  }

  *{box-sizing:border-box;}
  html{
    -webkit-tap-highlight-color: transparent;
    -webkit-text-size-adjust: 100%;
    overscroll-behavior: none;
    height:100%;
  }
  body{
    margin:0;
    height:100%;
    background:var(--bg);
    color:var(--text);
    font-family:-apple-system, BlinkMacSystemFont, "Helvetica Neue", Helvetica, Arial, sans-serif;
    -webkit-font-smoothing:antialiased;
    overscroll-behavior:none;
  }
  input, textarea, select{ font-size:16px; font-family:inherit; }
  button, a, [role="button"]{
    touch-action: manipulation;
    user-select:none;
    -webkit-user-select:none;
    -webkit-touch-callout:none;
  }

  #app{
    display:flex;
    flex-direction:column;
    height:100dvh;
    max-width:520px;
    margin:0 auto;
    position:relative;
  }

  /* ---------- Header ---------- */
  header{
    flex:0 0 auto;
    padding:calc(10px + env(safe-area-inset-top,0px)) 12px 10px;
    background:var(--bg);
    border-bottom:1px solid var(--border);
  }
  .header-top{
    display:flex;
    align-items:flex-start;
    justify-content:space-between;
    gap:10px;
    margin-bottom:10px;
  }
  .day-name{ min-width:0; flex:1; }
  .day-name .weekday{
    font-size:17px;
    font-weight:700;
    display:block;
    line-height:1.25;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
  }
  .day-name .plan-title{
    font-size:13px;
    color:var(--accent);
    font-weight:700;
    display:block;
    line-height:1.3;
    margin-top:1px;
  }
  .today-btn{
    flex:0 0 auto;
    background:var(--surface-2);
    color:var(--text);
    border:none;
    border-radius:9999px;
    padding:0 16px;
    height:36px;
    min-width:64px;
    align-self:center;
    font-size:11px;
    font-weight:700;
    letter-spacing:1.4px;
    text-transform:uppercase;
    transition:transform 140ms var(--ease-out), background 140ms var(--ease-out);
    white-space:nowrap;
  }
  .today-btn:active{ transform:scale(0.94); background:var(--border); }
  @media (hover:hover) and (pointer:fine){
    .today-btn:hover{ background:var(--border); }
  }
  .date-row{
    display:flex;
    align-items:center;
    gap:8px;
  }
  .icon-btn{
    background:var(--surface-2);
    border:none;
    color:var(--text);
    width:40px;
    height:40px;
    flex:0 0 40px;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:18px;
    font-weight:700;
    padding:0;
    transition:transform 140ms var(--ease-out), background 140ms var(--ease-out);
  }
  .icon-btn:active{ transform:scale(0.88); background:var(--border); }
  @media (hover:hover) and (pointer:fine){
    .icon-btn:hover{ background:var(--border); }
  }
  .date-input-wrap{
    flex:1 1 0;
    min-width:0;
    position:relative;
    height:40px;
    border-radius:9999px;
    background:var(--surface-2);
    overflow:hidden;
  }
  .date-input-wrap .date-display{
    position:absolute;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:14px;
    font-weight:700;
    color:var(--text);
    pointer-events:none;
    white-space:nowrap;
  }
  /* The real date input sits invisibly on top so tapping opens the native picker,
     while iOS can't stretch or restyle what's shown. */
  .date-input-wrap input[type=date]{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    min-width:0;
    margin:0;
    padding:0;
    border:none;
    opacity:0;
    -webkit-appearance:none;
    appearance:none;
    font-size:16px;
    cursor:pointer;
  }
  .date-input-wrap:active{ background:var(--border); }

  /* ---------- Content ---------- */
  #content{
    flex:1 1 auto;
    overflow-y:auto;
    overscroll-behavior:contain;
    padding:16px 16px 24px;
    -webkit-overflow-scrolling:touch;
  }

  .rest-day{
    text-align:center;
    padding:60px 20px;
    color:var(--text-dim);
  }
  .rest-day .big{
    font-size:22px;
    font-weight:700;
    color:var(--text);
    margin-bottom:8px;
  }

  .card{
    background:var(--card);
    border-radius:var(--radius-m);
    padding:14px 14px 10px;
    margin-bottom:12px;
    box-shadow:var(--shadow-med);
  }
  .card-head{
    display:flex;
    flex-wrap:wrap;
    justify-content:space-between;
    align-items:baseline;
    margin-bottom:10px;
    gap:4px 8px;
  }
  .card-head .name{
    font-size:16px;
    font-weight:700;
    line-height:1.3;
    flex:1 1 auto;
    min-width:0;
  }
  .card-head .meta{
    font-size:12px;
    color:var(--text-dim);
    white-space:nowrap;
    font-weight:400;
    flex:0 0 auto;
  }
  .card.optional{ border:1px solid var(--border); }

  /* ---------- Collapsible exercise cards ---------- */
  .ex-card{ padding:0; }
  .ex-card .card-head{
    display:flex;
    align-items:center;
    gap:10px;
    margin:0;
    padding:14px;
    cursor:pointer;
    border-radius:var(--radius-m);
    user-select:none;
    -webkit-user-select:none;
    touch-action:manipulation;
    transition:background 140ms var(--ease-out);
  }
  .ex-card .card-head:active{ background:var(--surface-2); }
  .ex-card .card-head:focus-visible{ outline:2px solid var(--accent); outline-offset:-2px; }
  .ex-card .head-text{ flex:1; min-width:0; }
  .ex-card .head-text .name{ display:block; }
  .ex-card .head-text .meta{ display:block; margin-top:2px; white-space:normal; }
  .progress-chip{
    flex:0 0 auto;
    font-size:12px;
    font-weight:700;
    color:var(--text-dim);
    background:var(--surface-2);
    border-radius:9999px;
    padding:4px 10px;
    font-variant-numeric:tabular-nums;
  }
  .progress-chip.complete{ background:var(--accent); color:#050f08; }
  .chevron{
    flex:0 0 auto;
    width:28px; height:28px;
    display:flex; align-items:center; justify-content:center;
    color:var(--text-dim);
    font-size:14px;
    transition:transform 220ms var(--ease-out);
  }
  .ex-card.collapsed .chevron{ transform:rotate(-90deg); }
  .ex-body-wrap{
    display:grid;
    grid-template-rows:1fr;
    transition:grid-template-rows 220ms var(--ease-out);
  }
  .ex-card.collapsed .ex-body-wrap{ grid-template-rows:0fr; }
  .ex-body{
    overflow:hidden;
    min-height:0;
  }
  .ex-body-inner{
    padding:0 14px 10px;
    transition:opacity 180ms var(--ease-out);
  }
  .ex-card.collapsed .ex-body-inner{ opacity:0; }
  .collapse-controls{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin:0 0 8px;
  }
  .collapse-controls .section-label{ margin:0; }
  .text-btn{
    background:none;
    border:none;
    color:var(--text-dim);
    font-size:11px;
    font-weight:700;
    letter-spacing:1.2px;
    text-transform:uppercase;
    height:36px;
    padding:0 4px;
    transition:color 140ms var(--ease-out), transform 140ms var(--ease-out);
  }
  .text-btn:active{ transform:scale(0.95); color:var(--text); }
  @media (prefers-reduced-motion: reduce){
    .ex-body-wrap, .chevron, .ex-body-inner{ transition:none; }
  }
  .optional-tag{
    display:inline-block;
    font-size:10px;
    font-weight:600;
    text-transform:capitalize;
    color:var(--warning);
    background:rgba(255,164,43,0.12);
    padding:2px 8px;
    border-radius:9999px;
    margin-left:6px;
  }

  .set-row{
    display:grid;
    grid-template-columns:20px 1fr 1fr 44px;
    gap:6px;
    align-items:center;
    padding:5px 0;
  }
  .set-row .idx{
    font-size:13px;
    color:var(--text-faint);
    font-weight:700;
  }
  .set-row input{
    background:var(--surface-2);
    border:none;
    color:var(--text);
    border-radius:var(--radius-s);
    padding:11px 6px;
    width:100%;
    min-width:0;
    text-align:center;
    box-shadow: rgb(18,18,18) 0px 1px 0px, rgb(60,60,60) 0px 0px 0px 1px inset;
    transition:box-shadow 140ms var(--ease-out);
  }
  .set-row input:focus{
    outline:none;
    box-shadow: rgb(18,18,18) 0px 1px 0px, rgb(124,124,124) 0px 0px 0px 1px inset;
  }
  .set-row input::placeholder{ color:var(--text-faint); }
  /* Completed sets stay editable; they're just tinted so you can see they're done. */
  .set-row.done input{
    color:var(--text-dim);
    background:rgba(30,215,96,0.06);
    box-shadow: rgb(18,18,18) 0px 1px 0px, rgba(30,215,96,0.35) 0px 0px 0px 1px inset;
  }
  .set-row.done input:focus{
    color:var(--text);
    box-shadow: rgb(18,18,18) 0px 1px 0px, rgb(124,124,124) 0px 0px 0px 1px inset;
  }
  .check-btn{
    width:40px;
    height:40px;
    border-radius:50%;
    border:1.5px solid var(--text-faint);
    background:transparent;
    color:transparent;
    font-size:17px;
    font-weight:700;
    transition:transform 140ms var(--ease-out), background 140ms var(--ease-out), border-color 140ms var(--ease-out), color 140ms var(--ease-out);
    justify-self:center;
  }
  .check-btn:active{ transform:scale(0.88); }
  .check-btn.on{
    background:var(--accent);
    border-color:var(--accent);
    color:#050f08;
  }

  .field-labels{
    display:grid;
    grid-template-columns:20px 1fr 1fr 44px;
    gap:6px;
    margin-bottom:2px;
  }
  .field-labels span{
    font-size:10px;
    color:var(--text-faint);
    text-transform:uppercase;
    letter-spacing:1px;
    text-align:center;
    font-weight:600;
  }
  .field-labels span:first-child{ text-align:left; }
  .field-labels span:last-child{ visibility:hidden; }

  .cardio-card{
    display:flex;
    align-items:center;
    gap:10px;
    flex-wrap:wrap;
  }
  .cardio-card .cinfo{ flex:1 1 140px; min-width:0; }
  .cardio-card .cname{ font-size:16px; font-weight:700; }
  .cardio-card .ctarget{ font-size:12px; color:var(--text-dim); margin-top:2px; }
  .cardio-card input{
    background:var(--surface-2);
    border:none;
    color:var(--text);
    border-radius:var(--radius-s);
    padding:11px 8px;
    height:44px;
    width:72px;
    flex:0 0 auto;
    text-align:center;
    box-shadow: rgb(18,18,18) 0px 1px 0px, rgb(60,60,60) 0px 0px 0px 1px inset;
  }
  .cardio-card input:focus{ outline:none; box-shadow: rgb(18,18,18) 0px 1px 0px, rgb(124,124,124) 0px 0px 0px 1px inset; }
  .done-pill{
    background:var(--surface-2);
    border:none;
    color:var(--text-dim);
    border-radius:9999px;
    padding:0 18px;
    height:44px;
    font-size:11px;
    font-weight:700;
    letter-spacing:1.2px;
    text-transform:uppercase;
    transition:transform 140ms var(--ease-out), background 140ms var(--ease-out), color 140ms var(--ease-out);
    white-space:nowrap;
    flex:0 0 auto;
  }
  .done-pill:active{ transform:scale(0.95); }
  .done-pill.on{ background:var(--accent); color:#050f08; }

  .section-label{
    font-size:12px;
    font-weight:700;
    text-transform:uppercase;
    letter-spacing:1.4px;
    color:var(--text-dim);
    margin:18px 0 8px;
  }
  .section-label:first-child{ margin-top:0; }

  /* ---------- Progress tab ---------- */
  .select-wrap{ margin-bottom:16px; }
  select#exercise-select{
    width:100%;
    background:var(--surface-2);
    color:var(--text);
    border:none;
    border-radius:9999px;
    padding:12px 16px;
    font-size:14px;
    font-weight:700;
    box-shadow: rgb(18,18,18) 0px 1px 0px, rgb(60,60,60) 0px 0px 0px 1px inset;
    appearance:none;
    -webkit-appearance:none;
  }
  .chart-card{
    background:var(--card);
    border-radius:var(--radius-m);
    padding:16px;
    margin-bottom:16px;
    box-shadow:var(--shadow-med);
  }
  .chart-card .chart-empty{
    text-align:center;
    color:var(--text-faint);
    font-size:13px;
    padding:30px 0;
  }
  .history-row{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:10px 0;
    border-bottom:1px solid var(--border);
    font-size:13px;
  }
  .history-row:last-child{ border-bottom:none; }
  .history-row .hdate{ color:var(--text-dim); }
  .history-row .hval{ font-weight:700; }

  /* ---------- Tab bar ---------- */
  nav.tabs{
    flex:0 0 auto;
    display:flex;
    background:var(--bg);
    border-top:1px solid var(--border);
    padding:6px 12px calc(6px + env(safe-area-inset-bottom,0px));
  }
  nav.tabs button{
    flex:1;
    background:none;
    border:none;
    color:var(--text-faint);
    font-size:11px;
    font-weight:700;
    letter-spacing:1.2px;
    text-transform:uppercase;
    min-height:44px;
    padding:8px 0;
    border-radius:var(--radius-s);
    transition:color 140ms var(--ease-out), transform 140ms var(--ease-out);
  }
  nav.tabs button:active{ transform:scale(0.95); }
  nav.tabs button.active{ color:var(--accent); }

  /* ---------- Rest bar ---------- */
  #rest-bar{
    position:fixed;
    left:0; right:0; bottom:57px;
    border-radius:var(--radius-l) var(--radius-l) 0 0;
    max-width:520px;
    margin:0 auto;
    background:var(--surface-2);
    box-shadow:var(--shadow-heavy);
    transform:translateY(100%);
    transition:transform 260ms var(--ease-out);
    z-index:20;
    opacity:0;
    pointer-events:none;
  }
  #rest-bar.show{ transform:translateY(0); opacity:1; pointer-events:auto; }
  body.timer-on #content{ padding-bottom:96px; }
  nav.tabs{ position:relative; z-index:25; }
  .rest-inner{
    display:flex;
    align-items:center;
    gap:10px;
    padding:12px 12px;
    cursor:pointer;
  }
  .rest-ring{
    width:52px; height:52px;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:14px;
    font-weight:700;
    background:conic-gradient(var(--accent) calc(var(--pct,0)*1%), var(--border) 0);
    flex:0 0 auto;
    position:relative;
  }
  .rest-ring::after{
    content:"";
    position:absolute;
    inset:4px;
    border-radius:50%;
    background:var(--surface-2);
  }
  .rest-ring span{ position:relative; z-index:1; }
  .rest-info{ flex:1; min-width:0; }
  .rest-info .rname{ font-size:13px; color:var(--text-dim); font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .rest-info .rlabel{ font-size:11px; color:var(--text-faint); text-transform:uppercase; letter-spacing:1px; margin-top:1px; }
  .rest-actions{ display:flex; gap:6px; align-items:center; }
  .rest-actions button{
    background:var(--surface);
    border:none;
    color:var(--text);
    border-radius:9999px;
    width:40px; height:40px;
    font-size:13px;
    font-weight:700;
    transition:transform 140ms var(--ease-out);
  }
  .rest-actions button:active{ transform:scale(0.88); }
  .rest-actions .skip{
    width:auto;
    height:40px;
    padding:0 14px;
    font-size:10px;
    letter-spacing:1px;
    text-transform:uppercase;
    color:var(--text-dim);
  }

  .tab-panel{
    animation: panelIn 220ms var(--ease-out);
  }
  @keyframes panelIn{
    from{ opacity:0; transform:translateY(6px) scale(0.99); }
    to{ opacity:1; transform:translateY(0) scale(1); }
  }

  /* ---------- Full-screen rest overlay ---------- */
  #rest-screen{
    position:fixed;
    inset:0;
    max-width:520px;
    margin:0 auto;
    background:var(--bg);
    z-index:30;
    display:flex;
    flex-direction:column;
    transform:translateY(100%);
    transition:transform 320ms cubic-bezier(0.32,0.72,0,1);
  }
  #rest-screen.show{ transform:translateY(0); }
  .rs-top{
    flex:0 0 auto;
    display:flex;
    justify-content:flex-end;
    gap:10px;
    padding:calc(14px + env(safe-area-inset-top,0px)) 16px 4px;
  }
  .rs-minimize{
    width:40px; height:40px;
    border-radius:50%;
    border:none;
    background:var(--surface-2);
    color:var(--text-dim);
    font-size:18px;
    font-weight:700;
    transition:transform 140ms var(--ease-out), background 140ms var(--ease-out);
  }
  .rs-minimize:active{ transform:scale(0.88); background:var(--border); }
  .rs-minimize{ display:flex; align-items:center; justify-content:center; }
  .rs-minimize svg{ width:18px; height:18px; }
  .rs-body{
    flex:1 1 auto;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    padding:0 24px calc(24px + env(safe-area-inset-bottom,0px));
    text-align:center;
  }
  .rs-label{
    font-size:12px;
    font-weight:700;
    text-transform:uppercase;
    letter-spacing:2px;
    color:var(--accent);
    margin-bottom:6px;
  }
  .rs-exercise{
    font-size:18px;
    font-weight:700;
    color:var(--text-dim);
    margin-bottom:32px;
  }
  .rs-ring-wrap{
    width:min(66vw, 260px);
    height:min(66vw, 260px);
    border-radius:50%;
    background:conic-gradient(var(--accent) calc(var(--pct,0)*1%), var(--surface-2) 0);
    display:flex;
    align-items:center;
    justify-content:center;
    position:relative;
    margin-bottom:36px;
    transition:background 900ms linear;
  }
  .rs-ring-wrap::after{
    content:"";
    position:absolute;
    inset:10px;
    border-radius:50%;
    background:var(--bg);
  }
  .rs-time{
    position:relative;
    z-index:1;
    font-size:52px;
    font-weight:700;
    font-variant-numeric:tabular-nums;
    letter-spacing:-1px;
  }
  .rs-done-check{
    position:relative;
    z-index:1;
    color:var(--accent);
    font-size:64px;
    line-height:1;
  }
  .rs-adjust{
    display:flex;
    gap:14px;
    margin-bottom:28px;
  }
  .rs-adjust button{
    background:var(--surface-2);
    border:none;
    color:var(--text);
    border-radius:9999px;
    padding:0 22px;
    height:48px;
    font-size:14px;
    font-weight:700;
    transition:transform 140ms var(--ease-out), background 140ms var(--ease-out);
  }
  .rs-adjust button:active{ transform:scale(0.94); background:var(--border); }
  .rs-skip{
    width:100%;
    max-width:280px;
    background:var(--surface-2);
    border:none;
    color:var(--text);
    border-radius:9999px;
    height:52px;
    font-size:13px;
    font-weight:700;
    letter-spacing:1.6px;
    text-transform:uppercase;
    transition:transform 140ms var(--ease-out), background 140ms var(--ease-out);
  }
  .rs-skip:active{ transform:scale(0.96); }
  .rs-skip.primary{ background:var(--accent); color:#050f08; }
  .rs-adjust{ align-items:center; }
  .rs-pause{
    width:64px !important;
    height:64px !important;
    padding:0 !important;
    border-radius:50% !important;
    background:var(--accent) !important;
    color:#050f08 !important;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .rs-pause svg{ width:22px; height:22px; }

  .rs-time{ transition:opacity 200ms ease; }

  /* ---------- Auth screen ---------- */
  #auth-screen{

  #auth-screen.show{ display:flex; }
  .auth-box{ width:100%; max-width:340px; }
  .auth-title{ font-size:28px; font-weight:700; margin:0 0 6px; letter-spacing:-0.4px; }
  .auth-title span{ color:var(--accent); }
  .auth-sub{ color:var(--text-dim); font-size:14px; margin:0 0 28px; }
  .auth-box label{ display:block; font-size:12px; font-weight:700; color:var(--text-dim); margin:0 0 6px; }
  .auth-box input{
    width:100%;

    background:var(--surface-2);

  .auth-btn{
    width:100%;
    height:52px;
    margin-top:8px;
    background:var(--accent);

  }
  .auth-btn:active{ transform:scale(0.97); }
  .auth-btn[disabled]{ opacity:0.6; }
  .auth-error{ color:var(--negative); font-size:13px; min-height:18px; margin-top:12px; }
  .signout-row{ text-align:center; margin-top:24px; }
  .sync-dot{

  /* ---------- Plans ---------- */
  .plans-panel, .plan-editor{ padding-top:calc(4px + env(safe-area-inset-top,0px)); }
  .plans-head{ display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:6px; }
  .plans-head h2{ margin:0; font-size:24px; font-weight:700; letter-spacing:-0.3px; }
  .plans-hint{ color:var(--text-dim); font-size:13px; line-height:1.45; margin:0 0 16px; }
  .plans-hint.center{ text-align:center; margin:16px 0 0; }
  .pill-btn{
    background:var(--surface-2);
    color:var(--text);
    border:none;
    border-radius:9999px;
    height:40px;
    padding:0 16px;
    font-size:11px;
    font-weight:700;

  }
  .pill-btn:active{ transform:scale(0.95); background:var(--border); }
  .pill-btn.accent{ background:var(--accent); color:#050f08; }
  .pill-btn.accent:active{ background:var(--accent-dim); }
  .pill-btn.danger{ background:transparent; color:var(--negative); box-shadow:inset 0 0 0 1px rgba(243,114,127,0.5); }
  .plan-card{ padding:16px; }
  .plan-card.active{ box-shadow:var(--shadow-med), inset 0 0 0 1px rgba(30,215,96,0.45); }
  .plan-card-top{ display:flex; align-items:center; justify-content:space-between; gap:10px; }
  .plan-card-name{ font-size:17px; font-weight:700; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .plan-card-sub{ color:var(--text-dim); font-size:13px; margin-top:4px; }
  .active-badge{
    flex:0 0 auto;
    font-size:10px; font-weight:700; letter-spacing:1px; text-transform:uppercase;

  }
  .week-dots{ display:flex; gap:6px; margin:12px 0 14px; }
  .week-dot{
    width:28px; height:28px; border-radius:50%;

    font-size:11px; font-weight:700;
    background:var(--surface-2); color:var(--text-faint);
  }
  .week-dot.on{ background:rgba(30,215,96,0.16); color:var(--accent); }
  .plan-actions{ display:flex; gap:8px; flex-wrap:wrap; }

  .editor-top{ display:flex; align-items:center; gap:10px; margin-bottom:12px; }
  .plan-name-input{
    flex:1; min-width:0;
    background:transparent; border:none; color:var(--text);
    font-size:22px; font-weight:700; letter-spacing:-0.3px;
    padding:6px 2px; border-bottom:1px solid var(--border);
    border-radius:0;
  }
  .plan-name-input:focus{ outline:none; border-bottom-color:var(--accent); }
  .editor-status{ display:flex; align-items:center; gap:10px; margin-bottom:16px; min-height:40px; }
  .editor-status-text{ color:var(--text-dim); font-size:13px; }
  .day-chips{
    display:flex; gap:5px; overflow-x:auto; margin:0 0 16px; padding:2px 0;
    scrollbar-width:none;
  }
  .day-chips::-webkit-scrollbar{ display:none; }
  .day-chip{
    flex:1 1 0;
    min-width:44px; height:40px; padding:0 4px;
    border:none; border-radius:9999px;
    background:var(--surface-2); color:var(--text-dim);
    font-size:13px; font-weight:700;
    position:relative;
    transition:transform 140ms var(--ease-out), background 140ms var(--ease-out), color 140ms var(--ease-out);
  }
  .day-chip:active{ transform:scale(0.94); }
  .day-chip.has::after{
    content:""; position:absolute; bottom:5px; left:50%;
    width:4px; height:4px; margin-left:-2px; border-radius:50%;
    background:var(--accent);
  }
  .day-chip.active{ background:var(--text); color:#121212; }
  .day-chip.active.has::after{ background:#121212; }
  .field-label{
    display:block; font-size:10px; font-weight:600; letter-spacing:1px; text-transform:uppercase;
    color:var(--text-faint); margin:0 0 6px;
  }
  .text-input{
    width:100%; min-width:0;
    height:44px;
    background:var(--surface-2); border:none; color:var(--text);
    border-radius:var(--radius-s);
    padding:0 12px;
    box-shadow: rgb(18,18,18) 0px 1px 0px, rgb(60,60,60) 0px 0px 0px 1px inset;
    -webkit-appearance:none; appearance:none;
  }
  input.text-input{ line-height:44px; padding-top:0; padding-bottom:0; }
  select.text-input{
    padding-right:28px;
    background-image:linear-gradient(45deg, transparent 50%, var(--text-dim) 50%), linear-gradient(135deg, var(--text-dim) 50%, transparent 50%);
    background-position:calc(100% - 15px) 19px, calc(100% - 10px) 19px;
    background-size:5px 5px;
    background-repeat:no-repeat;
  }
  .text-input:focus{ outline:none; box-shadow: rgb(18,18,18) 0px 1px 0px, rgb(124,124,124) 0px 0px 0px 1px inset; }
  .edit-card{ padding:12px; }
  .name-input{ font-weight:700; margin-bottom:10px; }
  .edit-grid{ display:grid; grid-template-columns:1.15fr 1fr 1fr; gap:8px; }
  .edit-grid.two{ grid-template-columns:1fr 1fr; }
  .edit-field{ min-width:0; }
  .stepper{
    display:flex; align-items:center; justify-content:space-between;
    height:44px; background:var(--surface-2); border-radius:var(--radius-s);
    box-shadow: rgb(18,18,18) 0px 1px 0px, rgb(60,60,60) 0px 0px 0px 1px inset;
    padding:0 2px;
  }
  .stepper .mini-btn{ background:transparent; width:36px; }
  .stepper-val{ font-weight:700; font-variant-numeric:tabular-nums; }
  .edit-actions{ display:flex; gap:6px; justify-content:flex-end; margin-top:10px; }
  .mini-btn{
    height:36px; min-width:36px; padding:0 10px;
    border:none; border-radius:9999px;
    background:var(--surface-2); color:var(--text);
    font-size:14px; font-weight:700;
    transition:transform 140ms var(--ease-out), background 140ms var(--ease-out);
  }
  .mini-btn:active{ transform:scale(0.9); background:var(--border); }
  .mini-btn[disabled]{ opacity:0.3; }
  .mini-btn.danger{ color:var(--negative); font-size:11px; letter-spacing:1px; text-transform:uppercase; }
  .add-btn{
    width:100%; height:48px;
    background:transparent; color:var(--text-dim);
    border:1.5px dashed var(--border); border-radius:9999px;
    font-size:12px; font-weight:700; letter-spacing:1.2px; text-transform:uppercase;
    margin-bottom:4px;
    transition:transform 140ms var(--ease-out), color 140ms var(--ease-out), border-color 140ms var(--ease-out);
  }
  .add-btn:active{ transform:scale(0.98); color:var(--accent); border-color:var(--accent); }
  .empty-note{ color:var(--text-faint); font-size:13px; margin:0 0 10px; }
  .danger-zone{ margin-top:28px; padding-top:20px; border-top:1px solid var(--border); text-align:center; }

  .account-card{ padding:16px; margin-top:24px; }
  .account-email{ font-size:15px; font-weight:700; margin:0 0 12px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .pw-form{ margin-top:16px; display:flex; flex-direction:column; }
  .pw-form[hidden]{ display:none; }
  .pw-form .text-input{ margin-bottom:12px; }
  .pw-form .pill-btn{ align-self:flex-start; }
  .pw-msg{ font-size:13px; min-height:18px; margin-top:10px; color:var(--text-dim); }
  .pw-msg.err{ color:var(--negative); }
  .pw-msg.ok{ color:var(--accent); }

  .plan-editor{ padding-bottom:12px; }
  .save-bar{
    position:sticky;
    bottom:0;
    z-index:5;
    display:flex;
    align-items:center;
    gap:8px;
    margin:24px -16px -24px;
    padding:12px 16px;
    background:var(--surface-2);
    box-shadow:var(--shadow-heavy);
    border-radius:var(--radius-l) var(--radius-l) 0 0;
    transform:translateY(110%);
    opacity:0;
    pointer-events:none;
    transition:transform 240ms var(--ease-out), opacity 180ms var(--ease-out);
  }
  .save-bar.show{ transform:translateY(0); opacity:1; pointer-events:auto; }
  .save-bar-text{ flex:1; min-width:0; font-size:13px; font-weight:700; color:var(--warning); }
  .save-bar .pill-btn{ min-width:88px; }

  .sheet-backdrop{
    position:fixed; inset:0; z-index:60;
    background:rgba(0,0,0,0.6);
    display:flex; align-items:flex-end; justify-content:center;
    opacity:0; pointer-events:none;
    transition:opacity 200ms var(--ease-out);
  }
  .sheet-backdrop.show{ opacity:1; pointer-events:auto; }
  .sheet{
    width:100%; max-width:520px;
    background:var(--surface-2);
    border-radius:var(--radius-l) var(--radius-l) 0 0;
    padding:20px 16px calc(16px + env(safe-area-inset-bottom,0px));
    box-shadow:var(--shadow-heavy);
    transform:translateY(100%);
    transition:transform 280ms cubic-bezier(0.32,0.72,0,1);
    display:flex; flex-direction:column; gap:8px;
  }
  .sheet-backdrop.show .sheet{ transform:translateY(0); }
  .sheet-title{ font-size:18px; font-weight:700; }
  .sheet-text{ color:var(--text-dim); font-size:14px; margin:0 0 8px; }
  .sheet-btn{ width:100%; height:48px; }

  .toast{
    position:fixed; left:50%; bottom:calc(84px + env(safe-area-inset-bottom,0px));
    z-index:70;
    transform:translate(-50%, 12px);
    background:var(--text); color:#121212;
    font-size:13px; font-weight:700;
    padding:10px 18px; border-radius:9999px;
    opacity:0; pointer-events:none;
    transition:opacity 180ms var(--ease-out), transform 180ms var(--ease-out);
  }
  .toast.show{ opacity:1; transform:translate(-50%, 0); }
  @media (prefers-reduced-motion: reduce){
    .save-bar, .sheet, .sheet-backdrop, .toast{ transition:none; }
  }

  .empty-plans{ padding:28px 20px; text-align:center; color:var(--text-dim); font-size:14px; line-height:1.5; }
  .empty-plans .big{ color:var(--text); font-size:18px; font-weight:700; margin-bottom:6px; }
  .empty-plans b{ color:var(--text); }

  .weight-field{ position:relative; min-width:0; }
  .weight-field input{ padding-right:44px !important; }
  .unit-btn{
    position:absolute; top:4px; right:4px; bottom:4px;
    width:38px;
    border:none; border-radius:var(--radius-s);
    background:var(--bg);
    color:var(--text-dim);
    font-size:11px; font-weight:700; letter-spacing:0.3px;
    padding:0;
    transition:transform 140ms var(--ease-out), color 140ms var(--ease-out), background 140ms var(--ease-out);
  }
  .unit-btn:active{ transform:scale(0.9); }


  .icon-del{
    flex:0 0 auto;
    width:40px; height:40px; margin:-8px -8px -8px 0;
    display:flex; align-items:center; justify-content:center;
    border:none; border-radius:50%;
    background:transparent; color:var(--text-faint);
    transition:transform 140ms var(--ease-out), color 140ms var(--ease-out), background 140ms var(--ease-out);
  }
  .icon-del:active{ transform:scale(0.88); color:var(--negative); background:rgba(243,114,127,0.12); }
  @media (hover:hover) and (pointer:fine){
    .icon-del:hover{ color:var(--negative); background:rgba(243,114,127,0.12); }
  }

  /* Unit stays visible next to the number you type, e.g. "5.2 km". */
  .cardio-field{ position:relative; flex:0 0 auto; display:block; }
  .cardio-card .cardio-field input{ width:92px; padding-right:38px; padding-left:6px; text-align:right; }
  .cardio-card{ flex-wrap:nowrap; }
  .cardio-card .cinfo{ flex:1 1 0; min-width:0; }
  .cardio-card .cname{ overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .cardio-card .done-pill{ padding:0 14px; }
  /* Hide number spinners; phones use the keypad anyway. */
  input[type=number]::-webkit-outer-spin-button,
  input[type=number]::-webkit-inner-spin-button{ -webkit-appearance:none; margin:0; }
  input[type=number]{ -moz-appearance:textfield; }
  .cardio-unit{
    position:absolute; top:0; right:10px; bottom:0;
    display:flex; align-items:center;
    font-size:13px; font-weight:700; color:var(--text-dim);
    pointer-events:none;
  }

  .sound-card{ padding:16px; margin-top:24px; }
  .seg{ display:flex; gap:4px; padding:4px; background:var(--bg); border-radius:9999px; margin-bottom:10px; }
  .seg-btn{
    flex:1 1 0; min-width:0; height:36px; padding:0 6px;
    border:none; border-radius:9999px;
    background:transparent; color:var(--text-dim);
    font-size:12px; font-weight:700; white-space:nowrap;
    transition:background 160ms var(--ease-out), color 160ms var(--ease-out), transform 140ms var(--ease-out);
  }
  .seg-btn:active{ transform:scale(0.96); }
  .seg-btn.on{ background:var(--surface-2); color:var(--text); box-shadow:inset 0 0 0 1px var(--border); }
  .sound-help{ color:var(--text-dim); font-size:13px; line-height:1.45; margin:0 0 12px; min-height:38px; }
  .pill-btn[disabled]{ opacity:0.4; }
  .account-card{ margin-top:12px; }

  .header-actions{ display:flex; align-items:center; gap:8px; flex:0 0 auto; }
  .avatar-btn{
    width:36px; height:36px; flex:0 0 36px;
    border:none; border-radius:50%;

    color:#121212; font-size:15px; font-weight:700;
    background:var(--accent);
    padding:0;
    transition:transform 140ms var(--ease-out), box-shadow 140ms var(--ease-out);
  }
  .avatar-btn:active{ transform:scale(0.9); }
  .avatar-btn:focus-visible{ outline:none; box-shadow:0 0 0 2px var(--bg), 0 0 0 4px var(--text); }
  .plans-head .avatar-btn{ width:40px; height:40px; flex-basis:40px; }
  .profile-panel{ padding-top:calc(4px + env(safe-area-inset-top,0px)); }
  .profile-title{ margin:0; font-size:22px; font-weight:700; letter-spacing:-0.3px; }
  .profile-hero{ display:flex; flex-direction:column; align-items:center; gap:12px; padding:12px 0 8px; }
  .avatar-lg{
    width:88px; height:88px; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    color:#121212; font-size:38px; font-weight:700;

  }

  .name-select{ font-weight:700; margin-bottom:10px; }
  .name-select:invalid, .name-select option[value=""]{ color:var(--text-dim); }
  .custom-name{ margin-top:-2px; }
</style>
</head>
<body>
<div id="auth-screen">
  <form class="auth-box" id="auth-form">
    <h1 class="auth-title">Set <span>Log</span></h1>
    <p class="auth-sub">Sign in to your account. No account yet? Ask the app owner to add you.</p>
    <label for="auth-email">Email</label>
    <input id="auth-email" type="email" autocomplete="email" autocapitalize="none" autocorrect="off" required />
    <label for="auth-password">Password</label>
    <input id="auth-password" type="password" autocomplete="current-password" required />
    <button class="auth-btn" id="auth-submit" type="submit" enterkeyhint="go">Sign in</button>
    <div class="auth-error" id="auth-error" role="alert"></div>
  </form>
</div>

<div id="leave-sheet" class="sheet-backdrop" role="dialog" aria-modal="true" aria-labelledby="leave-sheet-title">
  <div class="sheet">
    <div class="sheet-title" id="leave-sheet-title">Save changes?</div>
    <p class="sheet-text">You have edits that haven't been saved.</p>
    <button class="pill-btn accent sheet-btn" data-leave="save">Save</button>
    <button class="pill-btn sheet-btn" data-leave="discard">Discard changes</button>
    <button class="text-btn sheet-btn" data-leave="cancel">Keep editing</button>
  </div>
</div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>

<div id="app">
  <header id="app-header">
    <div class="header-top">
      <div class="day-name">
        <span class="weekday" id="weekday-label">—</span>
        <span class="plan-title"><span id="plan-title-label">—</span><span class="sync-dot" id="sync-dot" title="Synced"></span></span>
      </div>
      <div class="header-actions">
        <button class="today-btn" id="today-btn">Today</button>
        <button class="avatar-btn" id="header-avatar" data-open-profile aria-label="Profile and settings"></button>
      </div>
    </div>
    <div class="date-row">
      <button class="icon-btn" id="prev-day" aria-label="Previous day">&#8249;</button>
      <label class="date-input-wrap">
        <span class="date-display" id="date-display">—</span>
        <input type="date" id="date-input" aria-label="Pick a date" />
      </label>
      <button class="icon-btn" id="next-day" aria-label="Next day">&#8250;</button>
    </div>
  </header>

  <main id="content"></main>

  <nav class="tabs">
    <button data-tab="today" class="active">Today</button>
    <button data-tab="progress">Progress</button>
    <button data-tab="plans">Plans</button>
  </nav>

  <div id="rest-bar">
    <div class="rest-inner">
      <div class="rest-ring"><span id="rest-time">0:00</span></div>
      <div class="rest-info">
        <div class="rname" id="rest-name">Rest</div>
        <div class="rlabel">Rest timer</div>
      </div>
      <div class="rest-actions">
        <button id="rest-minus">−15</button>
        <button class="rest-pause" id="rest-pause" aria-label="Pause timer"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><rect x="3" y="2" width="3.5" height="12" rx="1" fill="currentColor"/><rect x="9.5" y="2" width="3.5" height="12" rx="1" fill="currentColor"/></svg></button>
        <button id="rest-plus">+15</button>
        <button class="skip" id="rest-skip">Skip</button>
      </div>
    </div>
  </div>

  <div id="rest-screen">
    <div class="rs-top">
      <button class="rs-minimize" id="rs-minimize" aria-label="Minimize timer"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><rect x="3" y="7.25" width="10" height="1.5" rx="0.75" fill="currentColor"/></svg></button>
      <button class="rs-minimize rs-close" id="rs-close" aria-label="Stop timer"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M4 4l8 8M12 4l-8 8" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg></button>
    </div>
    <div class="rs-body">
      <div class="rs-label" id="rs-label">Rest</div>
      <div class="rs-exercise" id="rs-exercise">Exercise</div>
      <div class="rs-ring-wrap" id="rs-ring-wrap"><span class="rs-time" id="rs-time-big">0:00</span></div>
      <div class="rs-adjust">
        <button id="rs-minus">−15s</button>
        <button class="rs-pause" id="rs-pause" aria-label="Pause timer"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><rect x="3" y="2" width="3.5" height="12" rx="1" fill="currentColor"/><rect x="9.5" y="2" width="3.5" height="12" rx="1" fill="currentColor"/></svg></button>
        <button id="rs-plus">+15s</button>
      </div>
      <button class="rs-skip" id="rs-skip-full">Skip rest</button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/config.js"></script>
<script>
(function(){
  "use strict";

  /* ---------------- Plan data ---------------- */

  var WEEKDAY_NAMES = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];

  function pad(n){ return String(n).padStart(2,"0"); }
  function todayStr(){
    var d = new Date();
    return d.getFullYear() + "-" + pad(d.getMonth()+1) + "-" + pad(d.getDate());
  }
  function dowFromDateStr(s){ return new Date(s + "T00:00:00").getDay(); }

  /* Local cache: every write lands here first, so logging works with bad gym signal.
     Anything not yet confirmed by Supabase sits in a pending queue and retries. */
  var CACHE_PREFIX = "setlog:";
  var PENDING_KEY = "setlog:pending";
  function cacheGet(date){
    try{ var raw = localStorage.getItem(CACHE_PREFIX + date); return raw ? JSON.parse(raw) : null; }catch(e){ return null; }
  }
  function cacheSet(date, data){
    try{ localStorage.setItem(CACHE_PREFIX + date, JSON.stringify(data)); }catch(e){}
  }
  function pendingGet(){
    try{ return JSON.parse(localStorage.getItem(PENDING_KEY) || "[]"); }catch(e){ return []; }
  }
  function pendingSet(arr){
    try{ localStorage.setItem(PENDING_KEY, JSON.stringify(arr)); }catch(e){}
    updateSyncDot();
  }
  /* Every cache key is scoped to the signed-in user, so several people
     can share one phone without seeing each other's workouts. */
  var currentUserEmail = "";
  var cacheNs = "setlog:";
  function useNamespace(uid){
    var ns = "setlog:" + uid + ":";
    try{
      if(!localStorage.getItem("setlog:migratedTo")){
        /* One-time move of data cached before accounts were per-user. */
        var legacy = /^setlog:(\d{4}-\d{2}-\d{2}|pending|plans|settings|pendingPlans|pendingSettings)$/;
        var keys = [];
        for(var i=0;i<localStorage.length;i++){ var k = localStorage.key(i); if(legacy.test(k)) keys.push(k); }
        keys.forEach(function(k){
          localStorage.setItem(ns + k.slice("setlog:".length), localStorage.getItem(k));
          localStorage.removeItem(k);
        });
        localStorage.setItem("setlog:migratedTo", uid);
      }
    }catch(e){}
    cacheNs = ns;
    CACHE_PREFIX = ns;
    PENDING_KEY = ns + "pending";
    PLANS_CACHE_KEY = ns + "plans";
    SETTINGS_CACHE_KEY = ns + "settings";
    PLAN_QUEUE_KEY = ns + "pendingPlans";
    SETTINGS_PENDING_KEY = ns + "pendingSettings";
  }
  function hasUnsynced(){
    return pendingGet().length > 0 || planQueueGet().length > 0 || settingsPending();
  }
  function clearUserCache(){
    try{
      var keys = [];
      for(var i=0;i<localStorage.length;i++){ var k = localStorage.key(i); if(k && k.indexOf(cacheNs) === 0) keys.push(k); }
      keys.forEach(function(k){ localStorage.removeItem(k); });
    }catch(e){}
  }

  var PLANS_CACHE_KEY = "setlog:plans";
  var SETTINGS_CACHE_KEY = "setlog:settings";
  var PLAN_QUEUE_KEY = "setlog:pendingPlans";
  var SETTINGS_PENDING_KEY = "setlog:pendingSettings";
  function readJSON(key, fallback){
    try{ var raw = localStorage.getItem(key); return raw ? JSON.parse(raw) : fallback; }catch(e){ return fallback; }
  }
  function writeJSON(key, value){
    try{ localStorage.setItem(key, JSON.stringify(value)); }catch(e){}
  }
  function planQueueGet(){ return readJSON(PLAN_QUEUE_KEY, []); }
  function planQueueSet(q){ writeJSON(PLAN_QUEUE_KEY, q); updateSyncDot(); }
  function settingsPending(){ try{ return localStorage.getItem(SETTINGS_PENDING_KEY) === "1"; }catch(e){ return false; } }
  function setSettingsPending(v){
    try{ if(v) localStorage.setItem(SETTINGS_PENDING_KEY, "1"); else localStorage.removeItem(SETTINGS_PENDING_KEY); }catch(e){}
    updateSyncDot();
  }

  function updateSyncDot(){
    var dot = document.getElementById("sync-dot");
    if(!dot) return;
    var pending = pendingGet().length > 0 || planQueueGet().length > 0 || settingsPending();
    dot.classList.toggle("pending", pending);
    dot.title = pending ? "Saved on this phone, syncing when online" : "Synced";
  }

  function supabaseStore(client, userId){
    var TABLE = "workout_logs";

    async function pushRemote(date, data){
      var res = await client.from(TABLE).upsert(
        { user_id: userId, log_date: date, data: data, updated_at: new Date(data.updatedAt || Date.now()).toISOString() },
        { onConflict: "user_id,log_date" }
      );
      if(res.error) throw res.error;
    }

    async function pushPlanOp(op){
      if(op.op === "delete"){
        var del = await client.from("workout_plans").delete().eq("user_id", userId).eq("id", op.id);
        if(del.error) throw del.error;
        return;
      }
      var plan = readJSON(PLANS_CACHE_KEY, []).find(function(x){ return x.id === op.id; });
      if(!plan) return;
      var up = await client.from("workout_plans").upsert({
        id: plan.id, user_id: userId, name: plan.name, data: plan.data,
        updated_at: new Date(plan.updatedAt || Date.now()).toISOString()
      });
      if(up.error) throw up.error;
    }

    async function pushSettings(){
      var st = readJSON(SETTINGS_CACHE_KEY, {});
      var res = await client.from("user_settings").upsert(
        { user_id: userId, active_plan_id: st.activePlanId || null, updated_at: new Date().toISOString() },
        { onConflict: "user_id" }
      );
      if(res.error) throw res.error;
    }

    function enqueuePlan(op){
      var q = planQueueGet().filter(function(o){ return o.id !== op.id; });
      q.push(op);
      planQueueSet(q);
    }

    var flushing = false;
    async function flushPending(){
      if(flushing) return;
      flushing = true;
      try{
        var pq = planQueueGet();
        while(pq.length){
          await pushPlanOp(pq[0]);
          pq.shift();
          planQueueSet(pq);
        }
        if(settingsPending()){
          await pushSettings();
          setSettingsPending(false);
        }
        var queue = pendingGet();
        while(queue.length){
          var date = queue[0];
          var data = cacheGet(date);
          if(data){ await pushRemote(date, data); }
          queue.shift();
          pendingSet(queue);
        }
      }catch(e){
        /* still offline or a transient error: keep the queue, retry later */
      }finally{
        flushing = false;
      }
    }

    window.addEventListener("online", flushPending);
    document.addEventListener("visibilitychange", function(){ if(!document.hidden) flushPending(); });
    setInterval(flushPending, 30000);
    flushPending();

    return {
      async getDoc(date){
        var local = cacheGet(date);
        try{
          var res = await client.from(TABLE).select("data").eq("user_id", userId).eq("log_date", date).maybeSingle();
          if(res.error) throw res.error;
          var remote = res.data ? res.data.data : null;
          if(remote && (!local || (remote.updatedAt || 0) >= (local.updatedAt || 0))){
            cacheSet(date, remote);
            return remote;
          }
          return local;
        }catch(e){
          return local;
        }
      },
      async setDoc(date, data){
        cacheSet(date, data);
        var queue = pendingGet();
        if(queue.indexOf(date) === -1){ queue.push(date); pendingSet(queue); }
        await flushPending();
      },
      async loadPlans(){
        var local = readJSON(PLANS_CACHE_KEY, []);
        try{
          var res = await client.from("workout_plans").select("id,name,data,updated_at").eq("user_id", userId).order("created_at", { ascending:true });
          if(res.error) throw res.error;
          var pendingUp = {}, pendingDel = {};
          planQueueGet().forEach(function(o){ if(o.op === "delete") pendingDel[o.id] = true; else pendingUp[o.id] = true; });
          var merged = res.data
            .filter(function(r){ return !pendingDel[r.id]; })
            .map(function(r){
              if(pendingUp[r.id]){
                var l = local.find(function(x){ return x.id === r.id; });
                if(l) return l;
              }
              return { id:r.id, name:r.name, data:r.data, updatedAt: Date.parse(r.updated_at) };
            });
          local.forEach(function(l){
            if(pendingUp[l.id] && !merged.some(function(m){ return m.id === l.id; })) merged.push(l);
          });
          writeJSON(PLANS_CACHE_KEY, merged);
          return { plans: merged, fromRemote: true };
        }catch(e){
          return { plans: local, fromRemote: false };
        }
      },
      async getSettings(){
        var local = readJSON(SETTINGS_CACHE_KEY, {});
        if(settingsPending()) return local;
        try{
          var res = await client.from("user_settings").select("active_plan_id").eq("user_id", userId).maybeSingle();
          if(res.error) throw res.error;
          var st = { activePlanId: res.data ? res.data.active_plan_id : null };
          writeJSON(SETTINGS_CACHE_KEY, st);
          return st;
        }catch(e){
          return local;
        }
      },
      async savePlan(plan){
        plan.updatedAt = Date.now();
        var all = readJSON(PLANS_CACHE_KEY, []);
        var i = all.findIndex(function(x){ return x.id === plan.id; });
        if(i === -1) all.push(plan); else all[i] = plan;
        writeJSON(PLANS_CACHE_KEY, all);
        enqueuePlan({ op:"upsert", id: plan.id });
        await flushPending();
      },
      async deletePlan(id){
        var all = readJSON(PLANS_CACHE_KEY, []).filter(function(x){ return x.id !== id; });
        writeJSON(PLANS_CACHE_KEY, all);
        enqueuePlan({ op:"delete", id: id });
        await flushPending();
      },
      async setActivePlan(id){
        writeJSON(SETTINGS_CACHE_KEY, { activePlanId: id });
        setSettingsPending(true);
        await flushPending();
      },
      async queryRecent(limit){
        var byDate = {};
        try{
          var res = await client.from(TABLE).select("log_date,data").eq("user_id", userId).order("log_date", { ascending:false }).limit(limit);
          if(res.error) throw res.error;
          res.data.forEach(function(row){ byDate[row.log_date] = row.data; });
        }catch(e){}
        pendingGet().forEach(function(d){
          var local = cacheGet(d);
          if(local) byDate[d] = local;
        });
        return Object.keys(byDate).sort().reverse().slice(0, limit).map(function(d){ return byDate[d]; });
      }
    };
  }

  /* ---------------- Auth ---------------- */
  var sb = null;

  function showAuth(show){
    document.getElementById("auth-screen").classList.toggle("show", show);
  }

  async function initStore(){
    var cfg = window.SETLOG_CONFIG || {};
    if(!cfg.supabaseUrl || !cfg.supabaseAnonKey || !window.supabase){
      throw new Error("Missing Supabase config");
    }
    sb = window.supabase.createClient(cfg.supabaseUrl, cfg.supabaseAnonKey, {
      auth: { persistSession: true, autoRefreshToken: true }
    });
    var sessionRes = await sb.auth.getSession();
    var session = sessionRes.data.session;
    if(!session){
      showAuth(true);
      session = await waitForSignIn();
      showAuth(false);
    }
    sb.auth.onAuthStateChange(function(event){
      if(event === "SIGNED_OUT"){ location.reload(); }
    });
    useNamespace(session.user.id);
    currentUserEmail = session.user.email || "";
    return supabaseStore(sb, session.user.id);
  }

  function waitForSignIn(){
    return new Promise(function(resolve){
      var form = document.getElementById("auth-form");
      var btn = document.getElementById("auth-submit");
      var err = document.getElementById("auth-error");
      form.addEventListener("submit", async function(e){
        e.preventDefault();
        err.textContent = "";
        btn.disabled = true;
        btn.textContent = "Signing in…";
        var res = await sb.auth.signInWithPassword({
          email: document.getElementById("auth-email").value.trim(),
          password: document.getElementById("auth-password").value
        });
        btn.disabled = false;
        btn.textContent = "Sign in";
        if(res.error){
          err.textContent = res.error.message || "Sign in failed. Check your email and password.";
          return;
        }
        resolve(res.data.session);
      });
    });
  }

  /* ---------------- State ---------------- */
  var store = null;
  var currentDate = todayStr();
  var currentDow = dowFromDateStr(currentDate);
  var currentLog = null;
  var activeTab = "today";
  var saveTimer = null;
  var selectedProgressKey = null;
  var collapsed = {};
  var plans = [];
  var activePlanId = null;
  var currentDayPlan = { title:"Rest", exercises:[], cardio:[] };

  function clone(o){ return JSON.parse(JSON.stringify(o)); }
  function activePlan(){
    return plans.find(function(p){ return p.id === activePlanId; }) || plans[0] || null;
  }
  function activeDays(){
    var p = activePlan();
    return p ? p.data.days : {};
  }
  function emptyDay(){ return { title:"", exercises:[], cardio:[] }; }
  function normaliseDay(d){
    d = d || emptyDay();
    return { title: d.title || "", exercises: d.exercises || [], cardio: d.cardio || [] };
  }
  /* Past days that were logged keep the plan they were done with.
     Today and future days follow whichever plan is active now. */
  function dayPlanFor(saved, dateStr, dow){
    if(saved && saved.plan && dateStr < todayStr()) return normaliseDay(saved.plan);
    return normaliseDay(activeDays()[dow]);
  }
  function allExercises(){
    var seen = {}, list = [];
    var ordered = plans.slice().sort(function(a,b){ return (b.id === activePlanId) - (a.id === activePlanId); });
    var sources = ordered.map(function(p){ return p.data.days; });
    sources.forEach(function(days){
      [1,2,3,4,5,6,0].forEach(function(d){
        normaliseDay(days[d]).exercises.forEach(function(ex){
          if(ex.key && !seen[ex.key]){ seen[ex.key] = true; list.push({ key:ex.key, name: ex.name || "Untitled exercise" }); }
        });
      });
    });
    return list;
  }

  /* Weight unit per exercise. The last unit you picked for an exercise
     becomes its default on future days. */
  var LB_TO_KG = 0.45359237;
  function unitPrefs(){ return readJSON(cacheNs + "units", {}); }
  function preferredUnit(key){ return unitPrefs()[key] === "lbs" ? "lbs" : "kg"; }
  function rememberUnit(key, unit){
    var prefs = unitPrefs();
    prefs[key] = unit;
    writeJSON(cacheNs + "units", prefs);
  }
  function convertWeight(w, from, to){
    if(from === to) return w;
    return from === "lbs" ? w * LB_TO_KG : w / LB_TO_KG;
  }
  function roundWeight(w){ return Math.round(w * 10) / 10; }

  function defaultLog(dateStr, dow, p){
    var exercises = {};
    p.exercises.forEach(function(ex){
      var sets = [];
      var n = Math.max(1, parseInt(ex.sets, 10) || 1);
      for(var i=0;i<n;i++){ sets.push({weight:"", reps:"", done:false}); }
      exercises[ex.key] = { unit: preferredUnit(ex.key), sets: sets };
    });
    var cardio = {};
    p.cardio.forEach(function(c){ cardio[c.key] = { value:"", done:false }; });
    return { date: dateStr, day: dow, exercises: exercises, cardio: cardio, updatedAt: Date.now() };
  }

  function mergeLog(saved, dateStr, dow, dayPlan){
    var base = defaultLog(dateStr, dow, dayPlan);
    if(!saved) return base;
    Object.keys(base.exercises).forEach(function(k){
      var savedEx = saved.exercises && saved.exercises[k];
      if(savedEx && Array.isArray(savedEx.sets)){
        var anyWeight = savedEx.sets.some(function(x){ return x && x.weight !== "" && x.weight != null; });
        /* Logs from before units existed were always kg. */
        base.exercises[k].unit = savedEx.unit || (anyWeight ? "kg" : base.exercises[k].unit);
        base.exercises[k].sets.forEach(function(s, i){
          var sv = savedEx.sets[i];
          if(sv){
            s.weight = sv.weight != null ? sv.weight : "";
            s.reps = sv.reps != null ? sv.reps : "";
            s.done = !!sv.done;
          }
        });
      }
    });
    Object.keys(base.cardio).forEach(function(k){
      var savedC = saved.cardio && saved.cardio[k];
      if(savedC){
        base.cardio[k].value = savedC.value != null ? savedC.value : "";
        base.cardio[k].done = !!savedC.done;
      }
    });
    return base;
  }

  async function loadDate(dateStr){
    currentDate = dateStr;
    currentDow = dowFromDateStr(dateStr);
    var saved = await store.getDoc(dateStr);
    currentDayPlan = dayPlanFor(saved, dateStr, currentDow);
    currentLog = mergeLog(saved, dateStr, currentDow, currentDayPlan);
    collapsed = {};
    currentDayPlan.exercises.forEach(function(ex){
      var sets = currentLog.exercises[ex.key].sets;
      if(sets.length && sets.every(function(x){ return x.done; })) collapsed[ex.key] = true;
    });
    renderHeader();
    render();
  }

  function scheduleSave(){
    clearTimeout(saveTimer);
    saveTimer = setTimeout(function(){
      currentLog.updatedAt = Date.now();
      currentLog.date = currentDate;
      currentLog.day = currentDow;
      currentLog.plan = clone(currentDayPlan);
      var ap = activePlan();
      if(ap && currentDate >= todayStr()) currentLog.planId = ap.id;
      store.setDoc(currentDate, currentLog);
    }, 500);
  }

  /* ---------------- Header ---------------- */
  var weekdayLabel = document.getElementById("weekday-label");
  var planTitleLabel = document.getElementById("plan-title-label");
  var dateInput = document.getElementById("date-input");

  function renderHeader(){
    weekdayLabel.textContent = WEEKDAY_NAMES[currentDow] + ", " + formatShort(currentDate);
    var hasContent = currentDayPlan.exercises.length || currentDayPlan.cardio.length;
    planTitleLabel.textContent = currentDayPlan.title || (hasContent ? "Workout" : (plans.length ? "Rest" : "No plan yet"));
    dateInput.value = currentDate;
    var dd = document.getElementById("date-display");
    if(dd){
      var d = new Date(currentDate + "T00:00:00");
      dd.textContent = d.toLocaleDateString("en-GB", { weekday:"short", day:"numeric", month:"short", year:"numeric" });
    }
  }
  function formatShort(dateStr){
    var d = new Date(dateStr+"T00:00:00");
    var months = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
    return months[d.getMonth()] + " " + d.getDate();
  }
  function shiftDate(delta){
    var d = new Date(currentDate+"T00:00:00");
    d.setDate(d.getDate()+delta);
    loadDate(d.getFullYear() + "-" + pad(d.getMonth()+1) + "-" + pad(d.getDate()));
  }

  document.getElementById("prev-day").addEventListener("click", function(){ shiftDate(-1); });
  document.getElementById("next-day").addEventListener("click", function(){ shiftDate(1); });
  document.getElementById("today-btn").addEventListener("click", function(){ loadDate(todayStr()); });
  dateInput.addEventListener("change", function(){
    if(dateInput.value) loadDate(dateInput.value);
  });

  /* ---------------- Tabs ---------------- */
  var tabButtons = document.querySelectorAll("nav.tabs button");
  tabButtons.forEach(function(btn){
    btn.addEventListener("click", function(){
      var next = btn.getAttribute("data-tab");
      if(activeTab === "plans" && next !== "plans" && editingPlanId){
        leaveEditor().then(function(ok){ if(ok) btn.click(); });
        return;
      }
      activeTab = next;
      setTabUi(next);
      content.scrollTop = 0;
      if(activeTab === "today") loadDate(currentDate);
      else render();
    });
  });

  /* ---------------- Content rendering ---------------- */
  var content = document.getElementById("content");

  function esc(s){
    return String(s).replace(/[&<>"']/g, function(c){
      return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
    });
  }

  function render(){
    if(activeTab === "today") renderToday();
    else if(activeTab === "progress") renderProgress();
    else if(activeTab === "profile") renderProfile();
    else renderPlans();
  }

  function renderToday(){
    var plan = currentDayPlan;
    if(!plans.length && plan.exercises.length === 0 && plan.cardio.length === 0){
      content.innerHTML = '<div class="tab-panel rest-day"><div class="big">No workout plan yet</div>' +
        'Create a plan with your weekly exercises, and each day\'s workout will show up here.' +
        '<div style="margin-top:20px"><button class="pill-btn accent" data-go-new-plan>Create a plan</button></div></div>';
      return;
    }
    if(plan.exercises.length === 0 && plan.cardio.length === 0){
      content.innerHTML = '<div class="tab-panel rest-day"><div class="big">Rest day</div>Full recovery — nothing logged here today.</div>';
      return;
    }
    var html = '<div class="tab-panel">';

    if(plan.exercises.length){
      html += '<div class="collapse-controls"><div class="section-label">Strength</div>';
      html += '<button class="text-btn" data-toggle-all>' + (allCollapsed(plan) ? 'Expand all' : 'Collapse all') + '</button></div>';
      plan.exercises.forEach(function(ex){
        var log = currentLog.exercises[ex.key];
        var doneCount = log.sets.filter(function(x){ return x.done; }).length;
        var isCollapsed = !!collapsed[ex.key];
        html += '<div class="card ex-card' + (ex.optional ? ' optional' : '') + (isCollapsed ? ' collapsed' : '') + '" data-ex-card="' + ex.key + '">';
        html += '<div class="card-head" role="button" tabindex="0" aria-expanded="' + (!isCollapsed) + '" data-toggle-ex="' + ex.key + '">';
        html += '<div class="head-text"><span class="name">' + esc(ex.name || "Untitled exercise") + (ex.optional ? '<span class="optional-tag">Optional</span>' : '') + '</span>';
        html += '<span class="meta">' + ex.sets + ' x ' + esc(ex.reps) + ' &middot; rest ' + formatRestShort(ex.rest) + '</span></div>';
        html += '<span class="progress-chip' + (doneCount === log.sets.length ? ' complete' : '') + '">' + doneCount + '/' + log.sets.length + '</span>';
        html += '<span class="chevron" aria-hidden="true">&#9662;</span>';
        html += '</div>';
        html += '<div class="ex-body-wrap"><div class="ex-body"><div class="ex-body-inner">';
        html += '<div class="field-labels"><span>#</span><span>Weight</span><span>Reps</span><span>✓</span></div>';
        log.sets.forEach(function(s, i){
          html += '<div class="set-row' + (s.done ? ' done' : '') + '">';
          html += '<div class="idx">' + (i+1) + '</div>';
          html += '<div class="weight-field">';
          html += '<input type="number" inputmode="decimal" placeholder="0" aria-label="Weight in ' + log.unit + '" value="' + esc(s.weight) + '" data-set-input data-key="' + ex.key + '" data-index="' + i + '" data-field="weight" ' + ' />';
          html += '<button type="button" class="unit-btn' + (log.unit === "lbs" ? ' lbs' : '') + '" data-unit-toggle="' + ex.key + '" aria-label="Weight unit: ' + log.unit + '. Tap to switch.">' + log.unit + '</button>';
          html += '</div>';
          html += '<input type="number" inputmode="numeric" placeholder="' + esc(ex.reps) + '" value="' + esc(s.reps) + '" data-set-input data-key="' + ex.key + '" data-index="' + i + '" data-field="reps" ' + ' />';
          html += '<button class="check-btn' + (s.done ? ' on' : '') + '" data-set-done data-key="' + ex.key + '" data-index="' + i + '" data-rest="' + ex.rest + '" data-name="' + esc(ex.name) + '">&#10003;</button>';
          html += '</div>';
        });
        html += '</div></div></div>';
        html += '</div>';
      });
    }

    if(plan.cardio.length){
      html += '<div class="section-label">Cardio</div>';
      plan.cardio.forEach(function(c){
        var log = currentLog.cardio[c.key];
        html += '<div class="card cardio-card">';
        html += '<div class="cinfo"><div class="cname">' + esc(c.name) + '</div><div class="ctarget">' + esc(c.target) + '</div></div>';
        if(c.kind !== "done"){
          var unit = c.kind === "distance" ? "km" : "min";
          html += '<label class="cardio-field">';
          html += '<input type="number" inputmode="decimal" placeholder="0" aria-label="' + esc(c.name || "Cardio") + ' in ' + unit + '" value="' + esc(log.value) + '" data-cardio-input data-key="' + c.key + '" />';

  content.addEventListener("click", function(e){
    var unitBtn = e.target.closest("[data-unit-toggle]");
    if(unitBtn){
      e.preventDefault();
      var uk = unitBtn.dataset.unitToggle;
      var exLog = currentLog.exercises[uk];
      exLog.unit = exLog.unit === "lbs" ? "kg" : "lbs";

      scheduleSave();
      return;
    }
    var doneBtn = e.target.closest("[data-set-done]");
    if(doneBtn){
      var key = doneBtn.dataset.key, index = doneBtn.dataset.index;
      var setObj = currentLog.exercises[key].sets[index];
      setObj.done = !setObj.done;
      var allSets = currentLog.exercises[key].sets;
      var justCompleted = setObj.done && allSets.every(function(x){ return x.done; });
      if(setObj.done){
        startRest(parseInt(doneBtn.dataset.rest, 10), doneBtn.dataset.name);

      scheduleSave();
      render();
      if(justCompleted){
        setTimeout(function(){ setCollapsed(key, true); }, 350);
      }
      return;
    }
    var toggleAll = e.target.closest("[data-toggle-all]");
    if(toggleAll){
      var plan = currentDayPlan;
      var target = !allCollapsed(plan);
      plan.exercises.forEach(function(ex){ setCollapsed(ex.key, target); });

    var head = e.target.closest("[data-toggle-ex]");

      setCollapsed(k, !collapsed[k]);
      return;
    }
    var cardioBtn = e.target.closest("[data-cardio-done]");
    if(cardioBtn){
      var ckey = cardioBtn.dataset.key;
      currentLog.cardio[ckey].done = !currentLog.cardio[ckey].done;

      render();

  async function loadProgressData(){
    var docs = await store.queryRecent(30);
    var asc = docs.filter(Boolean).slice().sort(function(a,b){ return (a.date||"").localeCompare(b.date||""); });
    var entries = [];
    asc.forEach(function(d){
      var ex = d.exercises && d.exercises[selectedProgressKey];
      if(ex && Array.isArray(ex.sets)){
        var unit = ex.unit === "lbs" ? "lbs" : "kg";
        var max = 0, repsAtMax = "";
        ex.sets.forEach(function(s){
          var w = parseFloat(s.weight);
          if(!isNaN(w) && w > max){ max = w; repsAtMax = s.reps; }
        });
        if(max > 0) entries.push({ date: d.date, raw: max, unit: unit, reps: repsAtMax });
      }
    });
    /* Chart everything in the unit you used most recently for this exercise. */
    var displayUnit = entries.length ? entries[entries.length-1].unit : preferredUnit(selectedProgressKey);
    var points = entries.map(function(e){
      return { date: e.date, weight: roundWeight(convertWeight(e.raw, e.unit, displayUnit)), raw: e.raw, unit: e.unit, reps: e.reps };
    });
    renderChart(points, displayUnit);
    renderHistoryList(points);
  }

  function renderChart(points, unit){
    var el = document.getElementById("chart-card");
    if(!el) return;
    if(points.length < 2){
      el.innerHTML = '<div class="chart-empty">' + (points.length===1 ? "Log this exercise again to see a trend." : "No logged sets yet for this exercise.") + '</div>';
      return;
    }
    var W = 280, H = 110, padX = 8, padY = 14;
    var weights = points.map(function(p){ return p.weight; });
    var min = Math.min.apply(null, weights), max = Math.max.apply(null, weights);
    if(min === max){ min -= 1; max += 1; }
    var stepX = (W - padX*2) / (points.length - 1);
    var coords = points.map(function(p, i){
      var x = padX + i*stepX;
      var y = padY + (1 - (p.weight - min)/(max - min)) * (H - padY*2);
      return [x,y];
    });
    var pathD = coords.map(function(c, i){ return (i===0?"M":"L") + c[0].toFixed(1) + "," + c[1].toFixed(1); }).join(" ");
    var dots = coords.map(function(c){ return '<circle cx="'+c[0].toFixed(1)+'" cy="'+c[1].toFixed(1)+'" r="3" fill="var(--accent)" />'; }).join("");
    var svg = '<svg viewBox="0 0 ' + W + ' ' + H + '" width="100%" height="' + H + '" preserveAspectRatio="none" style="overflow:visible">';
    svg += '<path d="' + pathD + '" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />';
    svg += dots;
    svg += '</svg>';
    svg += '<div style="display:flex;justify-content:space-between;margin-top:6px;font-size:11px;color:var(--text-faint)">';
    svg += '<span>' + roundWeight(min) + ' ' + unit + '</span><span>' + roundWeight(max) + ' ' + unit + '</span></div>';
    el.innerHTML = svg;
  }

  }

  function uuid(){
    if(window.crypto && crypto.randomUUID) return crypto.randomUUID();
    return "xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx".replace(/[xy]/g, function(c){
      var r = Math.random()*16|0; return (c === "x" ? r : (r&0x3|0x8)).toString(16);
    });
  }
  function slugify(str){
    return String(str || "").toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "") || "exercise";
  }
  function uniqueKey(day, base, self){
    var taken = {};
    day.exercises.concat(day.cardio).forEach(function(x){ if(x !== self) taken[x.key] = true; });
    var k = base, n = 2;
    while(taken[k]){ k = base + "-" + n; n++; }
    return k;
  }
  function blankDays(){
    var d = {};
    for(var i=0;i<7;i++) d[i] = emptyDay();

  function editingPlan(){ return draft && draft.id === editingPlanId ? draft : null; }
  function editingDayData(){
    var p = editingPlan();
    if(!p) return null;
    p.data.days[editingDay] = normaliseDay(p.data.days[editingDay]);
    return p.data.days[editingDay];
  }
  function dayHasContent(day){
    day = normaliseDay(day);
    return day.exercises.length > 0 || day.cardio.length > 0;
  }
  function planSummary(p){
    var trainingDays = 0, exCount = 0;
    DAY_ORDER.forEach(function(d){
      var day = normaliseDay(p.data.days[d]);
      if(dayHasContent(day)) trainingDays++;
      exCount += day.exercises.length;
    });
    return trainingDays + (trainingDays === 1 ? " training day" : " training days") + " · " + exCount + (exCount === 1 ? " exercise" : " exercises");
  }

  /* Edits only touch the draft. Nothing is stored until you press Save. */
  function schedulePlanSave(){ setDirty(true); }

    if(bar) bar.classList.toggle("show", v);

  function startEditing(plan, isNew){
    draft = clone(plan);
    draftIsNew = !!isNew;
    editingPlanId = draft.id;
    dirty = !!isNew;
  }
  /* New exercises take their history key from their name until the plan is saved.
     After that the key is fixed, so renaming later keeps your progress history. */
  function lockKeys(plan){
    DAY_ORDER.forEach(function(d){
      var day = normaliseDay(plan.data.days[d]);
      plan.data.days[d] = day;
      day.exercises.concat(day.cardio).forEach(function(x){ delete x.autoKey; delete x.custom; });
    });
  }
  async function saveDraft(){
    if(!draft) return;
    lockKeys(draft);
    var saved = clone(draft);
    var i = plans.findIndex(function(x){ return x.id === saved.id; });
    if(i === -1) plans.push(saved); else plans[i] = saved;
    draftIsNew = false;
    setDirty(false);
    showToast("Plan saved");
    await store.savePlan(saved);
    if(!planById(activePlanId)){
      /* First plan you make becomes the active one. */
      activePlanId = saved.id;
      await store.setActivePlan(saved.id);
      if(activeTab === "plans") renderPlans();
    }
  }
  function discardDraft(){

  /* Ask before throwing away edits. Resolves to "save", "discard" or "cancel". */
  function confirmLeave(){
    if(!dirty || !draft) return Promise.resolve("discard");
    return new Promise(function(resolve){
      var sheet = document.getElementById("leave-sheet");
      document.getElementById("leave-sheet-title").textContent =
        draftIsNew ? "Save this new plan?" : 'Save changes to "' + (draft.name || "Untitled plan") + '"?';
      sheet.classList.add("show");
      function done(choice){
        sheet.classList.remove("show");
        sheet.removeEventListener("click", onClick);
        resolve(choice);
      }
      function onClick(e){
        var b = e.target.closest("[data-leave]");
        if(b) done(b.dataset.leave);
        else if(e.target === sheet) done("cancel");
      }
      sheet.addEventListener("click", onClick);
    });
  }

  var restBar = document.getElementById("rest-bar");
