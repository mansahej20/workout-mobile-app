  /* The timer tracks the moment rest ends rather than counting ticks.
     Phones pause web pages in the background, so counting ticks loses time;
     working from the end time means it's always right when you come back. */
  var restInterval = null;
  var restState = { active:false, total:0, endAt:0, pausedRemaining:0, name:"", finished:false, paused:false };
  var restScreenMinimized = false;
  var TIMER_KEY_SUFFIX = "timer";

  function fmtTime(sec){
    var m = Math.floor(sec/60), s = sec%60;
    return m + ":" + pad(s);
  }
  function restRemaining(){
    if(!restState.active) return 0;
    if(restState.finished) return 0;
    if(restState.paused) return Math.max(0, restState.pausedRemaining);
    return Math.max(0, Math.ceil((restState.endAt - Date.now()) / 1000));
  }
  function persistTimer(){
    try{
      if(restState.active) localStorage.setItem(cacheNs + TIMER_KEY_SUFFIX, JSON.stringify({ s: restState, m: restScreenMinimized }));
      else localStorage.removeItem(cacheNs + TIMER_KEY_SUFFIX);
    }catch(e){}
  }
  function restoreTimer(){
    try{
      var raw = localStorage.getItem(cacheNs + TIMER_KEY_SUFFIX);
      if(!raw) return;
      var saved = JSON.parse(raw);
      if(!saved || !saved.s || !saved.s.active) return;
      restState = saved.s;
      restScreenMinimized = !!saved.m;
      runTicker();
      tick(true);
    }catch(e){}
  }

  /* ---------- Alarm sound ----------
     A plain <audio> element (no Web Audio): on iPhone, a page using Web Audio is
     forced into a session that the silent switch mutes. The audio session type
     decides the trade-off:
       "loud" -> playback: plays even on silent, but pauses other music briefly
       "mix"  -> transient: plays over music, but the silent switch mutes it
     The element is unlocked with a silent play when you tick a set, because iOS
     only allows sound that follows a tap. */
  var ALARM_MODES = ["loud", "mix", "off"];
  function alarmMode(){
    var m = readJSON(cacheNs + "alarm", "loud");
    return ALARM_MODES.indexOf(m) === -1 ? "loud" : m;
  }
  function setAlarmMode(m){ writeJSON(cacheNs + "alarm", m); }

  /* "transient-solo" is the session made for short interruptions such as
     driving directions: other audio pauses while it plays, then resumes.
     ("playback" is for music apps: it stopped your music for good and
     left a player on the lock screen.) */
  function applyAudioSession(){
    try{
      if(navigator.audioSession) navigator.audioSession.type = alarmMode() === "mix" ? "transient" : "transient-solo";
    }catch(e){}
  }
  function resetAudioSession(){
    try{ if(navigator.audioSession) navigator.audioSession.type = "auto"; }catch(e){}
  }

  function makeAlarmUrl(){
    var rate = 22050;
    var parts = [];
    function tone(freq, secs){ parts.push({ f:freq, n: Math.round(secs*rate) }); }
    function gap(secs){ parts.push({ f:0, n: Math.round(secs*rate) }); }
    for(var r=0;r<3;r++){ tone(1318.5, 0.14); gap(0.06); tone(1760, 0.2); gap(r < 2 ? 0.32 : 0.05); }
    var total = parts.reduce(function(t,p){ return t + p.n; }, 0);
    var buf = new ArrayBuffer(44 + total*2);
    var v = new DataView(buf);
    function str(o, t){ for(var i=0;i<t.length;i++) v.setUint8(o+i, t.charCodeAt(i)); }
    str(0,"RIFF"); v.setUint32(4, 36 + total*2, true); str(8,"WAVE");
    str(12,"fmt "); v.setUint32(16,16,true); v.setUint16(20,1,true); v.setUint16(22,1,true);
    v.setUint32(24,rate,true); v.setUint32(28,rate*2,true); v.setUint16(32,2,true); v.setUint16(34,16,true);
    str(36,"data"); v.setUint32(40, total*2, true);
    var off = 44, fade = Math.round(0.008*rate);
    parts.forEach(function(p){
      for(var i=0;i<p.n;i++){
        var x = 0;
        if(p.f){
          var t = i / rate, w = 2*Math.PI*p.f*t;
          var env = Math.min(1, i/fade, (p.n - i)/fade);
          /* a little third harmonic makes it cut through gym noise */
          x = (Math.sin(w) + 0.3*Math.sin(3*w)) / 1.3 * 0.95 * env;
        }
        v.setInt16(off, Math.max(-1, Math.min(1, x)) * 32767, true);
        off += 2;
      }
    });
    return URL.createObjectURL(new Blob([buf], { type:"audio/wav" }));
  }

  var alarmEl = null, alarmUnlocked = false, alarmUrl = null;
  function getAlarm(){
    if(!alarmEl){
      alarmEl = new Audio();
      alarmEl.preload = "auto";
      alarmEl.setAttribute("playsinline", "");
      alarmEl.addEventListener("ended", releaseAlarm);
    }
    return alarmEl;
  }
  function loadAlarm(a){
    if(!alarmUrl) alarmUrl = makeAlarmUrl();
    if(a.getAttribute("src") !== alarmUrl) a.src = alarmUrl;
  }

  /* Unload the sound once it's finished. A loaded audio element is what kept
     the "Set Log" player on the lock screen; with no source there's nothing to show.
     The element stays unlocked, so it can still ring next time. */
  function releaseAlarm(){
    if(alarmEl){
      try{
        alarmEl.pause();
        alarmEl.removeAttribute("src");
        alarmEl.load();
      }catch(e){}
    }
    if("mediaSession" in navigator){
      try{ navigator.mediaSession.metadata = null; navigator.mediaSession.playbackState = "none"; }catch(e){}
    }
    resetAudioSession();
  }

  /* Call from a tap. Plays the alarm silently once so it can sound later. */
  function unlockAudio(){
    if(alarmUnlocked || alarmMode() === "off") return;
    var a = getAlarm();
    loadAlarm(a);
    a.muted = true;
    try{
      var p = a.play();
      var done = function(){ alarmUnlocked = true; a.muted = false; releaseAlarm(); };
      if(p && p.then) p.then(done).catch(function(){ a.muted = false; releaseAlarm(); });
      else done();
    }catch(e){ a.muted = false; }
  }

  function playAlarm(force){
    if(!force && alarmMode() === "off") return;
    applyAudioSession();
    var a = getAlarm();
    try{
      a.pause();
      loadAlarm(a);
      a.currentTime = 0;
      a.muted = false;
      var p = a.play();
      if(p && p.catch) p.catch(releaseAlarm);
    }catch(e){ releaseAlarm(); }
  }

  function startRest(seconds, name){
    if(!seconds || seconds <= 0) return;
    unlockAudio();
    restState = { active:true, total:seconds, endAt: Date.now() + seconds*1000, pausedRemaining:0, name:name, finished:false, paused:false };
    restScreenMinimized = false;
    persistTimer();
    runTicker();
    renderRest();
  }

  function runTicker(){
    clearInterval(restInterval);
    restInterval = setInterval(function(){ tick(false); }, 250);
  }

  var lastShownSecond = -1;
  function tick(force){
    if(!restState.active){ clearInterval(restInterval); return; }
    var r = restRemaining();
    if(!restState.finished && !restState.paused && r <= 0){
      onRestComplete();
      return;
    }
    if(force || r !== lastShownSecond){
      lastShownSecond = r;
      renderRest();
    }
  }

  var PAUSE_ICON = '<svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><rect x="3" y="2" width="3.5" height="12" rx="1" fill="currentColor"/><rect x="9.5" y="2" width="3.5" height="12" rx="1" fill="currentColor"/></svg>';
  var PLAY_ICON = '<svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M4 2.5v11a1 1 0 0 0 1.5.86l9-5.5a1 1 0 0 0 0-1.72l-9-5.5A1 1 0 0 0 4 2.5z" fill="currentColor"/></svg>';

  function togglePause(){
    if(!restState.active || restState.finished) return;
    unlockAudio();
    if(restState.paused){
      restState.endAt = Date.now() + restState.pausedRemaining*1000;
      restState.paused = false;
    } else {
      restState.pausedRemaining = restRemaining();
      restState.paused = true;
    }
    persistTimer();
    renderRest();
  }

  function adjustRest(deltaSec){
    if(!restState.active || restState.finished) return;
    unlockAudio();
    if(restState.paused){
      restState.pausedRemaining = Math.max(0, restState.pausedRemaining + deltaSec);
    } else {
      restState.endAt = Math.max(Date.now(), restState.endAt + deltaSec*1000);
    }
    restState.total = Math.max(restState.total, restRemaining());
    persistTimer();
    if(restRemaining() <= 0){ restState.paused = false; onRestComplete(); return; }
    renderRest();
  }

  function renderPauseButtons(){
    var paused = !!restState.paused;
    [document.getElementById("rs-pause"), document.getElementById("rest-pause")].forEach(function(btn){
      if(!btn) return;
      btn.innerHTML = paused ? PLAY_ICON : PAUSE_ICON;
      btn.setAttribute("aria-label", paused ? "Resume timer" : "Pause timer");
    });
    restScreen.classList.toggle("paused", paused);
    restBar.classList.toggle("paused", paused);
  }

  function onRestComplete(){
    restState.finished = true;
    restState.paused = false;
    restScreenMinimized = false;
    persistTimer();
    renderRest();
    /* Only alert when you can actually see or hear it; if the rest finished
       while you were away, this runs as soon as you come back. */
    if(document.visibilityState === "visible") alertRestDone();
    else pendingAlert = true;
  }
  var pendingAlert = false;
  function alertRestDone(){
    pendingAlert = false;
    if(navigator.vibrate){ try{ navigator.vibrate([200,100,200]); }catch(e){} }
    beep();
  }

  function beep(){ playAlarm(false); }

  function stopRest(){
    releaseAlarm();
    clearInterval(restInterval);
    restState.active = false;
    restScreenMinimized = false;
    pendingAlert = false;
    persistTimer();
    renderRest();
  }

  function renderRest(){
    renderRestBar();
    renderRestScreen();
    document.body.classList.toggle("timer-on", restState.active && restScreenMinimized);
  }

  function renderRestBar(){
    if(!restState.active){
      restBar.classList.remove("show");
      return;
    }
    placeRestBar();
    restBar.classList.add("show");
    renderPauseButtons();
    var r = restRemaining();
    var miniPause = document.getElementById("rest-pause");
    if(miniPause) miniPause.style.display = restState.finished ? "none" : "flex";
    restTimeEl.textContent = restState.finished ? "Done" : fmtTime(r);
    restNameEl.textContent = restState.name;
    var pct = restState.total ? Math.round((1 - r/restState.total) * 100) : 0;
    restRing.style.setProperty("--pct", restState.finished ? 100 : pct);
  }

  function renderRestScreen(){
    if(!restState.active || restScreenMinimized){
      restScreen.classList.remove("show");
      return;
    }
    restScreen.classList.add("show");
    rsExercise.textContent = restState.name;
    var r = restRemaining();
    var pct = restState.total ? Math.round((1 - r/restState.total) * 100) : 0;
    rsRingWrap.style.setProperty("--pct", restState.finished ? 100 : pct);
    if(restState.finished){
      rsLabel.textContent = "Rest complete";
      if(!rsRingWrap.querySelector(".rs-done-check")) rsRingWrap.innerHTML = '<span class="rs-done-check">&#10003;</span>';
      rsAdjust.style.display = "none";
      rsSkipFull.textContent = "Continue";
      rsSkipFull.classList.add("primary");
    } else {
      rsLabel.textContent = restState.paused ? "Paused" : "Rest";
      var big = document.getElementById("rs-time-big");
      if(!big){
        rsRingWrap.innerHTML = '<span class="rs-time" id="rs-time-big"></span>';
        big = document.getElementById("rs-time-big");
      }
      big.textContent = fmtTime(r);
      rsAdjust.style.display = "flex";
      rsSkipFull.textContent = "Skip rest";
      rsSkipFull.classList.remove("primary");
    }
  }

  /* Keep the minimised bar above the Today / Progress / Plans tabs. */
  function placeRestBar(){
    var nav = document.querySelector("nav.tabs");
    if(nav) restBar.style.bottom = nav.getBoundingClientRect().height + "px";
  }
  window.addEventListener("resize", placeRestBar);

  /* Catch up the moment you return to the app. */
  function onReturn(){
    if(!restState.active) return;
    tick(true);
    if(pendingAlert && document.visibilityState === "visible") alertRestDone();
  }
  document.addEventListener("visibilitychange", onReturn);
  window.addEventListener("pageshow", onReturn);
  window.addEventListener("focus", onReturn);

  document.getElementById("rest-plus").addEventListener("click", function(){ adjustRest(15); });
  document.getElementById("rest-minus").addEventListener("click", function(){ adjustRest(-15); });
  document.getElementById("rest-skip").addEventListener("click", stopRest);
  document.getElementById("rs-plus").addEventListener("click", function(){ adjustRest(15); });
  document.getElementById("rs-minus").addEventListener("click", function(){ adjustRest(-15); });
  rsSkipFull.addEventListener("click", stopRest);
  document.getElementById("rs-pause").addEventListener("click", togglePause);
  document.getElementById("rest-pause").addEventListener("click", togglePause);
  document.getElementById("rs-close").addEventListener("click", stopRest);
  document.getElementById("rs-minimize").addEventListener("click", function(){
    restScreenMinimized = true;
    persistTimer();
    renderRest();
  });
  restBar.addEventListener("click", function(e){
    if(e.target.closest("button")) return;
    if(!restState.active) return;
    restScreenMinimized = false;
    persistTimer();
    renderRest();
  });

  /* ---------------- Boot ---------------- */
  async function boot(){
    try{
      store = await initStore();
    }catch(e){
      content.innerHTML = '<div class="rest-day"><div class="big">Setup needed</div>Supabase URL and anon key are missing. Check the environment variables in Vercel.</div>';
      return;
    }
    updateSyncDot();
    updateHeaderAvatar();
    restoreTimer();
    var loaded = await store.loadPlans();
    plans = loaded.plans;
    var settings = await store.getSettings();
    activePlanId = settings.activePlanId;
    if(plans.length && !planById(activePlanId)){
      activePlanId = plans[0].id;
      await store.setActivePlan(activePlanId);
    }
    await loadDate(todayStr());
  }
  boot();

  if("serviceWorker" in navigator){
    window.addEventListener("load", function(){
      navigator.serviceWorker.register("/sw.js").catch(function(){});
    });
  }
})();
</script>
</body>
</html>
