<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
<meta name="theme-color" content="#121212" />
<meta name="color-scheme" content="dark" />
<title>Repped</title>
<link rel="manifest" href="/manifest.webmanifest" />
<link rel="icon" href="/icons/favicon-32.png" type="image/png" sizes="32x32" />
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Repped" />
<style>
  :root{
    --bg:#121212;
    --surface:#181818;
    --surface-2:#1f1f1f;
    --card:#181818;
    --border:#2a2a2a;
    --text:#ffffff;
    --text-dim:#b3b3b3;
    --text-faint:#7c7c7c;
    --accent:#1ed760;
    --accent-dim:#169c46;
    --negative:#f3727f;
    --warning:#ffa42b;
    --info:#539df5;
    --ease-out: cubic-bezier(0.23,1,0.32,1);
    --ease-in-out: cubic-bezier(0.77,0,0.175,1);
    --radius-s:4px;
    --radius-m:8px;
    --radius-l:16px;
    --shadow-med: rgba(0,0,0,0.3) 0px 8px 8px;
    --shadow-heavy: rgba(0,0,0,0.5) 0px 8px 24px;
  }

  *{box-sizing:border-box;}
  html{
    -webkit-tap-highlight-color: transparent;
    -webkit-text-size-adjust: 100%;
    overscroll-behavior: none;
    height:100%;
  }
  body{
    margin:0;
    height:100%;
    background:var(--bg);
    color:var(--text);
    font-family:-apple-system, BlinkMacSystemFont, "Helvetica Neue", Helvetica, Arial, sans-serif;
    -webkit-font-smoothing:antialiased;
    overscroll-behavior:none;
  }
  input, textarea, select{ font-size:16px; font-family:inherit; }
  button, a, [role="button"]{
    touch-action: manipulation;
    user-select:none;
    -webkit-user-select:none;
    -webkit-touch-callout:none;
  }

  #app{
    display:flex;
    flex-direction:column;
    height:var(--app-h, 100dvh);
    max-width:520px;
    margin:0 auto;
    position:relative;
  }

  /* ---------- Header ---------- */
  header{
    flex:0 0 auto;
    padding:calc(10px + env(safe-area-inset-top,0px)) 12px 10px;
    background:var(--bg);
    border-bottom:1px solid var(--border);
  }
  .header-top{
    display:flex;
    align-items:flex-start;
    justify-content:space-between;
    gap:10px;
    margin-bottom:10px;
  }
  .today-btn{
    flex:0 0 auto;
    background:var(--surface-2);
    color:var(--text);
    border:none;
    border-radius:9999px;
    padding:0 16px;
    height:36px;
    min-width:64px;
    align-self:center;
    font-size:11px;
    font-weight:700;
    letter-spacing:1.4px;
    text-transform:uppercase;
    transition:transform 140ms var(--ease-out), background 140ms var(--ease-out);
    white-space:nowrap;
  }
  .today-btn:active{ transform:scale(0.94); background:var(--border); }
  @media (hover:hover) and (pointer:fine){
    .today-btn:hover{ background:var(--border); }
  }
  .date-row{
    display:flex;
    align-items:center;
    gap:8px;
  }
  .icon-btn{
    background:var(--surface-2);
    border:none;
    color:var(--text);
    width:40px;
    height:40px;
    flex:0 0 40px;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:18px;
    font-weight:700;
    padding:0;
    transition:transform 140ms var(--ease-out), background 140ms var(--ease-out);
  }
  .icon-btn:active{ transform:scale(0.88); background:var(--border); }
  @media (hover:hover) and (pointer:fine){
    .icon-btn:hover{ background:var(--border); }
  }
  .date-input-wrap{
    flex:1 1 0;
    min-width:0;
    position:relative;
    height:40px;
    border-radius:9999px;
    background:var(--surface-2);
    overflow:hidden;
  }
  .date-input-wrap .date-display{
    position:absolute;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:14px;
    font-weight:700;
    color:var(--text);
    pointer-events:none;
    white-space:nowrap;
  }
  /* The real date input sits invisibly on top so tapping opens the native picker,
     while iOS can't stretch or restyle what's shown. */
  .date-input-wrap input[type=date]{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    min-width:0;
    margin:0;
    padding:0;
    border:none;
    opacity:0;
    -webkit-appearance:none;
    appearance:none;
    font-size:16px;
    cursor:pointer;
  }
  .date-input-wrap:active{ background:var(--border); }

  /* ---------- Content ---------- */
  #content{
    flex:1 1 auto;
    overflow-y:auto;
    overscroll-behavior:contain;
    padding:16px 16px 24px;
    -webkit-overflow-scrolling:touch;
  }

  .rest-day{
    text-align:center;
    padding:60px 20px;
    color:var(--text-dim);
  }
  .custom-empty{ text-align:center; padding:28px 20px 18px; color:var(--text-dim); }
  .custom-empty .big{ font-size:22px; font-weight:700; color:var(--text); margin-bottom:6px; }
  .new-workout{ margin-top:6px; padding-top:12px; border-top:1px solid var(--border); }
  .new-workout-row{ display:flex; gap:8px; margin-top:6px; }
  .new-workout-row .text-input{ flex:1; min-width:0; }
  .new-workout-row .pill-btn{ flex:0 0 auto; }
  .rest-day .big{
    font-size:22px;
    font-weight:700;
    color:var(--text);
    margin-bottom:8px;
  }

  .card{
    background:var(--card);
    border-radius:var(--radius-m);
    padding:14px 14px 10px;
    margin-bottom:12px;
    box-shadow:var(--shadow-med);
  }
  .card-head{
    display:flex;
    flex-wrap:wrap;
    justify-content:space-between;
    align-items:baseline;
    margin-bottom:10px;
    gap:4px 8px;
  }
  .card-head .name{
    font-size:16px;
    font-weight:700;
    line-height:1.3;
    flex:1 1 auto;
    min-width:0;
  }
  .card-head .meta{
    font-size:12px;
    color:var(--text-dim);
    white-space:nowrap;
    font-weight:400;
    flex:0 0 auto;
  }
  .card.optional{ border:1px solid var(--border); }

  /* ---------- Collapsible exercise cards ---------- */
  .ex-card{ padding:0; }
  .ex-card .card-head{
    display:flex;
    align-items:center;
    gap:10px;
    margin:0;
    padding:14px;
    cursor:pointer;
    border-radius:var(--radius-m);
    user-select:none;
    -webkit-user-select:none;
    touch-action:manipulation;
    transition:background 140ms var(--ease-out);
  }
  .ex-card .card-head:active{ background:var(--surface-2); }
  .ex-card .card-head:focus-visible{ outline:2px solid var(--accent); outline-offset:-2px; }
  .ex-card .head-text{ flex:1; min-width:0; }
  .ex-card .head-text .name{ display:block; }
  .ex-card .head-text .meta{ display:block; margin-top:2px; white-space:normal; }
  .progress-chip{
    flex:0 0 auto;
    font-size:12px;
    font-weight:700;
    color:var(--text-dim);
    background:var(--surface-2);
    border-radius:9999px;
    padding:4px 10px;
    font-variant-numeric:tabular-nums;
  }
  .progress-chip.complete{ background:var(--accent); color:#050f08; }
  .chevron{
    flex:0 0 auto;
    width:28px; height:28px;
    display:flex; align-items:center; justify-content:center;
    color:var(--text-dim);
    font-size:14px;
    transition:transform 220ms var(--ease-out);
  }
  .ex-card.collapsed .chevron{ transform:rotate(-90deg); }
  .ex-body-wrap{
    display:grid;
    grid-template-rows:1fr;
    transition:grid-template-rows 220ms var(--ease-out);
  }
  .ex-card.collapsed .ex-body-wrap{ grid-template-rows:0fr; }
  .ex-body{
    overflow:hidden;
    min-height:0;
  }
  .ex-body-inner{
    padding:0 14px 10px;
    transition:opacity 180ms var(--ease-out);
  }
  .ex-card.collapsed .ex-body-inner{ opacity:0; }
  .collapse-controls{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin:0 0 8px;
  }
  .collapse-controls .section-label{ margin:0; }
  .text-btn{
    background:none;
    border:none;
    color:var(--text-dim);
    font-size:11px;
    font-weight:700;
    letter-spacing:1.2px;
    text-transform:uppercase;
    height:36px;
    padding:0 4px;
    transition:color 140ms var(--ease-out), transform 140ms var(--ease-out);
  }
  .text-btn:active{ transform:scale(0.95); color:var(--text); }
  @media (prefers-reduced-motion: reduce){
    .ex-body-wrap, .chevron, .ex-body-inner{ transition:none; }
  }
  .optional-tag{
    display:inline-block;
    font-size:10px;
    font-weight:600;
    text-transform:capitalize;
    color:var(--warning);
    background:rgba(255,164,43,0.12);
    padding:2px 8px;
    border-radius:9999px;
    margin-left:6px;
  }

  .set-row{
    display:grid;
    grid-template-columns:20px 1fr 1fr 44px;
    gap:6px;
    align-items:center;
    padding:5px 0;
  }
  .set-row .idx{
    font-size:13px;
    color:var(--text-faint);
    font-weight:700;
  }
  .set-row input{
    background:var(--surface-2);
    border:none;
    color:var(--text);
    border-radius:var(--radius-s);
    padding:11px 6px;
    width:100%;
    min-width:0;
    text-align:center;
    box-shadow: rgb(18,18,18) 0px 1px 0px, rgb(60,60,60) 0px 0px 0px 1px inset;
    transition:box-shadow 140ms var(--ease-out);
  }
  .set-row input:focus{
    outline:none;
    box-shadow: rgb(18,18,18) 0px 1px 0px, rgb(124,124,124) 0px 0px 0px 1px inset;
  }
  .set-row input::placeholder{ color:var(--text-faint); }
  /* Completed sets stay editable; they're just tinted so you can see they're done. */
  .set-row.done input{
    color:var(--text-dim);
    background:rgba(30,215,96,0.06);
    box-shadow: rgb(18,18,18) 0px 1px 0px, rgba(30,215,96,0.35) 0px 0px 0px 1px inset;
  }
  .set-row.done input:focus{
    color:var(--text);
    box-shadow: rgb(18,18,18) 0px 1px 0px, rgb(124,124,124) 0px 0px 0px 1px inset;
  }
  .check-btn{
    width:40px;
    height:40px;
    border-radius:50%;
    border:1.5px solid var(--text-faint);
    background:transparent;
    color:transparent;
    font-size:17px;
    font-weight:700;
    transition:transform 140ms var(--ease-out), background 140ms var(--ease-out), border-color 140ms var(--ease-out), color 140ms var(--ease-out);
    justify-self:center;
  }
  .check-btn:active{ transform:scale(0.88); }
  .check-btn.on{
    background:var(--accent);
    border-color:var(--accent);
    color:#050f08;
  }

  .field-labels{
    display:grid;
    grid-template-columns:20px 1fr 1fr 44px;
    gap:6px;
    margin-bottom:2px;
  }
  .field-labels span{
    font-size:10px;
    color:var(--text-faint);
    text-transform:uppercase;
    letter-spacing:1px;
    text-align:center;
    font-weight:600;
  }
  .field-labels span:first-child{ text-align:left; }
  .field-labels span:last-child{ visibility:hidden; }

  .cardio-main{
    display:flex;
    align-items:center;
    gap:10px;
    flex-wrap:wrap;
  }
  .cardio-card .cinfo{ flex:1 1 140px; min-width:0; }
  .cardio-card .cname{ font-size:16px; font-weight:700; }
  .cardio-card .ctarget{ font-size:12px; color:var(--text-dim); margin-top:2px; }
  .cardio-card input{
    background:var(--surface-2);
    border:none;
    color:var(--text);
    border-radius:var(--radius-s);
    padding:11px 8px;
    height:44px;
    width:72px;
    flex:0 0 auto;
    text-align:center;
    box-shadow: rgb(18,18,18) 0px 1px 0px, rgb(60,60,60) 0px 0px 0px 1px inset;
  }
  .cardio-card input:focus{ outline:none; box-shadow: rgb(18,18,18) 0px 1px 0px, rgb(124,124,124) 0px 0px 0px 1px inset; }
  .done-pill{
    background:var(--surface-2);
    border:none;
    color:var(--text-dim);
    border-radius:9999px;
    padding:0 18px;
    height:44px;
    font-size:11px;
    font-weight:700;
    letter-spacing:1.2px;
    text-transform:uppercase;
    transition:transform 140ms var(--ease-out), background 140ms var(--ease-out), color 140ms var(--ease-out);
    white-space:nowrap;
    flex:0 0 auto;
  }
  .done-pill:active{ transform:scale(0.95); }
  .done-pill.on{ background:var(--accent); color:#050f08; }

  .section-label{
    font-size:12px;
    font-weight:700;
    text-transform:uppercase;
    letter-spacing:1.4px;
    color:var(--text-dim);
    margin:18px 0 8px;
  }
  .section-label:first-child{ margin-top:0; }

  /* ---------- Progress tab ---------- */
  .bp-chips{ display:flex; flex-wrap:wrap; gap:8px; margin:4px 0 8px; }
  .bp-chip{
    min-height:40px; padding:0 16px; border:0; border-radius:999px;
    background:var(--surface-3, #2a2a2a); color:var(--text); font:inherit; font-size:14px; font-weight:600;
    transition:transform 120ms var(--ease-out), background 150ms;
  }
  .bp-chip[aria-pressed="true"]{ background:var(--accent); color:#0b1a10; }
  .progress-tools{ display:flex; align-items:center; justify-content:space-between; gap:12px; margin:-4px 0 12px; }
  .progress-tools .merge-btn{ margin:0 0 0 auto; }
  .bp-change{ font-size:12px; color:var(--text-dim); padding-left:4px; }
  .bp-now{ color:var(--accent); }
  .bp-chip:active{ transform:scale(0.95); background:var(--accent); color:#0b1a10; }
  .bp-card{ margin-bottom:12px; box-shadow:inset 0 0 0 1px rgba(30,215,96,0.35); }
  .bp-card-title{ font-size:15px; font-weight:700; }
  .bp-card-sub{ font-size:13px; color:var(--text-dim); margin:2px 0 10px; }
  .hconv{ font-size:12px; font-weight:600; color:var(--text-faint); margin-right:8px; }
  .select-wrap{ margin-bottom:16px; }
  select#exercise-select{
    width:100%;
    background:var(--surface-2);
    color:var(--text);
    border:none;
    border-radius:9999px;
    padding:12px 16px;
    font-size:14px;
    font-weight:700;
    box-shadow: rgb(18,18,18) 0px 1px 0px, rgb(60,60,60) 0px 0px 0px 1px inset;
    appearance:none;
    -webkit-appearance:none;
  }
  .chart-card{
    background:var(--card);
    border-radius:var(--radius-m);
    padding:16px;
    margin-bottom:16px;
    box-shadow:var(--shadow-med);
  }
  .chart-card .chart-empty{
    text-align:center;
    color:var(--text-faint);
    font-size:13px;
    padding:30px 0;
  }
  .history-row{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:10px 0;
    border-bottom:1px solid var(--border);
    font-size:13px;
  }
  .history-row:last-child{ border-bottom:none; }
  .history-row .hdate{ color:var(--text-dim); }
  .history-row .hval{ font-weight:700; }

  /* ---------- Tab bar ---------- */
  nav.tabs{
    flex:0 0 auto;
    display:flex;
    background:var(--bg);
    border-top:1px solid var(--border);
    padding:6px 12px calc(6px + env(safe-area-inset-bottom,0px));
  }
  nav.tabs button{
    flex:1;
    background:none;
    border:none;
    color:var(--text-faint);
    font-size:11px;
    font-weight:700;
    letter-spacing:1.2px;
    text-transform:uppercase;
    min-height:44px;
    padding:8px 0;
    border-radius:var(--radius-s);
    transition:color 140ms var(--ease-out), transform 140ms var(--ease-out);
  }
  nav.tabs button:active{ transform:scale(0.95); }
  nav.tabs button.active{ color:var(--accent); }

  /* ---------- Rest bar ---------- */
  #rest-bar{
    position:fixed;
    left:0; right:0; bottom:57px;
    border-radius:var(--radius-l) var(--radius-l) 0 0;
    max-width:520px;
    margin:0 auto;
    background:var(--surface-2);
    box-shadow:var(--shadow-heavy);
    transform:translateY(100%);
    transition:transform 260ms var(--ease-out);
    z-index:20;
    opacity:0;
    pointer-events:none;
  }
  #rest-bar.show{ transform:translateY(0); opacity:1; pointer-events:auto; }
  body.timer-on #content{ padding-bottom:96px; }
  nav.tabs{ position:relative; z-index:25; }
  .rest-inner{
    display:flex;
    align-items:center;
    gap:10px;
    padding:12px 12px;
    cursor:pointer;
  }
  .rest-ring{
    width:52px; height:52px;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:14px;
    font-weight:700;
    background:conic-gradient(var(--accent) calc(var(--pct,0)*1%), var(--border) 0);
    flex:0 0 auto;
    position:relative;
  }
  .rest-ring::after{
    content:"";
    position:absolute;
    inset:4px;
    border-radius:50%;
    background:var(--surface-2);
  }
  .rest-ring span{ position:relative; z-index:1; }
  .rest-info{ flex:1; min-width:0; }
  .rest-info .rname{ font-size:13px; color:var(--text-dim); font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .rest-info .rlabel{ font-size:11px; color:var(--text-faint); text-transform:uppercase; letter-spacing:1px; margin-top:1px; }
  .rest-actions{ display:flex; gap:6px; align-items:center; }
  .rest-actions button{
    background:var(--surface);
    border:none;
    color:var(--text);
    border-radius:9999px;
    width:40px; height:40px;
    font-size:13px;
    font-weight:700;
    transition:transform 140ms var(--ease-out);
  }
  .rest-actions button:active{ transform:scale(0.88); }
  .rest-actions .skip{
    width:auto;
    height:40px;
    padding:0 14px;
    font-size:10px;
    letter-spacing:1px;
    text-transform:uppercase;
    color:var(--text-dim);
  }

  .tab-panel{
    animation: panelIn 220ms var(--ease-out);
  }
  @keyframes panelIn{
    from{ opacity:0; transform:translateY(6px) scale(0.99); }
    to{ opacity:1; transform:translateY(0) scale(1); }
  }

  /* ---------- Full-screen rest overlay ---------- */
  #rest-screen{
    position:fixed;
    inset:0;
    max-width:520px;
    margin:0 auto;
    background:var(--bg);
    z-index:30;
    display:flex;
    flex-direction:column;
    transform:translateY(100%);
    transition:transform 320ms cubic-bezier(0.32,0.72,0,1);
  }
  #rest-screen.show{ transform:translateY(0); }
  .rs-top{
    flex:0 0 auto;
    display:flex;
    justify-content:flex-end;
    gap:10px;
    padding:calc(14px + env(safe-area-inset-top,0px)) 16px 4px;
  }
  .rs-minimize{
    width:40px; height:40px;
    border-radius:50%;
    border:none;
    background:var(--surface-2);
    color:var(--text-dim);
    font-size:18px;
    font-weight:700;
    transition:transform 140ms var(--ease-out), background 140ms var(--ease-out);
  }
  .rs-minimize:active{ transform:scale(0.88); background:var(--border); }
  .rs-minimize{ display:flex; align-items:center; justify-content:center; }
  .rs-minimize svg{ width:18px; height:18px; }
  .rs-body{
    flex:1 1 auto;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    padding:0 24px calc(24px + env(safe-area-inset-bottom,0px));
    text-align:center;
  }
  .rs-label{
    font-size:12px;
    font-weight:700;
    text-transform:uppercase;
    letter-spacing:2px;
    color:var(--accent);
    margin-bottom:6px;
  }
  .rs-exercise{
    font-size:18px;
    font-weight:700;
    color:var(--text-dim);
    margin-bottom:32px;
  }
  .rs-ring-wrap{
    width:min(66vw, 260px);
    height:min(66vw, 260px);
    border-radius:50%;
    background:conic-gradient(var(--accent) calc(var(--pct,0)*1%), var(--surface-2) 0);
    display:flex;
    align-items:center;
    justify-content:center;
    position:relative;
    margin-bottom:36px;
    transition:background 900ms linear;
  }
  .rs-ring-wrap::after{
    content:"";
    position:absolute;
    inset:10px;
    border-radius:50%;
    background:var(--bg);
  }
  .rs-time{
    position:relative;
    z-index:1;
    font-size:52px;
    font-weight:700;
    font-variant-numeric:tabular-nums;
    letter-spacing:-1px;
  }
  .rs-done-check{
    position:relative;
    z-index:1;
    color:var(--accent);
    font-size:64px;
    line-height:1;
  }
  .rs-adjust{
    display:flex;
    gap:14px;

/* Loading screen: the R appears, the plates slide onto the bar from both sides,
   the logo does one "rep", then the name fades in. It stays until the app has
   loaded, and at least until the animation ends. */
(function(){
  var splash = document.getElementById("splash");
  var reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  var END = reduce ? 300 : 1450;
  var animDone = false, appReady = false, hidden = false;
  setTimeout(function(){ animDone = true; maybeHide(); }, END);

  function maybeHide(){
    if(hidden || !animDone || !appReady) return;
    hidden = true;
    splash.classList.add("hide");
    setTimeout(function(){ if(splash.parentNode) splash.parentNode.removeChild(splash); }, 400);
  }

  window.__splash = { ready: function(){ appReady = true; maybeHide(); } };
  /* never block the app if something goes wrong */
  setTimeout(function(){ animDone = true; appReady = true; maybeHide(); }, 6000);

})();

<script>
(function(){

     shorter than the screen (by about the status bar's height), leaving an empty
     strip under the tab bar. When that happens, size the app to the real screen.
     A bigger difference means the keyboard is open, so it's left alone. */
  /* iPhone Home Screen apps can report the screen height wrongly in two ways:
     the page itself is laid out short, or "100dvh" comes out short by about the
     status bar's height. Either leaves an empty strip under the tab bar.
     Measure what 100dvh actually gives and, if it falls short of the real
     screen, size the app to the real screen instead. */
  function measureDvh(){
    var probe = document.createElement("div");
    probe.style.cssText = "position:fixed;top:0;left:0;width:0;height:100dvh;visibility:hidden;pointer-events:none;";
    document.documentElement.appendChild(probe);
    var h = probe.offsetHeight;
    probe.parentNode.removeChild(probe);
    return h;
  }
  /* Is something focused that brings up the keyboard? */
  function typing(){
    var a = document.activeElement;
    if(!a) return false;
    if(a.isContentEditable || a.tagName === "TEXTAREA") return true;
    return a.tagName === "INPUT" && !/^(button|checkbox|radio|range|file|submit|reset|color|image)$/i.test(a.type || "");
  }
  function fitToScreen(){
    var root = document.documentElement;
    var standalone = (window.matchMedia && window.matchMedia("(display-mode: standalone)").matches) || navigator.standalone === true;
    var portrait = window.innerHeight >= window.innerWidth;
    var full = portrait ? Math.max(screen.width, screen.height) : Math.min(screen.width, screen.height);
    var target = window.innerHeight;
    var gap = full - window.innerHeight;
    /* Page laid out short. A small gap is the status-bar bug. A big gap is either the
       keyboard (something is focused) or iOS forgetting to grow back after the keyboard
       closed (nothing focused) -- in that case fill the screen again. */
    if(standalone && gap > 0 && (gap <= 80 || !typing())) target = full;
    var dvh = measureDvh();
    if(target - dvh > 1){                                   /* 100dvh short of the real height */

    if(!saved) return base;

      var savedEx = saved.exercises && saved.exercises[k];
      if(savedEx && Array.isArray(savedEx.sets)){
        var anyWeight = savedEx.sets.some(function(x){ return x && x.weight !== "" && x.weight != null; });
        /* Logs from before units existed were always kg. */
        base.exercises[k].unit = savedEx.unit || (anyWeight ? "kg" : base.exercises[k].unit);
        if(savedEx.skipped) base.exercises[k].skipped = true;
        base.exercises[k].sets.forEach(function(s, i){
          var sv = savedEx.sets[i];
          if(sv){
            s.weight = sv.weight != null ? sv.weight : "";
            s.reps = sv.reps != null ? sv.reps : "";
            s.done = !!sv.done;
          }
        });
      }
    });
    if(saved.swaps) base.swaps = saved.swaps;
    if(Array.isArray(saved.extras) && saved.extras.length) base.extras = saved.extras;
    if(saved.cardioSwaps && Object.keys(saved.cardioSwaps).length) base.cardioSwaps = saved.cardioSwaps;
    if(Array.isArray(saved.cardioExtras) && saved.cardioExtras.length) base.cardioExtras = saved.cardioExtras;
    if(saved.dayFrom != null) base.dayFrom = saved.dayFrom;
    if(saved.customTitle) base.customTitle = saved.customTitle;
    if(Array.isArray(saved.order)){
      base.order = saved.order.filter(function(k){ return !!base.exercises[k]; });
    }
    Object.keys(base.cardio).forEach(function(k){
      var savedC = saved.cardio && saved.cardio[k];
      if(savedC){
        base.cardio[k].value = savedC.value != null ? savedC.value : "";
        base.cardio[k].done = !!savedC.done;
        if(savedC.skipped) base.cardio[k].skipped = true;
      }
    });
    return base;
  }

  var missedInfo = null, missedFor = null;

  function weekStart(dateStr){
    var d = new Date(dateStr + "T00:00:00");
    d.setDate(d.getDate() - ((d.getDay() + 6) % 7));
    return d.getFullYear() + "-" + pad(d.getMonth()+1) + "-" + pad(d.getDate());
  }
  async function findMissed(dateStr){
    if(dateStr !== todayStr() || !plans.length) return null;
    var mon = weekStart(dateStr);
    if(mon === dateStr) return null;
    var logs = await store.queryRecent(14);
    var byDate = {}, done = {};
    logs.forEach(function(l){
      if(!l || !l.date || l.date < mon || l.date > dateStr) return;
      byDate[l.date] = l;
      if(logHasActivity(l)) done[l.dayFrom != null ? l.dayFrom : dowFromDateStr(l.date)] = true;
    });
    var dismissed = missedDismissed();
    var days = activeDays();
    var d = new Date(dateStr + "T00:00:00");
    for(d.setDate(d.getDate() - 1); ; d.setDate(d.getDate() - 1)){
      var ds = d.getFullYear() + "-" + pad(d.getMonth()+1) + "-" + pad(d.getDate());
      if(ds < mon) break;
      var dow = d.getDay(), plan = normaliseDay(days[dow]);
      if(!(plan.exercises.length || plan.cardio.length)) continue;
      if(done[dow] || dismissed[ds]) continue;
      return { date: ds, dow: dow, title: plan.title || "Workout" };
    }
    return null;
  }

  /* Today-only exercise order. Stored on the day's log as a list of keys;

  function orderedExercises(plan){

    var pos = {};

    return plan.exercises
      .map(function(ex, i){ return { ex:ex, i:i }; })
      .sort(function(a, b){
        var pa = a.ex.key in pos ? pos[a.ex.key] : order.length + a.i;
        var pb = b.ex.key in pos ? pos[b.ex.key] : order.length + b.i;

  function addExtra(name, libKey, sets, reps, rest){

      if(known){ key = known.key; name = known.name; } else key = slugify(name);

      showToast(name + " is already in this workout");

    var n = Math.min(20, Math.max(1, parseInt(sets, 10) || 3));
    var item = { key:key, name:name, sets:n, reps: String(reps || "").trim() || "8-12", rest: parseInt(rest, 10) || 90 };
    currentLog.extras = (currentLog.extras || []).concat([item]);
    currentDayPlan.exercises.push(Object.assign({}, item, { added:true }));
    var blank = [];
    for(var i=0;i<n;i++) blank.push({ weight:"", reps:"", done:false });
    currentLog.exercises[key] = { unit: preferredUnit(key), sets: blank };
    if(Array.isArray(currentLog.order)) currentLog.order.push(key);

  /* Progress dropdown, grouped by body part. Library exercises use their library group;

  var BODY_PARTS = ["Chest", "Back", "Shoulders", "Biceps", "Triceps", "Legs", "Core", "Other"];

  /* True when neither the library, the name, nor an earlier answer places it. */
  function needsBodyPart(ex){

    return !bodyPartPicks()[ex.key] && guessBodyPart(ex) === "Other";
  }
  function guessBodyPart(ex){
    if(!LIB_GROUP){
      LIB_GROUP = {};
      EXERCISE_LIBRARY.forEach(function(g){ g.items.forEach(function(it){ LIB_GROUP[it.key] = g.group; LIB_GROUP["n:" + looseName(it.name)] = g.group; }); });
    }
    var hit = LIB_GROUP[ex.key] || LIB_GROUP["n:" + looseName(ex.name)];
    if(hit) return hit;
    var name = String(ex.name || "").toLowerCase().replace(/[^a-z0-9]+/g, " ");

  function openMergeSheet(fromKey){

    var others = progressExercises().filter(function(x){ return x.key !== fromKey; }).map(function(x){
      var lx = { loose: looseName(x.name) };
      var sim = similarity(q, lx);
      if(sim === 99) sim = Math.min(similarity(lx.loose, { loose:q }), 99);
      if(sim === 99 && q.length >= 4 && editDistance(q, lx.loose) <= 3) sim = 4;

  function remapLog(d, from, to, toName){
    var changed = false;
    if(d.exercises && d.exercises[from]){
      var a = d.exercises[from], b = d.exercises[to];
      if(b) b.sets = (b.sets || []).concat(a.sets || []);
      else d.exercises[to] = a;
      delete d.exercises[from];
      changed = true;
    }
    if(d.plan && Array.isArray(d.plan.exercises)){
      var hasTo = d.plan.exercises.some(function(x){ return x.key === to; });
      d.plan.exercises = d.plan.exercises.filter(function(x){
        if(x.origKey === from){ x.origKey = to; changed = true; }
        if(x.key !== from) return true;
        changed = true;
        if(hasTo) return false;
        x.key = to; x.name = toName; hasTo = true;
        return true;
      });
    }
    if(Array.isArray(d.order) && d.order.indexOf(from) !== -1){
      var seen = {};
      d.order = d.order.map(function(k){ return k === from ? to : k; }).filter(function(k){ if(seen[k]) return false; seen[k] = true; return true; });
      changed = true;
    }
    if(d.swaps){
      Object.keys(d.swaps).forEach(function(k){
        var sw = d.swaps[k];
        if(sw && sw.key === from){ sw.key = to; sw.name = toName; changed = true; }
        if(sw && sw.from && sw.from.key === from){ sw.from.key = to; sw.from.name = toName; changed = true; }
        if(k === from){ if(!d.swaps[to]) d.swaps[to] = sw; delete d.swaps[from]; changed = true; }
      });
    }
    return changed;
  }
  function remapPlanDays(days, from, to, toName){

      var hasTo = day.exercises.some(function(x){ return x.key === to; });
      day.exercises = day.exercises.filter(function(x){
        if(x.key !== from) return true;

  async function mergeExercises(from, to){

    var toName = nameOfKey(to);
    showToast("Merging…");
    var docs = (await store.queryRecent(2000)).filter(Boolean);
    for(var i=0;i<docs.length;i++){
      var d = docs[i];
      if(d.date && remapLog(d, from, to, toName)){
        d.updatedAt = Date.now();
        await store.setDoc(d.date, d);
      }
    }
    for(var j=0;j<plans.length;j++){
      if(remapPlanDays(plans[j].data.days, from, to, toName)) await store.savePlan(plans[j]);
    }
    if(draft) remapPlanDays(draft.data.days, from, to, toName);
    var prefs = unitPrefs();
    if(prefs[from] && !prefs[to]){ prefs[to] = prefs[from]; writeJSON(cacheNs + "units", prefs); }
    var bpm = bodyPartPicks();
    if(bpm[from]){ if(!bpm[to]) bpm[to] = bpm[from]; delete bpm[from]; store.saveBodyParts(bpm); }
    delete extraExercises[from];
    if(!extraExercises[to] && !allExercises().some(function(x){ return x.key === to; })) extraExercises[to] = toName;
    selectedProgressKey = to;
    var keepTab = activeTab;
    await loadDate(currentDate);
    if(keepTab === "progress" && activeTab === "progress") renderProgress();
    showToast("Merged into " + toName);
  }

  function renderChart(points, unit){
    var el = document.getElementById("chart-card");
    if(!el) return;
    if(points.length < 2){
      el.innerHTML = '<div class="chart-empty">' + (points.length===1 ? "Log this exercise again to see a trend." : "No logged sets yet for this exercise.") + '</div>';
      return;
    }
    var W = 280, H = 110, padX = 8, padY = 14;
    var weights = points.map(function(p){ return p.weight; });
    var min = Math.min.apply(null, weights), max = Math.max.apply(null, weights);
    if(min === max){ min -= 1; max += 1; }
    var stepX = (W - padX*2) / (points.length - 1);
    var coords = points.map(function(p, i){
      var x = padX + i*stepX;
      var y = padY + (1 - (p.weight - min)/(max - min)) * (H - padY*2);
      return [x,y];
    });
    var pathD = coords.map(function(c, i){ return (i===0?"M":"L") + c[0].toFixed(1) + "," + c[1].toFixed(1); }).join(" ");
    var dots = coords.map(function(c){ return '<circle cx="'+c[0].toFixed(1)+'" cy="'+c[1].toFixed(1)+'" r="3" fill="var(--accent)" />'; }).join("");
    var svg = '<svg viewBox="0 0 ' + W + ' ' + H + '" width="100%" height="' + H + '" preserveAspectRatio="none" style="overflow:visible">';
    svg += '<path d="' + pathD + '" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />';
    svg += dots;
    svg += '</svg>';
    svg += '<div style="display:flex;justify-content:space-between;margin-top:6px;font-size:11px;color:var(--text-faint)">';
    svg += '<span>' + roundWeight(min) + ' ' + unit + '</span><span>' + roundWeight(max) + ' ' + unit + '</span></div>';
    el.innerHTML = svg;
  }

  function libraryMatch(name){ return LIB_BY_NAME[String(name || "").trim().toLowerCase()] || null; }

  /* ---------------- Same exercise, different spelling ----------------
     "Lat Pull-Downs", "lat pulldown" and "LAT PULLDOWN" all reduce to
     "latpulldown", so they share one history. */
  function looseName(s){
    return String(s || "").toLowerCase().replace(/&/g, " and ").split(/[^a-z0-9]+/).filter(Boolean)
      .map(function(w){ return w.length > 2 && /[^s]s$/.test(w) ? w.slice(0, -1) : w; })
      .join("");
  }
  function looseWords(s){
    return String(s || "").toLowerCase().split(/[^a-z0-9]+/).filter(function(w){ return w.length > 2; })
      .map(function(w){ return /[^s]s$/.test(w) ? w.slice(0, -1) : w; });
  }
  function editDistance(a, b){
    if(Math.abs(a.length - b.length) > 2) return 99;
    var prev = [], cur, i, j;
    for(j=0;j<=b.length;j++) prev[j] = j;
    for(i=1;i<=a.length;i++){
      cur = [i];
      for(j=1;j<=b.length;j++){
        cur[j] = Math.min(prev[j] + 1, cur[j-1] + 1, prev[j-1] + (a[i-1] === b[j-1] ? 0 : 1));
      }
      prev = cur;
    }
    return prev[b.length];
  }
  /* Everything you've used (plans + logs) first, then the library. */
  function knownExercises(){
    var seen = {}, list = [];
    function add(key, name, mine){
      if(!key || !name || seen[key]) return;
      seen[key] = true;
      list.push({ key:key, name:name, mine:mine, loose: looseName(name) });
    }
    allExercises().forEach(function(x){ add(x.key, x.name, !LIB_BY_KEY[x.key]); });
    Object.keys(extraExercises).forEach(function(k){ add(k, extraExercises[k], !LIB_BY_KEY[k]); });
    EXERCISE_LIBRARY.forEach(function(g){ g.items.forEach(function(it){ add(it.key, it.name, false); }); });
    return list;
  }
  function findKnown(name){
    var q = looseName(name);
    if(!q) return null;
    var list = knownExercises();
    for(var i=0;i<list.length;i++){ if(list[i].loose === q) return list[i]; }
    return null;
  }
  /* History key for a typed name: reuse a matching exercise's key, else make one. */
  function keyForName(name){
    var m = findKnown(name);
    return m ? m.key : slugify(name);
  }
  function similarity(q, x){
    if(!q) return 99;
    if(x.loose === q) return 0;
    if(x.loose.indexOf(q) === 0) return 1;
    if(x.loose.indexOf(q) !== -1) return 2;
    if(q.length >= 5 && editDistance(q, x.loose) <= 2) return 3;
    return 99;
  }
  function suggestionsFor(text, skipKey){
    var raw = String(text || "").trim(), q = looseName(raw);
    if(q.length < 2) return [];
    var hits = [];
    knownExercises().forEach(function(x){
      if(x.key === skipKey) return;
      var s = similarity(q, x);
      if(s < 99) hits.push({ x:x, s:s });
    });
    /* Typed it exactly as an existing name: nothing to suggest. */
    if(hits.some(function(h){ return h.x.name === raw; })) return [];
    hits.sort(function(a, b){ return a.s - b.s || (b.x.mine - a.x.mine) || a.x.name.localeCompare(b.x.name); });
    return hits.slice(0, 4).map(function(h){ return h.x; });
  }
  function suggestHtml(text, skipKey){
    var list = suggestionsFor(text, skipKey);
    if(!list.length) return "";
    var h = '<div class="suggest-label">Same as one of these?</div><div class="suggest-list">';
    list.forEach(function(x){
      h += '<button type="button" class="suggest-chip" data-suggest-key="' + esc(x.key) + '" data-suggest-name="' + esc(x.name) + '">' +
        esc(x.name) + '<span class="suggest-tag">' + (x.mine ? 'Yours' : 'Library') + '</span></button>';
    });
    return h + '</div>';
  }

        if(s && s.key && s.name && !extraExercises[s.key]) extraExercises[s.key] = s.name;
      });
    });
  }

  var DAY_ORDER = [1,2,3,4,5,6,0];

  function uuid(){
    if(window.crypto && crypto.randomUUID) return crypto.randomUUID();
    return "xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx".replace(/[xy]/g, function(c){
      var r = Math.random()*16|0; return (c === "x" ? r : (r&0x3|0x8)).toString(16);
    });
  }
  function slugify(str){
    return String(str || "").toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "") || "exercise";
  }
  function uniqueKey(day, base, self){
    var taken = {};
    day.exercises.concat(day.cardio).forEach(function(x){ if(x !== self) taken[x.key] = true; });
    var k = base, n = 2;
    while(taken[k]){ k = base + "-" + n; n++; }
    return k;
  }
  function blankDays(){
    var d = {};
    for(var i=0;i<7;i++) d[i] = emptyDay();
    return d;

    if(!p) return null;
    p.data.days[editingDay] = normaliseDay(p.data.days[editingDay]);
    return p.data.days[editingDay];
  }
  function dayHasContent(day){
    day = normaliseDay(day);
    return day.exercises.length > 0 || day.cardio.length > 0;
  }
  function planSummary(p){
    var trainingDays = 0, exCount = 0;
    DAY_ORDER.forEach(function(d){
      var day = normaliseDay(p.data.days[d]);
      if(dayHasContent(day)) trainingDays++;
      exCount += day.exercises.length;
    });
    return trainingDays + (trainingDays === 1 ? " training day" : " training days") + " · " + exCount + (exCount === 1 ? " exercise" : " exercises");
  }

  /* Edits only touch the draft. Nothing is stored until you press Save. */

  function startEditing(plan, isNew){

  /* New exercises take their history key from their name until the plan is saved.
     After that the key is fixed, so renaming later keeps your progress history. */
  function lockKeys(plan){
    DAY_ORDER.forEach(function(d){
      var day = normaliseDay(plan.data.days[d]);
      plan.data.days[d] = day;
      day.exercises.concat(day.cardio).forEach(function(x){ delete x.autoKey; delete x.custom; });
    });
  }
  async function saveDraft(){
    if(!draft) return;
    lockKeys(draft);
    var saved = clone(draft);
    var i = plans.findIndex(function(x){ return x.id === saved.id; });
    if(i === -1) plans.push(saved); else plans[i] = saved;
    draftIsNew = false;
    setDirty(false);
    showToast("Plan saved");
    var savedEx = [];
    DAY_ORDER.forEach(function(d){ normaliseDay(saved.data.days[d]).exercises.forEach(function(x){ savedEx.push(x); }); });
    setTimeout(function(){ askBodyParts(savedEx); }, 600);
    await store.savePlan(saved);
    if(!planById(activePlanId)){
      /* First plan you make becomes the active one. */
      activePlanId = saved.id;
      await store.setActivePlan(saved.id);
      if(activeTab === "plans") renderPlans();

  /* Ask before throwing away edits. Resolves to "save", "discard" or "cancel". */
  function confirmLeave(){
    if(!dirty || !draft) return Promise.resolve("discard");
    return new Promise(function(resolve){
      var sheet = document.getElementById("leave-sheet");
      document.getElementById("leave-sheet-title").textContent =
        draftIsNew ? "Save this new plan?" : 'Save changes to "' + (draft.name || "Untitled plan") + '"?';
      sheet.classList.add("show");
      function done(choice){
        sheet.classList.remove("show");
        sheet.removeEventListener("click", onClick);
        resolve(choice);
      }
      function onClick(e){
        var b = e.target.closest("[data-leave]");
        if(b) done(b.dataset.leave);
        else if(e.target === sheet) done("cancel");
      }
      sheet.addEventListener("click", onClick);
    });
  }

    var choice = await confirmLeave();

  /* ---------------- Profile photo: pick, crop to a circle, save ---------------- */
  var cropSheet = null, crop = null;
  var CROP_VIEW = 260, AVATAR_PX = 320;
  function pickAvatar(){
    var inp = document.createElement("input");
    inp.type = "file"; inp.accept = "image/*";
    inp.style.position = "fixed"; inp.style.left = "-9999px";
    document.body.appendChild(inp);
    inp.addEventListener("change", function(){
      var f = inp.files && inp.files[0];
      document.body.removeChild(inp);
      if(f) openCropper(f);
    });
    inp.click();
  }
  function openCropper(file){
    var url = URL.createObjectURL(file);
    var img = new Image();
    img.onload = function(){
      /* shrink big phone photos once so dragging stays smooth */
      var max = 1400, k = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
      var src = document.createElement("canvas");
      src.width = Math.max(1, Math.round(img.naturalWidth * k));
      src.height = Math.max(1, Math.round(img.naturalHeight * k));
      src.getContext("2d").drawImage(img, 0, 0, src.width, src.height);
      URL.revokeObjectURL(url);
      var base = Math.max(CROP_VIEW / src.width, CROP_VIEW / src.height);
      crop = { src: src, base: base, zoom: 1, x: 0, y: 0, pointers: {}, pinch: null };
      showCropSheet();
    };
    img.onerror = function(){ URL.revokeObjectURL(url); showToast("Couldn't open that photo. Try another one."); };
    img.src = url;
  }
  function clampCrop(){
    var sc = crop.base * crop.zoom;
    var mx = Math.max(0, (crop.src.width * sc - CROP_VIEW) / 2), my = Math.max(0, (crop.src.height * sc - CROP_VIEW) / 2);
    crop.x = Math.max(-mx, Math.min(mx, crop.x));
    crop.y = Math.max(-my, Math.min(my, crop.y));
  }
  function drawCrop(ctx, size, overlay){
    var f = size / CROP_VIEW, sc = crop.base * crop.zoom * f;
    var w = crop.src.width * sc, h = crop.src.height * sc;
    ctx.fillStyle = "#121212";
    ctx.fillRect(0, 0, size, size);
    ctx.imageSmoothingQuality = "high";
    ctx.drawImage(crop.src, size/2 + crop.x*f - w/2, size/2 + crop.y*f - h/2, w, h);
    if(overlay){
      ctx.save();
      ctx.fillStyle = "rgba(0,0,0,0.55)";
      ctx.beginPath();
      ctx.rect(0, 0, size, size);
      ctx.arc(size/2, size/2, size/2 - 1*f, 0, Math.PI*2, true);
      ctx.fill("evenodd");
      ctx.strokeStyle = "rgba(255,255,255,0.85)";
      ctx.lineWidth = 2 * f;
      ctx.beginPath(); ctx.arc(size/2, size/2, size/2 - 2*f, 0, Math.PI*2); ctx.stroke();
      ctx.restore();
    }
  }
  function renderCrop(){
    var cv = cropSheet && cropSheet.querySelector("#crop-canvas");
    if(!cv || !crop) return;
    var dpr = Math.min(3, window.devicePixelRatio || 1), size = Math.round(CROP_VIEW * dpr);
    if(cv.width !== size){ cv.width = size; cv.height = size; }
    drawCrop(cv.getContext("2d"), size, true);
  }
  function setZoom(z){
    crop.zoom = Math.max(1, Math.min(4, z));
    clampCrop();
    var sl = cropSheet.querySelector("#crop-zoom");
    if(sl) sl.value = String(crop.zoom);
    renderCrop();
  }
  function showCropSheet(){
    if(!cropSheet){
      cropSheet = document.createElement("div");
      cropSheet.className = "sheet-backdrop";
      cropSheet.setAttribute("role", "dialog");
      cropSheet.setAttribute("aria-modal", "true");
      cropSheet.setAttribute("aria-labelledby", "crop-title");
      document.body.appendChild(cropSheet);
      cropSheet.addEventListener("click", function(e){
        if(e.target.closest("[data-crop-save]")){ saveCrop(); return; }
        if(e.target === cropSheet || e.target.closest("[data-crop-cancel]")) closeCropSheet();
      });
      cropSheet.addEventListener("input", function(e){ if(e.target.id === "crop-zoom") setZoom(parseFloat(e.target.value)); });
    }
    cropSheet.innerHTML = '<div class="sheet crop-sheet"><div class="sheet-title" id="crop-title">Move and zoom</div>' +
      '<p class="sheet-text">Drag to position your photo. Pinch or use the slider to zoom.</p>' +
      '<canvas id="crop-canvas" class="crop-canvas" width="' + CROP_VIEW + '" height="' + CROP_VIEW + '" aria-label="Photo preview"></canvas>' +
      '<label class="crop-zoom-row"><span aria-hidden="true">&minus;</span><input id="crop-zoom" type="range" min="1" max="4" step="0.01" value="1" aria-label="Zoom" /><span aria-hidden="true">+</span></label>' +
      '<div class="plan-actions crop-actions"><button class="pill-btn accent" data-crop-save>Use photo</button><button class="pill-btn" data-crop-cancel>Cancel</button></div></div>';
    var cv = cropSheet.querySelector("#crop-canvas");
    cv.addEventListener("pointerdown", function(e){
      cv.setPointerCapture(e.pointerId);
      crop.pointers[e.pointerId] = { x: e.clientX, y: e.clientY };
      var ids = Object.keys(crop.pointers);
      if(ids.length === 2){
        var a = crop.pointers[ids[0]], b = crop.pointers[ids[1]];
        crop.pinch = { d: Math.hypot(a.x - b.x, a.y - b.y) || 1, zoom: crop.zoom };
      }
    });
    cv.addEventListener("pointermove", function(e){
      var p = crop.pointers[e.pointerId];
      if(!p) return;
      var ids = Object.keys(crop.pointers);
      if(ids.length >= 2 && crop.pinch){
        p.x = e.clientX; p.y = e.clientY;
        var a = crop.pointers[ids[0]], b = crop.pointers[ids[1]];
        setZoom(crop.pinch.zoom * (Math.hypot(a.x - b.x, a.y - b.y) / crop.pinch.d));
        return;
      }
      crop.x += e.clientX - p.x; crop.y += e.clientY - p.y;
      p.x = e.clientX; p.y = e.clientY;
      clampCrop(); renderCrop();
    });
    function up(e){ delete crop.pointers[e.pointerId]; if(Object.keys(crop.pointers).length < 2) crop.pinch = null; }
    cv.addEventListener("pointerup", up);
    cv.addEventListener("pointercancel", up);
    cv.addEventListener("wheel", function(e){ e.preventDefault(); setZoom(crop.zoom * (e.deltaY < 0 ? 1.08 : 1/1.08)); }, { passive:false });
    renderCrop();
    requestAnimationFrame(function(){ cropSheet.classList.add("show"); });
  }
  function closeCropSheet(){ if(cropSheet) cropSheet.classList.remove("show"); crop = null; }
  async function saveCrop(){
    if(!crop) return;

  var restBar = document.getElementById("rest-bar");

  /* The timer tracks the moment rest ends rather than counting ticks.
     Phones pause web pages in the background, so counting ticks loses time;
     working from the end time means it's always right when you come back. */
  var restInterval = null;
  var restState = { active:false, total:0, endAt:0, pausedRemaining:0, name:"", finished:false, paused:false };
  var restScreenMinimized = false;
  var TIMER_KEY_SUFFIX = "timer";

  function fmtTime(sec){

  }

    try{

      if(!raw) return;
      var saved = JSON.parse(raw);
      if(!saved || !saved.s || !saved.s.active) return;
      restState = saved.s;

  /* ---------- Alarm sound ----------
     Played with Web Audio, never an <audio> element. iPhone treats any
     <audio> element as a music track: it stops other apps' music (even when
     muted) and leaves a player on the lock screen. Web Audio does neither.

     The page rests in "ambient", which mixes with other apps' audio and never
     stops your music. Only a ringing alarm in Loud mode switches to "playback",
     which is the one way to be heard with the silent switch on. */
  var ALARM_MODES = ["mix", "loud", "off"];
  function alarmMode(){
    var m = readJSON(cacheNs + "alarm", "off");
    return ALARM_MODES.indexOf(m) === -1 ? "off" : m;
  }
  function setAlarmMode(m){ writeJSON(cacheNs + "alarm", m); }

  function setSession(type){
    try{ if(navigator.audioSession) navigator.audioSession.type = type; }catch(e){}
  }
  function resetAudioSession(){ setSession("ambient"); }
  resetAudioSession();

  /* Clear any lock-screen player left behind by older versions of the app. */
  if("mediaSession" in navigator){
    try{ navigator.mediaSession.metadata = null; navigator.mediaSession.playbackState = "none"; }catch(e){}
  }

  /* Three bright double-tones, about 2 seconds. */
  function alarmSamples(rate){
    var parts = [];
    function tone(freq, secs){ parts.push({ f:freq, n: Math.round(secs*rate) }); }
    function gap(secs){ parts.push({ f:0, n: Math.round(secs*rate) }); }
    for(var r=0;r<3;r++){ tone(1318.5, 0.14); gap(0.06); tone(1760, 0.2); gap(r < 2 ? 0.32 : 0.05); }
    var total = parts.reduce(function(t,p){ return t + p.n; }, 0);
    var out = new Float32Array(total), off = 0, fade = Math.round(0.008*rate);
    parts.forEach(function(p){
      for(var i=0;i<p.n;i++){
        if(p.f){
          var w = 2*Math.PI*p.f*(i/rate);
          var env = Math.min(1, i/fade, (p.n - i)/fade);
          /* a little third harmonic makes it cut through gym noise */
          out[off+i] = (Math.sin(w) + 0.3*Math.sin(3*w)) / 1.3 * 0.95 * env;
        }
      }
      off += p.n;
    });
    return out;
  }

  var audioCtx = null, alarmBuffer = null, alarmSource = null, sessionTimer = null;
  function getCtx(){
    if(!audioCtx){
      var C = window.AudioContext || window.webkitAudioContext;
      if(!C) return null;
      audioCtx = new C();
    }
    return audioCtx;
  }
  function getAlarmBuffer(ctx){
    if(!alarmBuffer){
      var data = alarmSamples(ctx.sampleRate);
      alarmBuffer = ctx.createBuffer(1, data.length, ctx.sampleRate);
      alarmBuffer.getChannelData(0).set(data);
    }
    return alarmBuffer;
  }

  /* Call from a tap: iOS only lets sound start after one. This stays in
     "ambient" and plays nothing audible, so your music keeps going. */
  function unlockAudio(){
    if(alarmMode() === "off") return;
    resetAudioSession();
    var ctx = getCtx();
    if(!ctx) return;
    try{
      if(ctx.state !== "running") ctx.resume();
      var src = ctx.createBufferSource();
      src.buffer = ctx.createBuffer(1, 1, ctx.sampleRate);
      src.connect(ctx.destination);
      src.start(0);
    }catch(e){}
  }

  function playAlarm(force){
    var mode = alarmMode();
    if(!force && mode === "off") return;
    setSession(mode === "loud" ? "playback" : "ambient");
    var ctx = getCtx();
    if(!ctx) return;
    function go(){
      stopAlarmSound(true);
      var src = ctx.createBufferSource();
      src.buffer = getAlarmBuffer(ctx);
      src.connect(ctx.destination);
      src.onended = function(){ if(alarmSource === src){ alarmSource = null; settleSession(); } };
      src.start(0);
      alarmSource = src;
    }
    try{
      if(ctx.state !== "running") ctx.resume().then(go).catch(function(){});
      else go();
    }catch(e){}
  }

  function settleSession(){
    clearTimeout(sessionTimer);
    sessionTimer = setTimeout(resetAudioSession, 150);
  }
  function stopAlarmSound(keepSession){
    if(alarmSource){
      try{ alarmSource.onended = null; alarmSource.stop(); }catch(e){}
      alarmSource = null;
    }
    if(!keepSession) settleSession();
  }

  /* ---------------- Rest alerts (push notifications) ----------------
     When you tick a set, the app tells the server when your rest ends
     (a row in rest_alarms). The server sends a notification at that moment,
     so it arrives with the app closed or the phone locked, uses the phone's
     own alert sound, and doesn't stop your music. */
  var PUSH_KEY_SUFFIX = "pushEndpoint";
  function isIOS(){
    return /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
  }
  function isStandalone(){
    return (window.matchMedia && window.matchMedia("(display-mode: standalone)").matches) || navigator.standalone === true;
  }
  function pushSupport(){
    var cfg = window.SETLOG_CONFIG || {};
    if(!cfg.vapidPublicKey) return "not-configured";
    var capable = ("serviceWorker" in navigator) && ("PushManager" in window) && ("Notification" in window);
    if(isIOS() && !isStandalone()) return "install";
    if(!capable) return "unsupported";
    if(Notification.permission === "denied") return "denied";
    return "ok";
  }
  function pushEndpoint(){ return readJSON(cacheNs + PUSH_KEY_SUFFIX, ""); }
  function pushEnabled(){
    return pushSupport() === "ok" && Notification.permission === "granted" && !!pushEndpoint();
  }
  function b64ToBytes(b64){
    var pad = "=".repeat((4 - b64.length % 4) % 4);
    var raw = atob((b64 + pad).replace(/-/g, "+").replace(/_/g, "/"));
    var out = new Uint8Array(raw.length);
    for(var i=0;i<raw.length;i++) out[i] = raw.charCodeAt(i);

  /* Must start from a tap: iOS only shows the permission prompt then. */
  async function enablePush(){

    var reg = await navigator.serviceWorker.ready;
    var sub = await reg.pushManager.getSubscription();
    var wantKey = b64ToBytes(window.SETLOG_CONFIG.vapidPublicKey);
    if(sub && sub.options && sub.options.applicationServerKey){

      var have = new Uint8Array(sub.options.applicationServerKey);
      var same = have.length === wantKey.length && have.every(function(b, i){ return b === wantKey[i]; });
      if(!same){ try{ await sub.unsubscribe(); }catch(e){} sub = null; }
    }
    if(!sub){
      sub = await reg.pushManager.subscribe({
        userVisibleOnly: true,
        applicationServerKey: wantKey
      });
    }

    var res = await sb.from("push_subscriptions").upsert(
      { endpoint: json.endpoint, user_id: currentUserId, subscription: json },
      { onConflict: "endpoint" }
    );

    writeJSON(cacheNs + PUSH_KEY_SUFFIX, json.endpoint);

    var list = orderedExercises(currentDayPlan);
    var at = -1;
    list.forEach(function(x, i){ if(x.key === finishedKey) at = i; });
    var rotated = list.slice(at + 1).concat(list.slice(0, Math.max(at, 0)));
    for(var i=0;i<rotated.length;i++){
      var l = currentLog.exercises[rotated[i].key];
      if(l && !l.skipped && !l.sets.every(function(x){ return x.done; })) return { name: rotated[i].name || "your next exercise" };
    }
    var cardio = (currentDayPlan.cardio || []).filter(function(c){ var cl = currentLog.cardio[c.key]; return cl && !cl.done && !cl.skipped; });
    if(cardio.length) return { name: cardio[0].name || "your cardio" };
    return { done:true };
  }

  function startRest(seconds, name, next){
    if(!seconds || seconds <= 0) return;
    unlockAudio();
    var alertTitle = "Rest over", alertBody = "Time for your next set of " + (name || "this exercise") + ".";
    var label = name;
    if(next && next.done){ alertTitle = "Workout done"; alertBody = "That was your last set today. Nice work."; label = "Last set done"; }
    else if(next){ alertTitle = "Next up: " + next.name; alertBody = (name ? name + " is done. " : "") + "Time for " + next.name + "."; label = "Next up: " + next.name; }
    restState = { active:true, total:seconds, endAt: Date.now() + seconds*1000, pausedRemaining:0, name:label, finished:false, paused:false, alertTitle:alertTitle, alertBody:alertBody };
    restScreenMinimized = false;
    persistTimer();
    clearRestNotifications();
    scheduleRestAlert(restState.endAt, name, alertTitle, alertBody);
    askForPushOnFirstRest();
    runTicker();
    renderRest();
  }

  function runTicker(){
    clearInterval(restInterval);
    restInterval = setInterval(function(){ tick(false); }, 250);
  }

  var lastShownSecond = -1;
  function tick(force){
    if(!restState.active){ clearInterval(restInterval); return; }
    var r = restRemaining();
    if(!restState.finished && !restState.paused && r <= 0){
      onRestComplete();
      return;
    }
    if(force || r !== lastShownSecond){
      lastShownSecond = r;
      renderRest();
    }
  }

  var PAUSE_ICON = '<svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><rect x="3" y="2" width="3.5" height="12" rx="1" fill="currentColor"/><rect x="9.5" y="2" width="3.5" height="12" rx="1" fill="currentColor"/></svg>';
  var PLAY_ICON = '<svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M4 2.5v11a1 1 0 0 0 1.5.86l9-5.5a1 1 0 0 0 0-1.72l-9-5.5A1 1 0 0 0 4 2.5z" fill="currentColor"/></svg>';

  function togglePause(){
    if(!restState.active || restState.finished) return;
    unlockAudio();
    if(restState.paused){
      restState.endAt = Date.now() + restState.pausedRemaining*1000;
      restState.paused = false;
    } else {
      restState.pausedRemaining = restRemaining();
      restState.paused = true;
    }
    persistTimer();
    if(restState.paused) cancelRestAlert();
    else scheduleRestAlert(restState.endAt, restState.name, restState.alertTitle, restState.alertBody);
    renderRest();
  }

  function adjustRest(deltaSec){
    if(!restState.active || restState.finished) return;
    unlockAudio();
    if(restState.paused){
      restState.pausedRemaining = Math.max(0, restState.pausedRemaining + deltaSec);
    } else {
      restState.endAt = Math.max(Date.now(), restState.endAt + deltaSec*1000);
    }
    restState.total = Math.max(restState.total, restRemaining());
    persistTimer();
    if(restRemaining() <= 0){ restState.paused = false; cancelRestAlert(); onRestComplete(); return; }
    if(!restState.paused) scheduleRestAlert(restState.endAt, restState.name, restState.alertTitle, restState.alertBody);
    renderRest();
  }

  function renderPauseButtons(){
    var paused = !!restState.paused;
    [document.getElementById("rs-pause"), document.getElementById("rest-pause")].forEach(function(btn){
      if(!btn) return;
      btn.innerHTML = paused ? PLAY_ICON : PAUSE_ICON;
      btn.setAttribute("aria-label", paused ? "Resume timer" : "Pause timer");
    });
    restScreen.classList.toggle("paused", paused);
    restBar.classList.toggle("paused", paused);
  }

  function onRestComplete(){
    restState.finished = true;
    restState.paused = false;
    restScreenMinimized = false;
    persistTimer();
    renderRest();
    /* Only alert when you can actually see or hear it; if the rest finished
       while you were away, this runs as soon as you come back. */
    if(document.visibilityState === "visible") alertRestDone();
    else pendingAlert = true;
  }
  var pendingAlert = false;
  function alertRestDone(){
    pendingAlert = false;
    if(navigator.vibrate){ try{ navigator.vibrate([200,100,200]); }catch(e){} }
    beep();
  }

  function beep(){ playAlarm(false); }

  function stopRest(){
    releaseAlarm();
    if(!restState.finished) cancelRestAlert();
    clearRestNotifications();
    clearInterval(restInterval);
    restState.active = false;
    restScreenMinimized = false;
    pendingAlert = false;
    persistTimer();
    renderRest();
  }

  function renderRest(){
    renderRestBar();
    renderRestScreen();
    document.body.classList.toggle("timer-on", restState.active && restScreenMinimized);
  }

  function renderRestBar(){
    if(!restState.active){
      restBar.classList.remove("show");
      return;
    }
    placeRestBar();
    restBar.classList.add("show");
    renderPauseButtons();
    var r = restRemaining();
    var miniPause = document.getElementById("rest-pause");
    if(miniPause) miniPause.style.display = restState.finished ? "none" : "flex";
    restTimeEl.textContent = restState.finished ? "Done" : fmtTime(r);
    restNameEl.textContent = restState.name;
    var pct = restState.total ? Math.round((1 - r/restState.total) * 100) : 0;
    restRing.style.setProperty("--pct", restState.finished ? 100 : pct);
  }

  function renderRestScreen(){
    if(!restState.active || restScreenMinimized){
      restScreen.classList.remove("show");
      return;
    }
    restScreen.classList.add("show");
    rsExercise.textContent = restState.name;
    var r = restRemaining();
    var pct = restState.total ? Math.round((1 - r/restState.total) * 100) : 0;
    rsRingWrap.style.setProperty("--pct", restState.finished ? 100 : pct);
    if(restState.finished){
      rsLabel.textContent = "Rest complete";
      if(!rsRingWrap.querySelector(".rs-done-check")) rsRingWrap.innerHTML = '<span class="rs-done-check">&#10003;</span>';
      rsAdjust.style.display = "none";
      rsSkipFull.textContent = "Continue";
      rsSkipFull.classList.add("primary");
    } else {
      rsLabel.textContent = restState.paused ? "Paused" : "Rest";
      var big = document.getElementById("rs-time-big");
      if(!big){
        rsRingWrap.innerHTML = '<span class="rs-time" id="rs-time-big"></span>';
        big = document.getElementById("rs-time-big");
      }
      big.textContent = fmtTime(r);
      rsAdjust.style.display = "flex";
      rsSkipFull.textContent = "Skip rest";
      rsSkipFull.classList.remove("primary");
    }
  }

  /* Keep the minimised bar above the Today / Progress / Plans tabs. */
  function placeRestBar(){
    var nav = document.querySelector("nav.tabs");
    if(nav) restBar.style.bottom = nav.getBoundingClientRect().height + "px";
  }
  window.addEventListener("resize", placeRestBar);

  /* Catch up the moment you return to the app. */
  function onReturn(){
    if(!restState.active) return;
    tick(true);
    if(pendingAlert && document.visibilityState === "visible") alertRestDone();
  }
  document.addEventListener("visibilitychange", onReturn);
  window.addEventListener("pageshow", onReturn);
  window.addEventListener("focus", onReturn);

  document.getElementById("rest-plus").addEventListener("click", function(){ adjustRest(15); });
  document.getElementById("rest-minus").addEventListener("click", function(){ adjustRest(-15); });
  document.getElementById("rest-skip").addEventListener("click", stopRest);
  document.getElementById("rs-plus").addEventListener("click", function(){ adjustRest(15); });
  document.getElementById("rs-minus").addEventListener("click", function(){ adjustRest(-15); });
  rsSkipFull.addEventListener("click", stopRest);
  document.getElementById("rs-pause").addEventListener("click", togglePause);
  document.getElementById("rest-pause").addEventListener("click", togglePause);
  document.getElementById("rs-close").addEventListener("click", stopRest);
  document.getElementById("rs-minimize").addEventListener("click", function(){
    restScreenMinimized = true;
    persistTimer();
    renderRest();
  });
  restBar.addEventListener("click", function(e){
    if(e.target.closest("button")) return;
    if(!restState.active) return;
    restScreenMinimized = false;
    persistTimer();
    renderRest();
  });

  /* ---------------- Boot ---------------- */
  async function boot(){
    try{
      store = await initStore();
    }catch(e){
      content.innerHTML = '<div class="rest-day"><div class="big">Setup needed</div>Supabase URL and anon key are missing. Check the environment variables in Vercel.</div>';
      if(window.__splash) window.__splash.ready();
      return;
    }
    updateSyncDot();
    currentAvatar = localAvatar();
    updateHeaderAvatar();
    store.getBodyParts().then(function(){ if(activeTab === "progress") renderProgress(); });
    var shownAvatar = currentAvatar;
    store.getAvatar().then(function(v){
      if(v === shownAvatar) return;
      currentAvatar = v; updateHeaderAvatar();
      if(activeTab === "profile" || activeTab === "plans") render();
    });
    restoreTimer();
    autoEnablePush();
    var loaded = await store.loadPlans();
    plans = loaded.plans;
    var settings = await store.getSettings();
    activePlanId = settings.activePlanId;
    if(plans.length && !planById(activePlanId)){
      activePlanId = plans[0].id;
      await store.setActivePlan(activePlanId);
    }
    await loadDate(todayStr());
    if(window.__splash) window.__splash.ready();
    loadKnownExercises();
  }
  boot();

  if("serviceWorker" in navigator){
    window.addEventListener("load", function(){
      navigator.serviceWorker.register("/sw.js").catch(function(){});
    });
  }
})();
</script>
</body>
</html>
